services:
  datahub:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMIN_KEY_FILE: /run/secrets/admin_key
      DATAHUB_DATABASE: /data/statistics.sqlite
      DATAHUB_ALLOWED_HOSTS: ${DATAHUB_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DATAHUB_PUBLIC_ORIGIN: ${DATAHUB_PUBLIC_ORIGIN:-}
      DATAHUB_COOKIE_SECURE: ${DATAHUB_COOKIE_SECURE:-0}
    secrets:
      - admin_key
    volumes:
      - statistics:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  admin_key:
    file: ./secrets/admin-key.txt
volumes:
  statistics:
