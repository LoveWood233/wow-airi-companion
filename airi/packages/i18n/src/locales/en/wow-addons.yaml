errors:
  unknown: The request failed. Try again.
  curseforge-api-key-required: Add a CurseForge API key in addon settings.
  curseforge-unauthorized: CurseForge rejected the API key. Check the key in addon settings.
  curseforge-rate-limited: CurseForge has limited requests. Wait and try again.
  curseforge-timeout: CurseForge did not respond in time. Try again.
  curseforge-invalid-response: CurseForge returned an invalid response. Try again.
  curseforge-response-too-large: The CurseForge response exceeds the supported size.
  curseforge-request-failed: The CurseForge request failed. Check your connection and try again.
  curseforge-invalid-request: The request is invalid. Check the configured game version and try again.
  curseforge-too-many-files: This addon has too many files to load safely. Select another addon.
  curseforge-too-many-redirects: The download has too many redirects. Try again later.
  curseforge-not-found: CurseForge cannot find this addon or file. Refresh the addon list.
  curseforge-disposed: The addon service stopped. Reopen the addon center and try again.
  curseforge-incompatible-version: This addon file does not match the configured game version.
  curseforge-distribution-disabled: The author does not allow this addon to install through third-party tools.
  curseforge-download-unavailable: CurseForge has no download for this addon file.
  curseforge-unsafe-download-url: The download address failed validation.
  curseforge-download-integrity: The addon download failed its integrity check. Try again.
  wow-addons-settings-invalid: Check the addon settings and try again.
  wow-addons-directory-required: Set the WoW client directory in addon settings.
  wow-addons-version-required: Select a compatible game version in addon settings.
  wow-addons-busy: Another addon operation is in progress. Wait for it to finish.
  wow-addons-key-storage-unavailable: Secure key storage is unavailable. Restart WoW Companion and try again.
  wow-addons-key-unreadable: WoW Companion cannot read the saved API key. Save the key again.
  wow-addons-required-dependency: A required addon dependency could not install. Try again.
  wow-addons-unmanaged-conflict: An unmanaged addon folder already exists. Move it before you install this addon.
  wow-addons-folder-conflict: An addon folder conflicts with another addon. Move it before you install this addon.
  wow-addons-unsafe-archive: The addon archive contains unsafe paths and cannot install.
  wow-addons-install-failed: Installation failed. Check the client directory and try again.
  wow-addons-invalid-directory: The client directory is invalid or unavailable. Check the path in addon settings.
  wow-addons-invalid-archive: The addon archive is invalid or unsafe and cannot install.
  wow-addons-directory-conflict: An existing addon folder conflicts with this installation. Move the conflicting folder before you retry.
  wow-addons-request-failed: The addon operation failed. Check the client directory and try again.
  wow-addons-dependency-limit: The addon requires too many nested dependencies to install safely.
  wow-addons-stopped: The addon operation stopped. Reopen the addon center and try again.
