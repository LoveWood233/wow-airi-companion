notices:
  committed-talents-unavailable: Stable committed talents for this class are unavailable.
  build-mapping-unverified: Source and client builds do not establish an exact node mapping. Current rank remains unknown.
  current-rank-unknown: The current rank is unknown. A missing selected node is not rank zero.
  node-reference-unavailable: This node has no verified reference record.
  plan-rank-exceeds-node: The requested rank exceeds the known node maximum. Its rank difference is not calculated.
  base-item-not-instance: The catalog describes a base item, not a verified bonus instance matching the observed item link.
  no-performance-score: No damage simulation, stat weights, or best-in-slot ranking is calculated.
  other-slots-not-summed: Only the explicitly selected slot is compared; other equipped slots are not summed or removed.
  equipment-observation-unavailable: A matching equipped-item snapshot is unavailable.
  baseline-slot-unknown: The selected equipped slot is unknown. It is not treated as empty.
  slot-compatibility-unknown: Slot matching is unverified; class, race, level, and specialization eligibility are not established.
  slot-incompatible: The source item slot does not match the selected equipped slot.
  weapon-pair-requires-review: Main-hand and off-hand interactions require separate review.
  two-hand-requires-review: A two-hand item may affect the off-hand slot. This comparison does not remove it automatically.
  baseline-stats-partial: Observed item attributes are incomplete or truncated. Missing values remain unknown.
  candidate-stats-partial: Catalog attributes are partial. Missing values do not establish zero.
  retail-observations-only: Retail talent results use actual client observations only, without Forever talent mechanics.
  missing-nodes-not-zero: Only explicit zero-rank observations establish rank zero. Other absent nodes remain unknown.
  prerequisites-partial: Prerequisites are not fully verified.
  local-db2-only: These Retail references come only from the selected local DB2 snapshot.
  raw-spell-template: Raw spell templates do not establish the final effect at the character's level.
  level-scaling-unresolved: Level scaling and the character's final spell values are unresolved.
  raw-item-fields: Raw DB2 fields are shown without interpreting scaling distributions as flat attributes.
  item-scaling-unresolved: Local item scaling and bonus-instance attributes are unresolved.
  base-spell-values: Spell descriptions describe source base values, not verified final character effects.
  source-level-capped: The Forever source accepts levels through 60; the source query was capped at 60.
  description-unavailable: The source spell description is unavailable.
  proc-rate-unverified: Effect text does not establish proc rate, uptime, or active set bonuses.
  effects-unavailable: Verified catalog effect descriptions are unavailable.
  purchased-node-inactive: Points were purchased for this node, but this observation does not show an active spell from it.
  result-truncated: The explanation reached its node limit. Omitted nodes remain unknown.
  source-adjusted-node: The source adjusted a node without providing a detailed reason.
errors:
  invalid-query: Check the game, class, level, node or spell ID, and equipped slot.
  invalid-plan: The plan format is invalid. Use a supported talent link or explicit nodeId/rank JSON array.
  source-unavailable: The reference source is unavailable. Check the MCP connection and retry.
  source-invalid: The source returned an unsupported or mismatched record.
  telemetry-unavailable: Character observations are unavailable or changed during the query. Check the game connection and retry.
  unsupported-plan: This plan format is unsupported for the selected game. Game import codes are not decoded.
  database-unavailable: The local Retail database is unavailable. Select and verify it in the read-only database settings.
  generic: The explanation could not be loaded. Check the inputs and data connection.
