title: WoW Companion
description: Stay together in Azeroth. Read character status and respond to important moments.
product:
  about-title: About WoW Companion
  description: World of Warcraft companionship, voice chat, and addon management.
  version: Version
  project: Project
  third-party: Third-party licenses
  license-note: This software uses open-source components. Their copyright notices and licenses remain in source and distribution files.
  local-provider-note: Configure chat and speech services in settings. No application account is required.
connection: Game connection
last-seen: Last observation
demo-warning: This is simulated data. It does not describe a real character.
model-required: Select a chat provider and model in WoW Companion to enable character replies. Speech uses your existing voice settings.
start-bridge: WoW Companion starts the local bridge when this connection is enabled. Keep the addon grid visible. Python 3.10 or later is required on Windows.
player: Character
level: Level
zone-label: Location
class-spec: Class / specialization ID
faction: Faction
race: Race
identity-unknown: Unknown
