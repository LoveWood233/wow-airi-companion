title: WoW Companion
connection-details:
  title: Connection diagnostics and reception
  description: Validate the selected game window locally. Moves and resizes trigger local recovery. Three advancing heartbeats must pass validation before a new calibration is saved.
  heartbeat: Heartbeat confirmation
  confirmation: 'Advancing heartbeats: {count}/3'
  last-frame: 'Last valid data frame:'
  last-heartbeat: 'Last character heartbeat:'
  calibrated-at: 'Last confirmed calibration:'
  retry-after: 'Retry in {seconds} seconds'
  position: 'Last confirmed position: {x}, {y} · Horizontal/vertical pitch {px} / {py} pixels'
  retry: Relocate and retry reception
  retry-started: Relocation requested. Wait for three advancing heartbeats. Fragment reception waits for subsequent addon broadcasts.
  retry-help: Discard incomplete fragments and verify the window again. Saved history and calibration remain. Reception waits for subsequent addon broadcasts.
  update-bridge: This bridge does not report diagnostics. Restart the new companion build and its bridge.
  transfers: Fragment reception
  no-transfers: No fragment reception has been recorded. Character heartbeats use complete frames.
  transfer-time: 'Elapsed {elapsed} seconds · Timeout {timeout} seconds'
  phases:
    disabled: Connection disabled for this version
    demo: Demo data does not prove a real connection
    paused: Screen reading paused
    unavailable: Waiting for bridge diagnostics
    locating: Locating the telemetry grid locally
    validating: Confirming advancing heartbeats
    connected: Current window and grid confirmed
    waiting-character: Grid confirmed, waiting for an online character
    blocked: Reading temporarily unavailable
    error: Calibration failed
    stale: Character heartbeat expired
  reasons:
    window-missing: No verifiable window for this game version was found. Start the game and check the client version.
    window-minimized: The game window is minimized. Restore it to resume reading.
    window-hidden: The game window is hidden. Restore a visible window.
    multiple-windows: Multiple matching windows were found. Keep one target game window open to avoid an automatic choice.
    window-changed: Window identity or position changed during capture. Verification restarts.
    grid-unreadable: No valid grid was decoded. Check the addon, grid visibility, overlays, and manual calibration origin.
    access-denied: Windows denied window or capture access. Check process permissions.
    capture-failed: Local capture failed. Check the window and retry.
    calibration-save-failed: The verified position could not be saved. The previous calibration remains. Check directory permissions and retry.
    heartbeat-stale: Heartbeats stopped advancing. Check that the character is online and retry.
    unsupported-platform: Window tracking and real capture require Windows.
    window-query-failed: Windows game-window discovery failed. Retry the connection.
  kinds:
    eq: Acquired equipment
    cmp: Equipment comparison
    gear: Equipped-item snapshot
    calendar: Game calendar
  transfer-phases:
    receiving: Receiving
    complete: Reception complete
    timed-out: Timed out, incomplete data discarded
    error: Fragment validation failed
setup:
  title: Setup checks
  description: Check the selected game and local configuration. Chat and speech tests require a click. Failed checks do not change settings.
  directory: Game client directory
  directory-help: Select the version folder containing WoW.exe and .flavor.info, such as _retail_. Do not select AddOns. You can edit this path and recheck.
  choose: Choose directory
  check: Check again
  checked-at: Last check
  check-failed: Some checks did not finish. Retry. Missing results never count as passed.
  install: Install or update companion addon
  install-failed: The addon installation did not finish. Check permissions, the selected game, and bundled files, then retry.
  restart-game: Addon files were updated. Restart the game, enable the addon, and enter the world. File checks do not prove in-game loading.
  backup: Previous addon backup
  calibrate: Open connection and calibration
  configure: Open configuration
  test-chat: Test chat
  cancel-test: Cancel test
  preview: Preview speech
  heard: I heard it
  not-heard: I heard nothing
  cost-note: Tests use your selected providers and can incur charges. They do not send character history, screenshots, or tool requests.
  chat-prompt: This is a connection test. Reply with one short greeting. Do not use tools.
  speech-phrase: Hello from WoW Companion. Select I heard it after you hear this sentence.
  labels:
    client: Game client and version
    addon: Companion addon and version
    python: Python runtime
    bridge: Bridge files and runtime state
    capture: Telemetry grid and live character
    chat: Chat model
    speech: Voice and preview confirmation
  statuses:
    passed: Passed
    failed: Failed
    unconfigured: Not configured
    untested: Not tested
  codes:
    not-tested: No valid check or live test has completed.
    choose-client: Choose the game client directory first.
    client-found: Installation metadata matches the selected game.
    client-invalid: The directory or game version could not be confirmed. Check the selected path and game.
    addon-found: The addon version matches and all listed Lua files exist.
    addon-version: The installed version differs from the bundled addon, or no bundled version is available for comparison.
    addon-missing: Addon files are missing or unreadable. Select install or update to replace them.
    python-missing: No working Python 3.10 or newer was found. Install Python, then retry.
    python-found: A process check found a working Python 3.10 or newer.
    resources-missing: Bridge files are missing. Check the application installation or source directory.
    resources-found: The bridge entry file exists. Check connection status for actual startup and capture results.
    bridge-runtime-error: The bridge reported a startup or connection error. Open connection settings to resolve it.
    bridge-unavailable: The current connection status could not be read. Retry the check.
    bridge-not-started: Bridge files exist, but a running bridge was not observed during this check. Enable the connection, then recheck.
    windows-required: Screen capture bridging requires Windows.
    connection-disabled: This game's companion connection is disabled. Enable it in connection settings.
    demo-not-live: Demo data does not prove a live character connection.
    live-character: Recent screen data identifies a live character for this game.
    calibrate: No valid live character data was received. Enter the game, uncover the grid, and check its coordinates and cell size.
    chat-configure: Select a chat provider and model before testing.
    chat-response: The selected provider and model returned a nonempty test response.
    speech-configure: Configure a speech provider, model, and voice before previewing.
    confirm-heard: Playback started. Confirm whether you heard it.
    heard: The user confirmed hearing the preview.
    not-heard: The user heard nothing. Check volume, output devices, and speech settings, then retry.
    test-failed: The test failed or timed out. Check the selected provider and configuration, then retry.
guide:
  title: Getting started
  description: Follow the spotlight and speech bubbles through character, model, voice, and game settings. Skip any time and reopen this guide from Settings.
  game: Game version for this guide
  start: Start guide
  restart: Start again
  continue: Continue previous tour
  no-changes: The guide does not change settings automatically. Addon installation and provider tests require a click. Finishing does not confirm successful configuration.
  progress: 'Getting started · Step {current} of {total}'
  previous: Back
  next: Next
  configure: Configure this page
  resume: Continue guide
  skip: Skip for now
  complete: Finish guide
  target-unavailable: Page content is not visible yet. Configure this page or continue to the next step.
  navigation-failed: The settings page did not open. Retry or reopen the guide from Settings later.
  open-failed: The guide did not open. Select Getting started in Settings to retry.
  steps:
    welcome:
      title: Welcome to WoW Companion
      body: Choose Retail or Forever here. Select Next to explore settings. Select Configure this page to hide the overlay while you work. Press Escape to skip.
    model:
      title: Choose your companion character
      body: Select or import a character model, preview it, and adjust its appearance. Character models and chat models have separate settings. You can continue without importing one.
    providers:
      title: Configure model services
      body: Choose your chat, speech, or vision services. Enter their endpoints and credentials, then run the available connection checks. The guide never enters credentials for you.
    chat:
      title: Let your character respond
      body: Select a configured chat service and model. Send a greeting in the character chat to check its response. Speech requires separate configuration in the next step.
    speech:
      title: Choose and preview a voice
      body: Select a speech service, model, and voice, then run a preview. For voice input, configure Hearing and your microphone separately. Text chat works without speech.
    connection:
      title: Connect your Warcraft character
      retail: Install WoWMapCompanion in Retail's Interface/AddOns folder. Enable it and enter the world. Windows releases include Python. Development mode requires Python 3.10 or later. Enable the companion connection. Keep the 64×64 telemetry grid visible and calibrate its screen position. Check that the displayed character is live, rather than demo data.
      forever: Install WoWForeverCompanion in your Forever client's Interface/AddOns folder. Restart the game and enter the world. Windows releases include Python. Development mode requires Python 3.10 or later. Enable the Forever connection. Keep the 64×64 telemetry grid visible and calibrate its position. Check client API compatibility in the game.
    chatter:
      title: Set your reminder and chatter pace
      body: Configure ordinary chatter, scenery chatter, and location lore separately. Check mute and combat settings. Scenery chatter requires vision, chat, and speech services and consumes provider usage.
    vision:
      title: Enable game screenshots when needed
      body: Configure vision and enable screenshot assistance here. Ask “look at this” or use /look. Images go to your configured model services. Leave this disabled until needed.
    knowledge:
      title: Connect Forever reference tools
      body: MCP settings manage external tools. For Forever, use wuxianwow at https://wuxianwow.com/mcp with Streamable HTTP. No login is required. Check its connection and ask about Thorium Bars. Check source links and keep Forever data separate from Retail.
    launcher:
      title: Set up game shortcuts
      body: Configure Battle.net or your game executable and choose a default target. Launch it from the character toolbar. Starting a process does not confirm game login.
    finish:
      title: Return to your character and start chatting
      body: Check chat replies, voice preview, and the live character connection. Equipment changes still require in-game confirmation. Reopen Getting started from Settings whenever needed. Finishing records tour progress only.
