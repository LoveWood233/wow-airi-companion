equipment-prompt:
  review: 'New equipment: {name}. Item level at acquisition: {oldLevel} → {newLevel}. {reason}. A higher item level alone does not confirm an upgrade. Compare its attributes and restrictions in your bags before changing equipment.'
  message: 'Congratulations on your new equipment, {name}! You have grown stronger. {reason} Confirm the equipment change in the game.'
  message-player: '{player}, congratulations on your new equipment, {name}! You have grown stronger. {reason} Confirm the equipment change in the game.'
  message-player-tradeoff: '{player}, congratulations on your new equipment, {name}! Your primary stat can improve. {reason} Review the trade-offs and confirm the equipment change in the game.'
  reason:
    stats: 'Its recorded attributes clearly improve after comparison ({oldLevel} → {newLevel} item level).'
    empty: Its destination slot is empty.
    tradeoff: 'Item level {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, but {decreases}. These attributes have trade-offs. Overall benefit is not guaranteed.'
    separator: ', '
  accepted: Please click “Confirm change” in the game. WoW Companion does not send input to the game.
  accept: Yes
  decline: No thanks
  timeout: Choose within 10 seconds. No choice closes this reminder. Equipment changes still require confirmation in the game.
  description: 'The addon compares equipment. Review the attributes and confirm each change in the game.'

