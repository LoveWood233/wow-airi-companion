equipment-swaps:
  title: Equipment change results
  description: The addon asks about eligible new equipment with a higher item level or an empty slot. Each change requires confirmation.
  confirmation: Confirm inside the game. Choosing Yes in AIRI shows the next step. It does not change equipment or send input to the game.
  empty: No equipment confirmation results in this character session.
  bridge-update: This bridge does not supply equipment change results. Update the addon and bridge, then restart AIRI.
  read-error: Some equipment results are unavailable.
  historical: Last known results. AIRI does not use them as live context while the connection or result data is unavailable.
  observed: Result time
  previous: Previous item
  empty-slot: Empty slot
  expired-reason: The question expired. The addon did not execute the change.
  scope-note: These records describe past actions, not current equipment. A higher item level does not guarantee better attributes or set effects.
  status:
    equipped: Change confirmed
    declined: Declined
    failed: Not confirmed
    expired: Question expired
  reason:
    confirmed: The addon confirmed the equipment change after your approval in the game.
    user: You declined the change in the game.
    timeout: The addon did not confirm the result. Check your equipment in the game.
    combat: Combat interrupted the request. Confirm a new request after combat ends.
    changed: The item or destination slot changed. The request stopped.
    unavailable: Required item information or game functions were unavailable.
    locked: The item was locked. The request stopped.
    cursor: The cursor held an item. The request stopped.
    dead: The character was dead. The request stopped.
    restricted: The game restricted the action. The request stopped.
    disabled: Equipment confirmation was disabled. The request stopped.
    left_world: The character left the world. The request stopped.
  slots:
    '1': Head
    '2': Neck
    '3': Shoulders
    '4': Shirt
    '5': Chest
    '6': Waist
    '7': Legs
    '8': Feet
    '9': Wrists
    '10': Hands
    '11': Finger 1
    '12': Finger 2
    '13': Trinket 1
    '14': Trinket 2
    '15': Back
    '16': Main hand
    '17': Off hand
    '18': Ranged
    '19': Tabard
equipment-prompt:
  message: 'Congratulations on {name}! {reason} Do you want to change equipment?'
  reason:
    higher: 'Its item level is {newLevel}, compared with {oldLevel} for your current item.'
    empty: Its destination slot is empty.
  accepted: Please click “Confirm change” in the game. AIRI does not send input to the game.
  accept: Yes
  decline: No thanks
  timeout: Choose within 10 seconds. No choice closes this reminder. Equipment changes still require confirmation in the game.
  description: These suggestions use item level or an empty slot. They do not compare attribute, bonus, or set benefits.
