  empty: No equipment history yet. Existing bag items are not a new acquisition.
  bridge-update: This bridge only provides character data. Stop the old standalone bridge, then restart WoW Companion to read equipment with the updated bridge.
  capture-note: Use a 100 ms capture interval for quick equipment questions. Longer intervals can repeatedly miss equipment fragments.
  historical: Historical record
  character: Character
  realm: Realm
  received: Received by WoW Companion
  storage-error: Equipment history failed to load or save. Disk storage is not confirmed. Check the error and available disk space.
  unnamed: 'Item {id}'
  unavailable: Unavailable
  item-level: Item level
  observed: Observed at
  completeness: Data availability
  infoComplete: Item details
  statsComplete: Numeric attributes
  tooltipComplete: Tooltip
  complete: Read
  incomplete: Incomplete
  truncated: Some text was shortened
  show-details: Show equipment details
  hide-details: Hide equipment details
  quality: Quality
  required-level: Required level
  slot: Equipment slot
  attributes: Numeric attributes
