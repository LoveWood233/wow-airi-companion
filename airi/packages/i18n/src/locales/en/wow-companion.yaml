  Horde: Horde
  Neutral: Neutral
activity: Activity
freshness: Observation
dead: Dead
combat: In combat
exploring: Exploring
current: Current
historical: Last known state
no-character: No character observation yet. Check the bridge and capture coordinates.
preferences: Companion preferences
preferences-description: The connection continues when you close this page. Only the main character window generates replies.
options:
  enabled: Enable companion
  muted: Mute game reactions
  quietInCombat: Stay quiet in combat
  levelUp: Celebrate level increases
  zone: Comment on new locations
  death: React to death
  revive: Welcome resurrection
  allowDemo: Allow character replies to demo events
hints:
  enabled: Keep the current game state available to the character.
  muted: Continue to update context without proactive game replies.
  quietInCombat: Hold one important event until combat ends. Discard events after 30 seconds.
  levelUp: Detect a higher level within the same character session.
  zone: React to a new map or zone, subject to the cooldown.
  death: React briefly in the selected character's tone, with game faction or race banter when appropriate.
  revive: React when the character returns to life.
  allowDemo: Off by default. Test replies use the configured model and voice.
cooldown: Minimum seconds between reactions
cooldown-description: From 0 to 300 seconds. Only one recent event waits during the cooldown.
capture: Screen calibration
capture-description: The default grid uses one physical pixel per cell and occupies 64 × 64 pixels. This is the minimum size for this black-and-white format. Coordinates use physical desktop pixels.
capture-x: Grid left (X)
capture-y: Grid top (Y)
cell-size: Cell size in pixels
poll-ms: Capture interval in milliseconds
pause-capture: Pause capture
capture-help: Use /wowc compact for a 64 × 64 grid. Use /wowc status to read its origin. Keep the grid unobstructed. If one-pixel cells blur, use /wowc cell 2 and set Cell size to 2 here.
save-preferences: Save preferences
save-capture: Apply calibration
saved: Saved.
failed: The operation failed.
demo: Connection test
demo-description: Test without a game login. Demo events stay outside character context until you explicitly allow them above.
demo-label: Demo
start-demo: Start demo
stop-demo: Return to live capture
actions:
  level_up: Simulate level up
  zone: Change zone
  death: Simulate death
  revive: Simulate resurrection
  combat: Toggle combat
events: Recent game events
events-description: These are observations, not delivery receipts. Muted or filtered events remain visible here.
no-events: No events yet.
gold:
  title: Gold ledger
  description: Track money flows by local addon account. Totals update with the game connection and remain saved on this computer.
  current-balance: Current character money
  current-unavailable: Current money is unavailable. Keep a real character online with live capture to read the balance.
  empty: No real money observations yet. Install the updated addon and bridge, then log in to each character to start the ledger.
  storage-error: The ledger failed to load or save. These totals are not confirmed on disk. Check the storage error and available disk space.
  unnamed-account: Local addon account
  account-id: Account ID
  account-name: Account label
  account-name-placeholder: For example, main account
  account-name-help: Up to 64 characters. Leave blank to remove the label.
  save-name: Save label
  character-count: 'Recorded characters: {count}'
  since: Desktop tracking since
  earned: Total inflow
  spent: Total outflow
  net: Net change
  balance: Recorded character balances
  character: Character
  realm: Realm
  character-balance: Last balance
  last-seen: Last observation
  characters-description: Last known balances and recorded flows for this account.
  identity-note: Accounts use a local ID saved by the addon. WoW Companion does not read your login account. Label each ID to identify it.
  flow-note: Initial balances do not count as inflow. Mail, trades, bank deposits, withdrawals, and transfers between your characters count as money flows.
  balance-note: Balances cover only observed characters, each at its last observation. They are not all current. Warband bank balances are excluded.
  demo-note: Demo data stays outside this ledger. Money changes update chat context without proactive voice replies.
  money: '{sign}{gold}g {silver}s {copper}c'
status:
  disabled: Companion disabled
  disconnected: Bridge unavailable
  waiting: Waiting for game
  live: Live character
  stale: Capture is stale
  demo: Demo data
  paused: Capture paused

versions:
  label: World of Warcraft version
  isolation: Each version has separate settings, calibration, events, gold records, equipment history, and level history. Switching pages discards unsaved edits.
  retail:
    name: World of Warcraft Retail
    description: Companion settings and gold records for Retail.
    capture-help: Use /wowc compact for a 64 × 64 grid, then /wowc status to read its origin. Window borders and other monitors change desktop coordinates. Keep the grid unobstructed. If one-pixel cells blur, use /wowc cell 2 and set Cell size to 2 here.
  forever:
    name: 'World of Warcraft: Forever'
    description: Independent companion settings and gold records for Forever.
    preview: This version is prepared before the client release. Live compatibility requires a check after release. The connection is disabled by default.
    capture-help: After installing the Forever addon, use /wowf compact for a 64 × 64 grid. Use /wowf status to read its origin. Keep the grid unobstructed. If one-pixel cells blur, use /wowf cell 2 and set Cell size to 2 here.

level-history:
  title: Character level history
  description: WoW Companion saves level observations for each character on this computer. Elapsed time uses the real-world clock and includes time offline.
  empty: No level history yet. Connect a real character to start a record from its current level.
  storage-error: Level history failed to load or save. Disk storage is not confirmed. Check the error and available disk space.
  current-character: Current character
  account: Local account ID
  current-level: 'Last observed level: {level}'
  first-seen: First recorded
  complete-count: Complete single-level intervals
  average: Average complete interval
  show-records: Show level history
  hide-records: Hide level history
  table-description: All saved level changes, newest first. Times use this computer's local time zone.
  level-change: Level change
  recorded-at: Recorded time
  duration: Time for this level
  source-title: Observation
  unknown-duration: Unknown
  partial: Time since first observation of the previous level. This is not the full time for that level.
  offline-note: The interval includes time offline, on other characters, and with WoW Companion closed. Records remain after restarts.
  observation-note: WoW Companion cannot recover missed upgrade times. A first observation or a change found after a gap does not prove the upgrade time.
  average-note: The average uses only complete single-level intervals. Partial intervals, missed changes, level decreases, and clock changes are excluded.
  duration-days: '{days}d {hours}h {minutes}m {seconds}s'
  duration-hours: '{hours}h {minutes}m {seconds}s'
  duration-minutes: '{minutes}m {seconds}s'
  duration-seconds: '{seconds}s'
  source:
    baseline: First observation. Earlier upgrade time is unknown.
    live: Level increase observed during live capture.
    gap: Change found after a gap or across several levels. Upgrade times are unknown.
    decrease: Level decrease observed. No upgrade interval applies.
    clock-change: Computer clock changed. This interval cannot be measured.

