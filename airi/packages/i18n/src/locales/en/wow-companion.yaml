screen-assist:
  title: Game screenshot assistance
  description: Ask your companion to inspect the current Warcraft screen for terrain, quest, or NPC guidance.
  enabled: Capture when I ask to see the game
  enabled-description: An explicit request captures one game frame. Ordinary chat does not start this capture.
  image-use: The screenshot goes to your selected vision provider. The original image is not saved to local chat history.
  target: Game window
  target-description: Auto requires one Warcraft window. If several versions are open, select one. Multiple windows of that version must be closed.
  games:
    auto: Auto
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Configure vision model
  vision-description: Select an image-capable provider and model in Vision settings. No screenshot is taken when you open these settings.
  examples-title: Ask in chat or by voice
  examples:
    terrain: Can you look at the terrain ahead and help me find a way through?
    quest: The quest marks the NPC here, but I cannot see them. Can you help me find them?
    scene: Look at my game screen and explain the quest objective.
  command: 'For an explicit capture, start your message with /look and add your question. Ask again after moving to get a new view.'
  limits: Windows only. Keep the game visible. A single frame cannot confirm collision, hidden entrances, or quest phases. Advice does not control your character.
  capturing: Capturing the Warcraft window…
  analyzing: Reading the game screen…
  ready: Game screen analyzed. Preparing your reply.
  errors:
    unsupported-platform: Game screenshot assistance currently supports Windows only.
    invalid-request: The selected game version is invalid. Select it again in Game screenshot assistance.
    game-not-found: No matching Warcraft window was found. Open the game and try again.
    ambiguous-window: Several matching game windows are open. Select a version or close the extra windows before trying again.
    minimized-window: The game window is minimized. Restore it and ask again.
    unverified-game: This game window could not be verified. Use an official supported Warcraft installation.
    capture-failed: The game screen could not be captured. Keep the game visible and try windowed mode.
    empty-frame: The capture was empty or black. Keep the game visible and ask again.
    capture-timeout: Game capture timed out. Wait a moment and ask again.
    busy: Another game capture is in progress. Wait for it to finish.
    window-changed: The game window changed during capture. Ask again for a fresh frame.
    vision-not-configured: Select a vision provider and model before requesting game screenshot assistance.
    vision-failed: The vision model could not read the screenshot. Check its settings and try again.
    no-description: The vision model returned no screen description. Try again or select another image-capable model.

