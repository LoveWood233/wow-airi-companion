  title: Acquisition comparison
  missing: No matching comparison received. Item level alone cannot establish an upgrade.
  historical: 'Equipment and specialization observed at acquisition:'
  stale-spec: This is a historical comparison. The current character or specialization differs or is unavailable.
  type: Equipment type
  empty-slot: Empty slot
  attribute: Attribute
  difference: Change
  item-level: Item level
  unknown: Unknown
  limitation: Higher item level and a primary-stat gain can request confirmation despite secondary-stat losses. Special effects, sets, sockets, and incomplete information still require review.
  verdict:
    upgrade: Clear improvement
    not_upgrade: No upgrade for this character
    review: Review required
  reason:
    empty_slot: Usable item fills an empty slot
    stats_upgrade: Compared attributes improve without a recorded attribute loss
    unusable: Item cannot currently be used
    wrong_spec: Item does not match the observed specialization
    weaker_stats: Compared attributes are lower
    equivalent: No compared attribute improves
    incomplete: Comparison data is incomplete or contains unsupported attributes
    unknown_spec: Specialization suitability is unknown
    weapon_change: Equipment types differ
    complex_item: Effects or equipment combinations require review
    stat_tradeoff: Attributes have trade-offs
    primary_upgrade_tradeoff: Higher item level and primary stat, with secondary-stat trade-offs. Your confirmation decides.
    no_target: Target slot is unavailable

loadout:
  title: Equipped items
  description: Login, new equipment, and equipment changes refresh all 19 equipped slots. WoW Companion keeps the latest snapshot for each character.
  characters: Saved characters
  waiting: Waiting for this login's complete equipment snapshot. Existing records remain historical.
  empty: No equipped-item snapshot received yet. Log in with the updated addon and keep the transfer grid visible.
  received: Received
  observed: Observed
  historical: This is the last recorded snapshot, not a continuous live equipment view.
  unknown: Unknown / unavailable
  empty-slot: Empty slot
  incomplete: Some item information is incomplete or truncated.
  note: Empty and unknown slots differ. Set descriptions do not prove active bonuses. Character snapshots do not use the ten-acquisition history limit.
