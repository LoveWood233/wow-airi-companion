equipment-swaps:
  title: Equipment change results
  description: The addon asks about clear improvements, empty slots, and higher item level with a primary-stat gain and secondary-stat losses. Each change requires confirmation.
  confirmation: Confirm inside the game. Choosing Yes in WoW Companion shows the next step. It does not change equipment or send input to the game.
  empty: No equipment confirmation results in this character session.
  bridge-update: This bridge does not supply equipment change results. Update the addon and bridge, then restart WoW Companion.
  read-error: Some equipment results are unavailable.
  historical: Last known results. WoW Companion does not use them as live context while the connection or result data is unavailable.
  observed: Result time
  previous: Previous item
  empty-slot: Empty slot
  expired-reason: The question expired. The addon did not execute the change.
  scope-note: These records describe past actions, not current equipment. A higher item level does not guarantee better attributes or set effects.
  status:
    equipped: Change confirmed
    declined: Declined
    failed: Not confirmed
    expired: Question expired
  reason:
    confirmed: The addon confirmed the equipment change after your approval in the game.
    user: You declined the change in the game.
    timeout: The addon did not confirm the result. Check your equipment in the game.
    combat: Combat interrupted the request. Confirm a new request after combat ends.
    changed: The item or destination slot changed. The request stopped.
    unavailable: Required item information or game functions were unavailable.
    locked: The item was locked. The request stopped.
    cursor: The cursor held an item. The request stopped.
    dead: The character was dead. The request stopped.
    restricted: The game restricted the action. The request stopped.
    disabled: Equipment confirmation was disabled. The request stopped.
    left_world: The character left the world. The request stopped.
  slots:
    '1': Head
    '2': Neck
    '3': Shoulders
    '4': Shirt
    '5': Chest
    '6': Waist
    '7': Legs
    '8': Feet
    '9': Wrists
    '10': Hands
    '11': Finger 1
    '12': Finger 2
    '13': Trinket 1
    '14': Trinket 2
    '15': Back
    '16': Main hand
    '17': Off hand
    '18': Ranged
    '19': Tabard
equipment-prompt:
  message: 'Congratulations on your new equipment, {name}! This gives you another chance to grow stronger. {reason} Do you want to change equipment?'
  message-player: '{player}, congratulations on your new equipment, {name}! This gives you another chance to grow stronger. {reason} Do you want to change equipment?'
  message-player-tradeoff: '{player}, congratulations on your new equipment, {name}! It can improve your primary stat. {reason} Do you want to change equipment?'
  reason:
    stats: 'Its recorded attributes clearly improve after comparison ({oldLevel} → {newLevel} item level).'
    empty: Its destination slot is empty.
    tradeoff: 'Item level {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, but {decreases}. These attributes have trade-offs. Overall benefit is not guaranteed.'
    separator: ', '
  accepted: Please click “Confirm change” in the game. WoW Companion does not send input to the game.
  accept: Yes
  decline: No thanks
  timeout: Choose within 10 seconds. No choice closes this reminder. Equipment changes still require confirmation in the game.
  description: Clear improvements and higher item level with a primary-stat gain can request a change. Secondary-stat losses remain explicit. Each change requires your confirmation.

idle-interaction:
  title: Companion interaction outside combat
  messages:
    '0': '{player}, where do you want your next adventure to take you?'
    '1': '{player}, enjoy this quiet moment. Drink some water and rest. I will stay by your side.'
    '2': '{player}, which piece of equipment do you want to replace next?'
    '3': '{player}, which view in Azeroth is your favorite?'

