  title: Search quest references
  game: Game data version
  level: Level used for this query
  faction: Faction used for this query
  zone: Region name
  category: Quest-log category
  category-note: Retail searches use the observed log category, not a world map region or a complete quest catalog.
  text: Quest name or ID
  use-player: Use current character conditions
  search: Search quests
  description: Search uses the displayed conditions. Editing them does not change the character or send a request.
  results: Last search results
  no-query: Submit a search to load references.
  empty: No matching quest records were returned. Unknown prerequisites remain unknown.
  unavailable: The requested source or current character log is unavailable.
  previous: Previous page
  next: Next page
  page: 'Showing {count} records from offset {offset}'
  open: Read details
  quest-id: 'Quest {id}'
  level-label: 'Quest level: {level}'
  min-level: 'Minimum level: {level}'
  region-label: 'Region: {zone}'
  category-label: 'Log category: {category}'
  faction-label: 'Faction: {faction}'
  type-label: 'Type: {type}'
  temporary: Temporary
  unknown-name: 'Quest {id} (name unavailable)'
factions:
  Alliance: Alliance
  Horde: Horde
  Neutral: Neutral
  Unknown: Unknown / no faction filter
progress:
  unknown: Player progress unknown
  active: Observed in the quest log
  ready-to-turn-in: Ready to turn in; not yet proof of turn-in
  objectives-complete: All observed objectives marked complete
  failed: Client marked this quest failed
  completed-flag: Client completion flag; turn-in unknown
  turned-in: Turn-in observed in this session
