  previous: Previous quests
  next: Next quest
  chain: Quest chain
  chain-open: 'Read related quest: {title}'
  reward: Reward summary
  no-chain: No verified chain references were returned.
  objective-id: 'Objective ID: {id}'
  item-id: 'Item ID: {id}'
  count: 'Quantity: {count}'
