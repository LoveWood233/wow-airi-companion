  item: Item
  unknown: Actor type unknown
locations:
  start: Quest giver marker
  end: Turn-in marker
  both: Quest giver and turn-in marker
  objective: Objective marker
  unknown: Marker purpose unknown
conditions:
  prerequisites_all: All of these prerequisite quests
  prerequisites_one_of: Any one of these prerequisite quests
  exclusive_with: Mutually exclusive quests
  taken_under: Source acceptance restriction
  races: Race restrictions
  classes: Class restrictions
  skill: Profession or skill requirement
  reputation_min: Minimum reputation
  reputation_max: Maximum reputation
  carry_items: Items to carry
  repeatable: Repeatable
  unknown: Other source condition
reminders:
  title: Automatic quest reminders
  enabled: Enable automatic quest reminders
  description: Off by default. When enabled, quest reminders share a global three-minute cooldown.
  constraints: Reminders require a current living character outside combat. Quiet hours, speech mute, current activity, and proactive model budget still apply.
  error: The quest reminder could not be completed. Check the data and speech connection.
risks:
  minimum-level: 'Below the known minimum level ({minimumLevel}). Query level: {playerLevel}.'
  higher-level: 'Quest level {questLevel} exceeds query level {playerLevel}.'
  elite: Elite quest
  dungeon: Dungeon quest
  raid: Raid quest
  pvp: PvP quest
  timed: Timed quest
  faction-mismatch: Known faction does not match the query
notices:
  local-quest-log-only: Retail results cover the observed quest log only. No complete offline quest guide was queried.
  progress-snapshot-only: Player progress comes from the observed game snapshot, not the reference database.
  quest-log-header-not-map: A quest-log category is not a world map region.
  quest-log-partial: The observed log is partial. Missing quests remain unknown.
  prerequisites-unverified: Prerequisites and access conditions are not fully verified.
  coordinates-unavailable: Verified coordinates are unavailable.
  level-window-three: Search considers quest levels within three levels of the query level. Retail log records with unknown levels are retained.
  faction-filter-unavailable: Faction filtering is unavailable or the faction is unknown.
  availability-unverified: These records do not prove that the character can accept the quest.
  source-partial: The source record is partial.
  faction-unverified: Quest faction requirements are unverified.
  level-unavailable: Quest level is unavailable.
  detail-not-loaded: This is a list summary. Read the detail record before relying on its requirements.
  result-truncated: The result was truncated.
  temporary-data: Some information comes from temporary third-party data.
  title-unavailable: The source does not provide a quest title.
errors:
  invalid-query: Check the level, faction, filters, and quest ID.
  source-unavailable: The reference source is unavailable. Check the MCP connection and retry.
  source-invalid: The source returned an unsupported or invalid quest record.
  telemetry-unavailable: Current quest observations are unavailable or changed during the query. Check the game connection and retry.
  telemetry-game-mismatch: The available quest observations belong to another game.
  generic: The query failed. Check the selected game, data connection, and filters.
