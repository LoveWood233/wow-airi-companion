title: Quests and leveling
description: Read the current quest log and search references without moving or playing the character.
games:
  forever: Chinese WoW Forever
  retail: World of Warcraft Retail
current:
  title: Observed character quest log
  character: '{name} · {realm} · Level {level}'
  ready: A current quest-log snapshot is available.
  partial: The current quest-log snapshot is partial. Missing records remain unknown.
  unknown: No current quest-log snapshot is available. This does not establish an empty log.
  stale: The last quest snapshot is no longer current. Refresh the game connection before using its progress.
  observed: 'Quest observations: {time}'
  received: 'Bridge receipt: {time}'
  coverage: '{count} observed log records; source total: {total}'
  no-quests: The complete observed log contains no quests.
  detail: View quest details
  objectives: Observed objectives
  objectives-partial: Some objective data is unavailable. Coverage does not establish objective completion.
  objective-count: '{fulfilled} / {required}'
  finished: Objective marked complete
  unfinished: Objective not marked complete
  unknown-value: Unknown
  no-objectives: No objective details were observed.
  flags: Client completion flags
  flags-description: These IDs are client completion flags with unknown character/account scope. They do not prove turn-in.
  flags-coverage: '{count} observed flags; source total: {total}'
  flags-partial: The flag list is partial. An absent ID cannot prove that a quest is incomplete.
  no-flags: No completion flags were observed.
  turnins: Observed turn-ins in this session
  turnin: 'Quest {id} · {time}'
  no-turnins: No turn-in event was observed in this session.
