  title: Quest details
  empty: Select a quest to read its details.
  prerequisites: Objectives and requirements
  conditions: Known conditions
  unverified: Unknown prerequisites, phase, reputation, profession, and access conditions cannot be treated as satisfied.
  starts: Starts with
  ends: Ends with
  actors-unknown: The source does not identify a verified quest giver or turn-in actor.
  locations: Source locations
  coordinates: '{x}, {y}'
  map: 'World map region ID: {id}'
  map-unknown: Map unknown
  coordinates-unknown: Coordinates unavailable
