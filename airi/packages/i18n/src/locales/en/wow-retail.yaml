notices:
  client-db2-only: These records come from client DB2 files. Server-only facts and player progress are outside this source.
  hotfixes-not-applied: Server hotfixes were not applied to this export. Current game values can differ.
  encrypted-sections: Some source tables contain encrypted sections. Decoded rows do not represent every game record.
  missing-fields: Some source fields are missing. Missing fields remain unknown.
  raw-spell-template: Spell descriptions can contain raw client placeholders. They are not evaluated character-specific values.
  map-id-not-uimap-id: Base map IDs and world map region IDs use different namespaces.
  content-tuning-not-exploration-level: Content tuning IDs do not establish a classic exploration level or a personal leveling recommendation.
  result-truncated: Some fields or text were truncated to keep the response bounded.
errors:
  database-unconfigured: Choose a local Retail database in the database settings first.
  database-missing: The selected database file is missing. Select an available export.
  database-unreadable: The selected database cannot be read. Check its location and access permissions.
  database-invalid: The selected file is not a supported Retail export or failed validation.
  database-changed: The database changed during the query. Retry against a stable export.
  query-invalid: The query parameters are invalid. Check the record type, ID, or search text.
  query-timeout: The local query timed out. Narrow the search and retry.
  query-failed: The local query failed. No replacement records were added.
  bridge-unavailable: The local query service is unavailable. Check its status and retry.
