errors:
  unknown: La solicitud falló. Inténtalo de nuevo.
  curseforge-api-key-required: Añade una clave API de CurseForge en los ajustes de complementos.
  curseforge-unauthorized: CurseForge rechazó la clave API. Compruébala en los ajustes de complementos.
  curseforge-rate-limited: CurseForge ha limitado las solicitudes. Espera e inténtalo de nuevo.
  curseforge-timeout: CurseForge no respondió a tiempo. Inténtalo de nuevo.
  curseforge-invalid-response: CurseForge devolvió una respuesta no válida. Inténtalo de nuevo.
  curseforge-response-too-large: La respuesta de CurseForge supera el tamaño admitido.
  curseforge-request-failed: La solicitud a CurseForge falló. Comprueba la conexión e inténtalo de nuevo.
  curseforge-invalid-request: La solicitud no es válida. Comprueba la versión del juego configurada e inténtalo de nuevo.
  curseforge-too-many-files: Este complemento tiene demasiados archivos para cargarlos con seguridad. Selecciona otro complemento.
  curseforge-too-many-redirects: La descarga tiene demasiadas redirecciones. Inténtalo más tarde.
  curseforge-not-found: CurseForge no encuentra este complemento o archivo. Actualiza la lista de complementos.
  curseforge-disposed: El servicio de complementos se detuvo. Abre de nuevo el centro de complementos e inténtalo otra vez.
  curseforge-incompatible-version: Este archivo no es compatible con la versión del juego configurada.
  curseforge-distribution-disabled: El autor no permite instalar este complemento mediante herramientas de terceros.
  curseforge-download-unavailable: CurseForge no ofrece una descarga para este archivo del complemento.
  curseforge-unsafe-download-url: La dirección de descarga no superó la validación.
  curseforge-download-integrity: La descarga del complemento no superó la comprobación de integridad. Inténtalo de nuevo.
  wow-addons-settings-invalid: Comprueba los ajustes de complementos e inténtalo de nuevo.
  wow-addons-directory-required: Establece la carpeta del cliente de WoW en los ajustes de complementos.
  wow-addons-version-required: Selecciona una versión del juego compatible en los ajustes de complementos.
  wow-addons-busy: Hay otra operación de complementos en curso. Espera a que termine.
  wow-addons-key-storage-unavailable: El almacenamiento seguro de claves no está disponible. Reinicia Compañero de WoW e inténtalo de nuevo.
  wow-addons-key-unreadable: Compañero de WoW no puede leer la clave API guardada. Vuelve a guardarla.
  wow-addons-required-dependency: No se pudo instalar una dependencia necesaria. Inténtalo de nuevo.
  wow-addons-unmanaged-conflict: Ya existe una carpeta de complemento sin gestionar. Muévela antes de instalar este complemento.
  wow-addons-folder-conflict: Una carpeta entra en conflicto con otro complemento. Muévela antes de instalar este complemento.
  wow-addons-unsafe-archive: El archivo del complemento contiene rutas inseguras y no se puede instalar.
  wow-addons-install-failed: La instalación falló. Comprueba la carpeta del cliente e inténtalo de nuevo.
  wow-addons-invalid-directory: La carpeta del cliente no es válida o no está disponible. Comprueba la ruta en los ajustes de complementos.
  wow-addons-invalid-archive: El archivo del complemento no es válido o no es seguro y no se puede instalar.
  wow-addons-directory-conflict: Una carpeta de complemento existente entra en conflicto con esta instalación. Muévela antes de reintentar.
  wow-addons-request-failed: La operación del complemento falló. Comprueba la carpeta del cliente e inténtalo de nuevo.
  wow-addons-dependency-limit: El complemento necesita demasiadas dependencias anidadas para instalarse con seguridad.
  wow-addons-stopped: La operación del complemento se detuvo. Abre de nuevo el centro de complementos e inténtalo otra vez.
