equipment-prompt:
  message: '¡Enhorabuena por tu nuevo equipo, {name}! Ahora eres más fuerte. {reason} Confirma el cambio de equipo en el juego.'
  message-player: '{player}, ¡enhorabuena por tu nuevo equipo, {name}! Ahora eres más fuerte. {reason} Confirma el cambio de equipo en el juego.'
  message-player-tradeoff: '{player}, ¡enhorabuena por tu nuevo equipo, {name}! Puede mejorar tu atributo principal. {reason} Revisa las ventajas y desventajas y confirma el cambio en el juego.'
  reason:
    stats: 'Sus atributos registrados mejoran claramente tras la comparación (nivel de objeto {oldLevel} → {newLevel}).'
    empty: Su ranura de destino está vacía.
    tradeoff: 'Nivel de objeto {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, pero {decreases}. Hay ventajas y desventajas. No se garantiza una mejora global.'
    separator: ', '
  accepted: Haz clic en «Confirmar cambio» dentro del juego. Compañero de WoW no envía entradas al juego.
  accept: Sí
  decline: No, gracias
  timeout: Elige en 10 segundos. Sin respuesta, este aviso se cierra. El cambio de equipo necesita confirmación dentro del juego.
  description: 'El complemento compara el equipo. Revisa los atributos y confirma cada cambio en el juego.'
idle-interaction:
  title: Interacción fuera de combate
  messages:
    '0': '{player}, ¿adónde quieres que te lleve tu próxima aventura?'
    '1': '{player}, disfruta de este momento tranquilo. Bebe agua y descansa. Me quedaré a tu lado.'
    '2': '{player}, ¿qué pieza de equipo quieres reemplazar ahora?'
    '3': '{player}, ¿cuál es tu paisaje favorito de Azeroth?'
