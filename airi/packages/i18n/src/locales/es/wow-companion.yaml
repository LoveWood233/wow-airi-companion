  realm: Reino
  character-balance: Último saldo
  last-seen: Última observación
  characters-description: Últimos saldos conocidos y movimientos registrados de esta cuenta.
  identity-note: Las cuentas usan un ID local guardado por el complemento. Compañero de WoW no lee tu cuenta de acceso. Etiqueta cada ID para identificarlo.
  flow-note: Los saldos iniciales no cuentan como entradas. El correo, los intercambios, los depósitos, las retiradas y las transferencias entre tus personajes cuentan como movimientos.
  balance-note: Los saldos corresponden solo a personajes observados en su última lectura. No todos son actuales. No se incluye el banco de la banda guerrera.
  demo-note: Los datos de demostración quedan fuera del registro. Los cambios de dinero actualizan el contexto sin respuestas de voz espontáneas.
  money: '{sign}{gold}o {silver}p {copper}c'
status:
  disabled: Compañía desactivada
  disconnected: Puente no disponible
  waiting: Esperando al juego
  live: Personaje en directo
  stale: Captura desactualizada
  demo: Datos de demostración
  paused: Captura pausada
versions:
  label: Versión de World of Warcraft
  isolation: Cada versión tiene ajustes, calibración, eventos y registros de oro, equipo y niveles independientes. Cambiar de página descarta los cambios sin guardar.
  retail:
    name: World of Warcraft actual
    description: Ajustes de compañía y registro de oro de la versión actual.
    capture-help: Usa /wowc compact para una cuadrícula de 64 × 64 y /wowc status para consultar su origen. Los bordes de ventanas y otras pantallas cambian las coordenadas. No tapes la cuadrícula. Si se difumina, usa /wowc cell 2 y un tamaño de celda de 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Ajustes de compañía y registro de oro independientes para Forever.
    preview: Esta versión se prepara antes del lanzamiento del cliente. La compatibilidad requiere una comprobación tras su lanzamiento. La conexión está desactivada inicialmente.
    capture-help: Tras instalar el complemento Forever, usa /wowf compact para una cuadrícula de 64 × 64 y /wowf status para consultar su origen. No la tapes. Si se difumina, usa /wowf cell 2 y un tamaño de celda de 2.
level-history:
  title: Historial de niveles del personaje
  description: Compañero de WoW guarda las observaciones de nivel de cada personaje en este equipo. El tiempo transcurrido usa el reloj real e incluye la desconexión.
  empty: Todavía no hay historial de niveles. Conecta un personaje real para empezar a registrar desde su nivel actual.
  storage-error: No se pudo cargar o guardar el historial de niveles. El guardado en disco no está confirmado. Comprueba el error y el espacio disponible.
  current-character: Personaje actual
  account: ID de cuenta local
  current-level: 'Último nivel observado: {level}'
  first-seen: Primer registro
  complete-count: Intervalos completos de un nivel
  average: Promedio de intervalos completos
  show-records: Mostrar historial de niveles
  hide-records: Ocultar historial de niveles
  table-description: Todos los cambios guardados, del más reciente al más antiguo. Las horas usan la zona horaria local de este equipo.
  level-change: Cambio de nivel
  recorded-at: Hora del registro
  duration: Tiempo de este nivel
  source-title: Observación
  unknown-duration: Desconocido
  partial: Tiempo desde la primera observación del nivel anterior. No es el tiempo completo de ese nivel.
  offline-note: El intervalo incluye tiempo sin conexión, con otros personajes y con Compañero de WoW cerrado. Los registros se conservan tras reiniciar.
  observation-note: Compañero de WoW no puede recuperar subidas de nivel no observadas. Una primera lectura o un cambio tras una pausa no demuestra la hora exacta.
  average-note: El promedio solo usa intervalos completos de un nivel. Excluye intervalos parciales, cambios omitidos, bajadas de nivel y cambios del reloj.
  duration-days: '{days}d {hours}h {minutes}min {seconds}s'
  duration-hours: '{hours}h {minutes}min {seconds}s'
  duration-minutes: '{minutes}min {seconds}s'
  duration-seconds: '{seconds}s'
  source:
    baseline: Primera observación. Se desconoce la hora de la subida anterior.
    live: Subida de nivel observada durante la captura en directo.
    gap: Cambio detectado tras una pausa o entre varios niveles. Se desconocen las horas de subida.
    decrease: Bajada de nivel observada. No se aplica ningún intervalo de subida.
    clock-change: El reloj del equipo cambió. No se puede medir este intervalo.
