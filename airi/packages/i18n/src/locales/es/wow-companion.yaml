  saved: Programa validado y guardado.
  cleared: Ruta guardada eliminada.
  launched: Solicitud de inicio enviada.
  unsaved: Valida y guarda los cambios antes de iniciar este programa.
  launch-note: Battle.net abre su aplicación. El juego aún puede requerir sesión o
    actualizaciones. La aplicación guardada se comprueba antes de cada inicio.
  verified-program: Programa validado
  errors:
    unsupported-platform: Para iniciar el juego desde esta aplicación se requiere Windows.
    invalid-request: Las configuraciones de inicio son inválidas. Seleccione el
      juego y su aplicación de nuevo.
    invalid-path: Ingrese la ubicación completa de un archivo local de solicitud. No
      agregue argumentos de línea de comandos.
    file-not-found: El programa no fue encontrado. Seleccione su ubicación actual.
    not-executable: Selecciona un programa Windows .exe. No selecciones un acceso
      directo, un script ni una carpeta.
    invalid-signature: El programa no tiene una firma válida de Blizzard. Selecciona
      el programa oficial de su carpeta de instalación.
    wrong-product: Esta aplicación no coincide con la opción de Battle.net o World
      of Warcraft seleccionada.
    wrong-version: Esta aplicación World of Warcraft es para una versión diferente
      del juego. Seleccione la versión o aplicación de juego correcta.
    unrecognized-version: No se pudo comprobar la versión del juego. Comience a
      través de Battle.net o actualice el acompañante para esta versión.
    inspection-failed: El programa no se pudo comprobar. Compruebe el acceso al
      archivo y vuelve a intentarlo.
    not-configured: No se guarda ninguna aplicación para esta opción. Configure y
      guarde su ubicación de archivo primero.
    storage-error: No se pueden leer ni guardar las configuraciones de inicio.
      Compruebe el acceso a la carpeta de datos de la aplicación.
    launch-failed: No puedo iniciar la solicitud. Compruebe los permisos de
      instalación y archivos.
    busy: Una solicitud ya está comenzando. Espera hasta que termine.
    request-failed: El servicio de escritorio no respondió. Inténtalo de nuevo o
      reinicie el compañero.
screen-assist:
  title: Asistencia con capturas del juego
  description: Pídale a su compañero que examine la captura de pantalla de
    Warcraft para el terreno, misiones de juego o guía NPC.
  enabled: Capturar cuando pida ver el juego
  enabled-description: Una petición explícita captura una imagen del juego. El
    chat normal no inicia capturas.
  image-use: La captura se envía al proveedor de visión seleccionado. La imagen
    original no se guarda en el historial de chat local.
  target: Ventana del juego
  target-description: La selección automática requiere una sola ventana de
    Warcraft. Si hay varias versiones abiertas, elige una. Cierra las ventanas
    adicionales de esa versión.
  games:
    auto: Automático
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Configurar modelo de visión
  vision-description: Elige un proveedor y un modelo compatibles con imágenes en
    los ajustes de Visión. Abrir estos ajustes no toma ninguna captura.
  examples-title: Pregunta por chat o por voz
  examples:
    terrain: ¿Puedes mirar el terreno de delante y ayudarme a encontrar un camino?
    quest: La misión marca al PNJ aquí, pero no lo veo. ¿Puedes ayudarme a
      encontrarlo?
    scene: Mira la pantalla del juego y explica el objetivo de la misión.
  command: Para solicitar una captura, empieza el mensaje con /look y añade tu
    pregunta. Tras moverte en el juego, pregunta de nuevo para obtener otra
    imagen.
  limits: Solo Windows. Mantén el juego visible. Una imagen no confirma
    colisiones, entradas ocultas ni fases de misión. Los consejos no controlan a
    tu personaje.
  capturing: Capturando la ventana de Warcraft…
  analyzing: Analizando la pantalla del juego…
  ready: Pantalla analizada. Preparando la respuesta.
  errors:
    unsupported-platform: La asistencia de capturas de pantalla del juego requiere Windows.
    invalid-request: La versión del juego seleccionada es inválida. Seleccione de
      nuevo en la configuración de ayuda de captura de pantalla.
    game-not-found: No se encontró ninguna ventana que coincida con Warcraft. Abra
      el juego y vuelve a intentarlo.
    ambiguous-window: Varias ventanas de juego están abiertas. Seleccione una
      versión del juego o cierre las ventanas adicionales y vuelva a intentarlo.
    minimized-window: La ventana de juego está minimizada. Restaurarlo y preguntar de nuevo.
    unverified-game: No puedo verificar esta ventana de juego. Utilice una
      instalación oficial de Warcraft.
    capture-failed: No puedo tomar una captura de pantalla del juego. Mantenga el
      juego visible y pruebe el modo con ventanas.
    empty-frame: La captura de pantalla está vacía o negra. Mantenga el juego
      visible y pregunte de nuevo.
    capture-timeout: La operación de captura de pantalla terminó. Espera un momento
      y pregunta de nuevo.
    busy: Otra captura de pantalla está en curso. Espera hasta que termine.
    window-changed: La ventana del juego cambió mientras tomaba la captura de
      pantalla. Pida otra vez una nueva captura de pantalla.
    vision-not-configured: Selecciona un proveedor y un modelo de visión antes de
      pedir asistencia con capturas del juego.
    vision-failed: El modelo de IA de análisis de imágenes no puede leer la captura
      de pantalla. Compruebe las configuraciones del modelo y vuelve a
      intentarlo.
    no-description: El modelo de IA de análisis de imágenes no devolvió ninguna
      descripción. Intente de nuevo o elija otro modelo que admita imágenes.

