versions:
  label: Versión de World of Warcraft
  isolation: Cada versión tiene ajustes, calibración, eventos y registros de oro, equipo y niveles independientes. Cambiar de página descarta los cambios sin guardar.
  retail:
    name: World of Warcraft actual
    description: Ajustes de compañía y registro de oro de la versión actual.
    capture-help: Usa /wowc compact para una cuadrícula de 64 × 64 y /wowc status para consultar su origen. Los bordes de ventanas y otras pantallas cambian las coordenadas. No tapes la cuadrícula. Si se difumina, usa /wowc cell 2 y un tamaño de celda de 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Ajustes de compañía y registro de oro independientes para Forever.
    preview: Esta versión se prepara antes del lanzamiento del cliente. La compatibilidad requiere una comprobación tras su lanzamiento. La conexión está desactivada inicialmente.
    capture-help: Tras instalar el complemento Forever, usa /wowf compact para una cuadrícula de 64 × 64 y /wowf status para consultar su origen. No la tapes. Si se difumina, usa /wowf cell 2 y un tamaño de celda de 2.
level-history:
  title: Historial de niveles del personaje
  description: Compañero de WoW guarda las observaciones de nivel de cada personaje en este equipo. El tiempo transcurrido usa el reloj real e incluye la desconexión.
  empty: Todavía no hay historial de niveles. Conecta un personaje real para empezar a registrar desde su nivel actual.
  storage-error: No se pudo cargar o guardar el historial de niveles. El guardado en disco no está confirmado. Comprueba el error y el espacio disponible.
