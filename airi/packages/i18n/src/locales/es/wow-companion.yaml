  revive: Celebrar la resurrección
  allowDemo: Permitir respuestas a eventos de demostración
hints:
  enabled: Mantiene el estado actual del juego disponible para el personaje.
  muted: Actualiza el contexto sin generar respuestas espontáneas al juego.
  quietInCombat: Guarda un evento importante hasta terminar el combate. Descarta los eventos después de 30 segundos.
  levelUp: Detecta un nivel superior dentro de la misma sesión del personaje.
  zone: Reacciona a un nuevo mapa o zona respetando el tiempo de espera.
  death: 'Ofrece unas palabras de ánimo al morir.'
  revive: Reacciona cuando el personaje vuelve a la vida.
  allowDemo: 'Desactivado por defecto. Los avisos de demostración usan voz o subtítulos sin consultar al modelo de chat.'
cooldown: Segundos mínimos entre reacciones
cooldown-description: De 0 a 300 segundos. Solo espera un evento reciente durante este intervalo.
capture: Calibración de pantalla
capture-description: La cuadrícula predeterminada usa un píxel físico por celda y ocupa 64 × 64 píxeles. Es el mínimo de este formato monocromo. Las coordenadas son píxeles físicos del escritorio.
capture-x: Borde izquierdo de la cuadrícula (X)
capture-y: Borde superior de la cuadrícula (Y)
cell-size: Tamaño de celda en píxeles
poll-ms: Intervalo de captura en milisegundos
pause-capture: Pausar captura
capture-help: Usa /wowc compact para una cuadrícula de 64 × 64 y /wowc status para consultar su origen. No la tapes. Si las celdas de un píxel se difuminan, usa /wowc cell 2 y establece aquí el tamaño de celda en 2.
save-preferences: Guardar preferencias
save-capture: Aplicar calibración
saved: Guardado.
failed: La operación falló.
demo: Prueba de conexión
demo-description: Prueba sin iniciar sesión en el juego. Los eventos de demostración no entran en el contexto hasta que lo permitas arriba.
