equipment-swaps:
  title: Resultados de cambios de equipo
  description: El complemento pregunta por mejoras claras, ranuras vacías y objetos de mayor nivel con más atributo principal y menos secundarios. Cada cambio necesita confirmación.
  confirmation: Confirma dentro del juego. Elegir Sí en Compañero de WoW muestra el siguiente paso. No cambia equipo ni envía entradas al juego.
  empty: No hay resultados de confirmación de equipo en esta sesión del personaje.
  bridge-update: Este puente no proporciona resultados de cambios de equipo. Actualiza el complemento y el puente y reinicia Compañero de WoW.
  read-error: Algunos resultados del equipo no están disponibles.
  historical: Últimos resultados conocidos. Compañero de WoW no los usa como contexto en directo si la conexión o los datos no están disponibles.
  observed: Hora del resultado
  previous: Objeto anterior
  empty-slot: Ranura vacía
  expired-reason: La pregunta caducó. El complemento no realizó el cambio.
  scope-note: Estos registros describen acciones pasadas, no el equipo actual. Un nivel de objeto mayor no garantiza mejores atributos o efectos de conjunto.
  status:
    equipped: Cambio confirmado
    declined: Rechazado
    failed: Sin confirmar
    expired: Pregunta caducada
  reason:
    confirmed: El complemento confirmó el cambio de equipo tras tu aprobación dentro del juego.
    user: Rechazaste el cambio dentro del juego.
    timeout: El complemento no confirmó el resultado. Comprueba tu equipo dentro del juego.
    combat: El combate interrumpió la solicitud. Confirma una nueva solicitud al terminar.
    changed: El objeto o la ranura de destino cambió. La solicitud se detuvo.
    unavailable: La información del objeto o las funciones del juego necesarias no estaban disponibles.
    locked: El objeto estaba bloqueado. La solicitud se detuvo.
    cursor: El cursor sostenía un objeto. La solicitud se detuvo.
    dead: El personaje estaba muerto. La solicitud se detuvo.
    restricted: El juego restringió la acción. La solicitud se detuvo.
    disabled: La confirmación de equipo estaba desactivada. La solicitud se detuvo.
    left_world: El personaje abandonó el mundo. La solicitud se detuvo.
