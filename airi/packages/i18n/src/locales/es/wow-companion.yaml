  flow-note: Los saldos iniciales no cuentan como entradas. El correo, los intercambios, los depósitos, las retiradas y las transferencias entre tus personajes cuentan como movimientos.
  balance-note: Los saldos corresponden solo a personajes observados en su última lectura. No todos son actuales. No se incluye el banco de la banda guerrera.
