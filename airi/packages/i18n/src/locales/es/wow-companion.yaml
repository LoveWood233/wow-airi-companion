loadout:
  title: Objetos equipados
  description: El inicio de sesión, las adquisiciones y los cambios de equipo actualizan las 19 ranuras. Compañero de WoW conserva la última captura de cada personaje.
  characters: Personajes guardados
  waiting: Esperando la captura completa del equipo de esta sesión. Los registros existentes siguen siendo históricos.
  empty: Todavía no se ha recibido una captura del equipo. Inicia sesión con el complemento actualizado y mantén visible la cuadrícula de transferencia.
  received: Recibido
  observed: Observado
  historical: Es la última captura registrada, no una vista continua del equipo en directo.
  unknown: Desconocido / no disponible
  empty-slot: Ranura vacía
  incomplete: Parte de la información de los objetos está incompleta o acortada.
  note: Una ranura vacía no equivale a una desconocida. Las descripciones de conjuntos no demuestran bonificaciones activas. Estas capturas no usan el límite de diez adquisiciones.
