exploring: Explorando
current: Actual
historical: Último estado conocido
no-character: Todavía no hay observaciones de un personaje. Comprueba el puente y las coordenadas de captura.
preferences: Preferencias de compañía
preferences-description: La conexión continúa al cerrar esta página. Solo la ventana principal del personaje genera respuestas.
options:
  enabled: Activar compañía
  muted: Silenciar reacciones al juego
  quietInCombat: Guardar silencio en combate
  levelUp: Celebrar las subidas de nivel
  zone: Comentar nuevas ubicaciones
  death: Reaccionar a la muerte
  revive: Celebrar la resurrección
  allowDemo: Permitir respuestas a eventos de demostración
hints:
  enabled: Mantiene el estado actual del juego disponible para el personaje.
  muted: Actualiza el contexto sin generar respuestas espontáneas al juego.
  quietInCombat: Guarda un evento importante hasta terminar el combate. Descarta los eventos después de 30 segundos.
  levelUp: Detecta un nivel superior dentro de la misma sesión del personaje.
  zone: Reacciona a un nuevo mapa o zona respetando el tiempo de espera.
  death: Reacciona brevemente con el tono del personaje, con bromas sobre la facción o la raza cuando corresponda.
  revive: Reacciona cuando el personaje vuelve a la vida.
  allowDemo: Desactivado de forma predeterminada. Las respuestas de prueba utilizan el modelo y la voz configurados.
cooldown: Segundos mínimos entre reacciones
cooldown-description: De 0 a 300 segundos. Solo espera un evento reciente durante este intervalo.
capture: Calibración de pantalla
capture-description: La cuadrícula predeterminada usa un píxel físico por celda y ocupa 64 × 64 píxeles. Es el mínimo de este formato monocromo. Las coordenadas son píxeles físicos del escritorio.
capture-x: Borde izquierdo de la cuadrícula (X)
capture-y: Borde superior de la cuadrícula (Y)
cell-size: Tamaño de celda en píxeles
poll-ms: Intervalo de captura en milisegundos
pause-capture: Pausar captura
capture-help: Usa /wowc compact para una cuadrícula de 64 × 64 y /wowc status para consultar su origen. No la tapes. Si las celdas de un píxel se difuminan, usa /wowc cell 2 y establece aquí el tamaño de celda en 2.
save-preferences: Guardar preferencias
save-capture: Aplicar calibración
saved: Guardado.
failed: La operación falló.
demo: Prueba de conexión
demo-description: Prueba sin iniciar sesión en el juego. Los eventos de demostración no entran en el contexto hasta que lo permitas arriba.
demo-label: Demostración
start-demo: Iniciar demostración
stop-demo: Volver a captura en directo
actions:
  level_up: Simular subida de nivel
  zone: Cambiar zona
  death: Simular muerte
  revive: Simular resurrección
  combat: Alternar combate
events: Eventos recientes del juego
events-description: Son observaciones, no confirmaciones de entrega. Los eventos silenciados o filtrados siguen visibles aquí.
no-events: Todavía no hay eventos.
gold:
  title: Registro de oro
  description: Registra los movimientos de dinero por cuenta local del complemento. Los totales se actualizan con la conexión y quedan guardados en este equipo.
  current-balance: Dinero actual del personaje
  current-unavailable: El dinero actual no está disponible. Mantén un personaje real conectado con captura en directo para leer el saldo.
  empty: Todavía no hay observaciones reales de dinero. Instala el complemento y el puente actualizados e inicia sesión con cada personaje.
  storage-error: No se pudo cargar o guardar el registro. Los totales no están confirmados en disco. Comprueba el error y el espacio disponible.
  unnamed-account: Cuenta local del complemento
  account-id: ID de cuenta
  account-name: Etiqueta de cuenta
  account-name-placeholder: Por ejemplo, cuenta principal
  account-name-help: Hasta 64 caracteres. Déjalo vacío para quitar la etiqueta.
  save-name: Guardar etiqueta
  character-count: 'Personajes registrados: {count}'
  since: Registro en el escritorio desde
