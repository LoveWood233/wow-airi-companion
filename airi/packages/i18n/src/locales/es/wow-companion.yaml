title: Compañero de WoW
description: Juntos por Azeroth. Observa el estado del personaje y responde a los momentos importantes.
product:
  about-title: Acerca de Compañero de WoW
  description: Compañía para World of Warcraft, chat de voz y gestión de complementos.
  version: Versión
  project: Proyecto
  third-party: Licencias de terceros
  license-note: Este programa utiliza componentes de código abierto. Sus avisos de derechos y licencias se conservan en los archivos fuente y distribuidos.
  local-provider-note: Configura los servicios de chat y voz en los ajustes. No necesitas una cuenta de la aplicación.
connection: Conexión con el juego
last-seen: Última observación
demo-warning: Estos datos son simulados. No describen un personaje real.
model-required: Selecciona un proveedor y un modelo de chat en Compañero de WoW para activar las respuestas. La voz utiliza tus ajustes actuales.
start-bridge: Compañero de WoW inicia el puente local al activar esta conexión. Mantén visible la cuadrícula del complemento. Windows necesita Python 3.10 o posterior.
player: Personaje
level: Nivel
zone-label: Ubicación
