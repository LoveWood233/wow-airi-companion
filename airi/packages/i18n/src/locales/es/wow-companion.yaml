  examples-title: Pregunta por chat o por voz
  examples:
    terrain: ¿Puedes mirar el terreno de delante y ayudarme a encontrar un camino?
    quest: La misión marca al PNJ aquí, pero no lo veo. ¿Puedes ayudarme a
