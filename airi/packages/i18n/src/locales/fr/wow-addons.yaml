  curseforge-too-many-files: Cette extension contient trop de fichiers pour être chargée en toute sécurité. Sélectionnez une autre extension.
  curseforge-too-many-redirects: Le téléchargement comporte trop de redirections. Réessayez plus tard.
  curseforge-not-found: CurseForge ne trouve pas cette extension ou ce fichier. Actualisez la liste des extensions.
  curseforge-disposed: Le service des extensions s’est arrêté. Rouvrez le centre des extensions, puis réessayez.
  curseforge-incompatible-version: Ce fichier ne correspond pas à la version du jeu configurée.
  curseforge-distribution-disabled: L’auteur n’autorise pas l’installation de cette extension par des outils tiers.
  curseforge-download-unavailable: CurseForge ne propose aucun téléchargement pour ce fichier d’extension.
  curseforge-unsafe-download-url: L’adresse de téléchargement n’a pas passé la validation.
  curseforge-download-integrity: La vérification d’intégrité du téléchargement a échoué. Réessayez.
  wow-addons-settings-invalid: Vérifiez les paramètres des extensions, puis réessayez.
  wow-addons-directory-required: Définissez le dossier du client WoW dans les paramètres des extensions.
  wow-addons-version-required: Sélectionnez une version du jeu compatible dans les paramètres des extensions.
  wow-addons-busy: Une autre opération sur les extensions est en cours. Attendez sa fin.
  wow-addons-key-storage-unavailable: Le stockage sécurisé des clés est indisponible. Redémarrez Compagnon WoW, puis réessayez.
  wow-addons-key-unreadable: Compagnon WoW ne peut pas lire la clé API enregistrée. Enregistrez-la à nouveau.
  wow-addons-required-dependency: Une dépendance requise n’a pas pu être installée. Réessayez.
  wow-addons-unmanaged-conflict: Un dossier d’extension non géré existe déjà. Déplacez-le avant d’installer cette extension.
  wow-addons-folder-conflict: Un dossier entre en conflit avec une autre extension. Déplacez-le avant l’installation.
  wow-addons-unsafe-archive: L’archive contient des chemins dangereux et ne peut pas être installée.
  wow-addons-install-failed: L’installation a échoué. Vérifiez le dossier du client, puis réessayez.
  wow-addons-invalid-directory: Le dossier du client est invalide ou indisponible. Vérifiez son chemin dans les paramètres des extensions.
  wow-addons-invalid-archive: L’archive est invalide ou dangereuse et ne peut pas être installée.
  wow-addons-directory-conflict: Un dossier d’extension existant entre en conflit avec cette installation. Déplacez-le avant de réessayer.
  wow-addons-request-failed: L’opération sur l’extension a échoué. Vérifiez le dossier du client, puis réessayez.
  wow-addons-dependency-limit: L’extension nécessite trop de dépendances imbriquées pour être installée en toute sécurité.
  wow-addons-stopped: L’opération sur l’extension s’est arrêtée. Rouvrez le centre des extensions, puis réessayez.
