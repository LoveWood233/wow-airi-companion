screen-assist:
  title: Assistance par capture du jeu
  description: 'Dites « regarde ça » ou « regarde mon équipement » pour que votre compagnon examine la fenêtre Warcraft actuelle et réponde selon l’image.'
  enabled: Capturer lorsque je demande à voir le jeu
  enabled-description: 'Une demande écrite ou vocale capture une image du jeu. Les images jointes sont prioritaires. Une conversation ordinaire ne déclenche aucune capture.'
  image-use: 'La capture est envoyée au fournisseur de vision. Les services de chat compatibles avec les images la reçoivent aussi pour ce tour. Le chat textuel utilise sa description. L’image reste hors de l’historique local.'
  target: Fenêtre du jeu
  target-description: La sélection automatique exige une seule fenêtre Warcraft.
    Si plusieurs versions sont ouvertes, choisissez-en une. Fermez les fenêtres
    supplémentaires de cette version.
  games:
    auto: Automatique
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Configurer le modèle de vision
  vision-description: Choisissez un fournisseur et un modèle compatibles avec les
    images dans les paramètres Vision. Ouvrir ces paramètres ne prend aucune
    capture.
  examples-title: Posez une question par écrit ou à voix haute
  examples:
    terrain: Peux-tu regarder le terrain devant moi et m’aider à trouver un passage ?
    quest: La quête indique que le PNJ est ici, mais je ne le vois pas. Peux-tu
      m’aider à le trouver ?
    scene: 'Regarde ça et dis-moi ce que tu vois.'
    equipment: 'Regarde mon équipement. Qu’en penses-tu ?'
  command: Pour demander une capture, commencez le message par /look et ajoutez
    votre question. Après un déplacement dans le jeu, redemandez une nouvelle
    image.
  limits: Windows uniquement. Gardez le jeu visible. Une image ne confirme ni les
    collisions, ni les entrées cachées, ni les phases de quête. Les conseils ne
    contrôlent pas votre personnage.
  capturing: Capture de la fenêtre Warcraft…
  analyzing: Analyse de l’écran du jeu…
  ready: Écran analysé. Préparation de la réponse.
  errors:
    unsupported-platform: L'assistance des captures d'écran du jeu nécessite Windows.
    invalid-request: La version du jeu sélectionnée est invalide. Sélectionnez-le à
      nouveau dans les paramètres d'aide à la capture d'écran.
    game-not-found: Aucune fenêtre de Warcraft n'a été trouvée. Ouvrez le jeu et réessayez.
    ambiguous-window: Plusieurs fenêtres de jeu correspondantes sont ouvertes.
      Sélectionnez une version du jeu ou fermez les fenêtres supplémentaires et
      réessayez.
    minimized-window: La fenêtre de jeu est réduite. Restaure-le et demande encore.
    unverified-game: Je ne peux pas vérifier cette fenêtre de jeu. Utilisez une
      installation officielle de Warcraft.
    capture-failed: Je ne peux pas prendre une capture d'écran de jeu. Gardez le jeu
      visible et essayez le mode fenêtre.
    empty-frame: La capture d'écran est vide ou noire. Gardez le jeu visible et
      demandez encore.
    capture-timeout: L'opération de capture d'écran est terminée. Attendez un
      instant et demandez encore.
    busy: Une autre capture d'écran est en cours. Attends qu'il soit fini.
    window-changed: La fenêtre du jeu a changé pendant la prise d'écran. Demandez
      encore une nouvelle capture d'écran.
    vision-not-configured: Sélectionnez un fournisseur et un modèle de vision avant
      de demander une assistance par capture du jeu.
    vision-failed: Le modèle d'IA d'analyse d'image ne peut pas lire la capture
      d'écran. Vérifiez les paramètres du modèle et réessayez.
    no-description: Le modèle d'IA d'analyse d'image n'a pas fourni de description.
      Essayez à nouveau ou choisissez un autre modèle qui prend en charge les
      images.

