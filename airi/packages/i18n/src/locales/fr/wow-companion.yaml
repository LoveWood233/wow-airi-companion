equipment-swaps:
  title: Résultats des changements d’équipement
  description: L’extension propose les améliorations nettes, les emplacements vides et les objets de niveau supérieur gagnant en caractéristique principale malgré des pertes secondaires. Chaque changement nécessite confirmation.
  confirmation: Confirmez dans le jeu. Choisir Oui dans Compagnon WoW affiche l’étape suivante. Cela ne change pas l’équipement et n’envoie aucune commande au jeu.
  empty: Aucun résultat de confirmation d’équipement dans cette session du personnage.
  bridge-update: Cette passerelle ne fournit pas les résultats des changements d’équipement. Mettez à jour l’extension et la passerelle, puis redémarrez Compagnon WoW.
  read-error: Certains résultats d’équipement sont indisponibles.
  historical: Derniers résultats connus. Compagnon WoW ne les utilise pas comme contexte en direct lorsque la connexion ou les données sont indisponibles.
  observed: Heure du résultat
  previous: Objet précédent
  empty-slot: Emplacement vide
  expired-reason: La question a expiré. L’extension n’a pas effectué le changement.
  scope-note: Ces enregistrements décrivent des actions passées, pas l’équipement actuel. Un niveau d’objet supérieur ne garantit pas de meilleures caractéristiques ou des bonus d’ensemble.
  status:
    equipped: Changement confirmé
    declined: Refusé
    failed: Non confirmé
    expired: Question expirée
  reason:
    confirmed: L’extension a confirmé le changement d’équipement après votre accord dans le jeu.
    user: Vous avez refusé le changement dans le jeu.
    timeout: L’extension n’a pas confirmé le résultat. Vérifiez votre équipement dans le jeu.
    combat: Le combat a interrompu la demande. Confirmez une nouvelle demande après le combat.
    changed: L’objet ou l’emplacement cible a changé. La demande s’est arrêtée.
    unavailable: Les informations de l’objet ou les fonctions du jeu requises étaient indisponibles.
    locked: L’objet était verrouillé. La demande s’est arrêtée.
    cursor: Le curseur tenait un objet. La demande s’est arrêtée.
    dead: Le personnage était mort. La demande s’est arrêtée.
    restricted: Le jeu a restreint l’action. La demande s’est arrêtée.
    disabled: La confirmation d’équipement était désactivée. La demande s’est arrêtée.
    left_world: Le personnage a quitté le monde. La demande s’est arrêtée.
