equipment-prompt:
  message: 'Félicitations pour votre nouvel équipement, {name} ! Vous devenez plus fort. {reason} Confirmez le changement dans le jeu.'
  message-player: '{player}, félicitations pour votre nouvel équipement, {name} ! Vous devenez plus fort. {reason} Confirmez le changement dans le jeu.'
  message-player-tradeoff: '{player}, félicitations pour votre nouvel équipement, {name} ! Votre caractéristique principale peut augmenter. {reason} Examinez les compromis et confirmez le changement dans le jeu.'
  reason:
    stats: 'Les caractéristiques enregistrées s’améliorent nettement après comparaison (niveau d’objet {oldLevel} → {newLevel}).'
    empty: Son emplacement cible est vide.
    tradeoff: 'Niveau d’objet {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, mais {decreases}. Ces caractéristiques présentent des compromis. Le gain global n’est pas garanti.'
    separator: ', '
  accepted: Cliquez sur « Confirmer le changement » dans le jeu. Compagnon WoW n’envoie aucune commande au jeu.
  accept: Oui
  decline: Non merci
  timeout: Choisissez sous 10 secondes. Sans réponse, le rappel se ferme. Le changement nécessite toujours une confirmation dans le jeu.
  description: 'L’extension compare l’équipement. Vérifiez les caractéristiques et confirmez chaque changement dans le jeu.'
