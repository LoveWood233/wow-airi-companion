equipment-prompt:
  message: 'Félicitations pour votre nouvel équipement, {name} ! Une nouvelle occasion de devenir plus fort. {reason} Voulez-vous changer d’équipement ?'
  message-player: '{player}, félicitations pour votre nouvel équipement, {name} ! Une nouvelle occasion de devenir plus fort. {reason} Voulez-vous changer d’équipement ?'
  message-player-tradeoff: '{player}, félicitations pour votre nouvel équipement, {name} ! Il peut améliorer votre caractéristique principale. {reason} Voulez-vous changer d’équipement ?'
  reason:
    stats: 'Les caractéristiques enregistrées s’améliorent nettement après comparaison (niveau d’objet {oldLevel} → {newLevel}).'
    empty: Son emplacement cible est vide.
    tradeoff: 'Niveau d’objet {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, mais {decreases}. Ces caractéristiques présentent des compromis. Le gain global n’est pas garanti.'
    separator: ', '
  accepted: Cliquez sur « Confirmer le changement » dans le jeu. Compagnon WoW n’envoie aucune commande au jeu.
  accept: Oui
  decline: Non merci
  timeout: Choisissez sous 10 secondes. Sans réponse, le rappel se ferme. Le changement nécessite toujours une confirmation dans le jeu.
  description: Une amélioration nette ou un niveau d’objet supérieur avec un gain principal peut déclencher une question. Les pertes secondaires restent affichées. Chaque changement nécessite confirmation.
idle-interaction:
  title: Interaction du compagnon hors combat
  messages:
