title: Compagnon WoW
description: Ensemble en Azeroth. Observez l’état du personnage et réagissez aux moments importants.
product:
  about-title: À propos de Compagnon WoW
  description: Compagnie dans World of Warcraft, discussion vocale et gestion des extensions.
  version: Version
  project: Projet
  third-party: Licences tierces
  license-note: Ce logiciel utilise des composants libres. Leurs mentions de droits d’auteur et licences restent dans les fichiers sources et distribués.
  local-provider-note: Configurez les services de discussion et de voix dans les paramètres. Aucun compte de l’application n’est requis.
connection: Connexion au jeu
last-seen: Dernière observation
demo-warning: Ces données sont simulées. Elles ne décrivent pas un personnage réel.
model-required: Sélectionnez un fournisseur et un modèle de discussion dans Compagnon WoW pour activer les réponses. La voix utilise vos paramètres actuels.
start-bridge: Compagnon WoW démarre la passerelle locale lorsque cette connexion est activée. Gardez la grille de l’extension visible. Windows nécessite Python 3.10 ou ultérieur.
player: Personnage
level: Niveau
zone-label: Lieu
class-spec: Identifiant de classe / spécialisation
faction: Faction
race: Race
identity-unknown: Inconnu
factions:
  Alliance: Alliance
  Horde: Horde
  Neutral: Neutre
activity: Activité
freshness: Observation
dead: Mort
combat: En combat
exploring: En exploration
current: Actuel
historical: Dernier état connu
no-character: Aucun personnage observé pour le moment. Vérifiez la passerelle et les coordonnées de capture.
preferences: Préférences du compagnon
preferences-description: La connexion continue après la fermeture de cette page. Seule la fenêtre principale du personnage génère des réponses.
options:
  enabled: Activer le compagnon
  muted: Couper les réactions au jeu
  quietInCombat: Garder le silence en combat
  levelUp: Célébrer les montées de niveau
  zone: Commenter les nouveaux lieux
  death: Réagir à la mort
  revive: Saluer la résurrection
  allowDemo: Autoriser les réponses aux événements de démonstration
hints:
  enabled: Rend l’état actuel du jeu accessible au personnage.
  muted: Actualise le contexte sans réponses spontanées aux événements du jeu.
  quietInCombat: Conserve un événement important jusqu’à la fin du combat. Les événements expirent après 30 secondes.
  levelUp: Détecte un niveau supérieur dans la même session de personnage.
  zone: Réagit à une nouvelle carte ou zone en respectant le délai entre les réactions.
  death: Réagit brièvement sur le ton du personnage, avec des plaisanteries de faction ou de race si approprié.
  revive: Réagit au retour à la vie du personnage.
  allowDemo: Désactivé par défaut. Les réponses de test utilisent le modèle et la voix configurés.
cooldown: Secondes minimales entre les réactions
cooldown-description: De 0 à 300 secondes. Un seul événement récent attend pendant ce délai.
capture: Étalonnage de l’écran
capture-description: La grille par défaut utilise un pixel physique par cellule et mesure 64 × 64 pixels. C’est le minimum de ce format monochrome. Les coordonnées sont les pixels physiques du bureau.
capture-x: Bord gauche de la grille (X)
capture-y: Bord supérieur de la grille (Y)
cell-size: Taille des cellules en pixels
poll-ms: Intervalle de capture en millisecondes
pause-capture: Suspendre la capture
capture-help: Utilisez /wowc compact pour une grille de 64 × 64 et /wowc status pour lire son origine. Ne masquez pas la grille. Si les cellules sont floues, utilisez /wowc cell 2 et réglez ici leur taille sur 2.
save-preferences: Enregistrer les préférences
save-capture: Appliquer l’étalonnage
saved: Enregistré.
failed: L’opération a échoué.
demo: Test de connexion
demo-description: Testez sans vous connecter au jeu. Les événements de démonstration restent hors du contexte du personnage jusqu’à votre autorisation ci-dessus.
demo-label: Démonstration
start-demo: Démarrer la démonstration
stop-demo: Revenir à la capture en direct
actions:
  level_up: Simuler une montée de niveau
  zone: Changer de zone
  death: Simuler la mort
  revive: Simuler une résurrection
  combat: Basculer le combat
events: Événements récents du jeu
events-description: Ce sont des observations, pas des accusés de réception. Les événements filtrés ou silencieux restent visibles ici.
no-events: Aucun événement pour le moment.
gold:
  title: Registre d’or
  description: Suivez les mouvements d’argent par compte local de l’extension. Les totaux s’actualisent avec la connexion au jeu et restent sur cet ordinateur.
  current-balance: Argent actuel du personnage
  current-unavailable: L’argent actuel est indisponible. Gardez un personnage réel connecté avec la capture en direct pour lire son solde.
  empty: Aucun mouvement d’argent réel observé. Installez l’extension et la passerelle à jour, puis connectez chaque personnage.
  storage-error: Le chargement ou l’enregistrement du registre a échoué. Les totaux sur disque ne sont pas confirmés. Vérifiez l’erreur et l’espace disponible.
  unnamed-account: Compte local de l’extension
  account-id: Identifiant du compte
  account-name: Libellé du compte
  account-name-placeholder: Par exemple, compte principal
  account-name-help: 64 caractères maximum. Laissez vide pour supprimer le libellé.
  save-name: Enregistrer le libellé
  character-count: 'Personnages enregistrés : {count}'
  since: Suivi sur le bureau depuis
  earned: Total des entrées
  spent: Total des sorties
  net: Variation nette
  balance: Soldes enregistrés des personnages
  character: Personnage
  realm: Royaume
  character-balance: Dernier solde
  last-seen: Dernière observation
  characters-description: Derniers soldes connus et mouvements enregistrés pour ce compte.
  identity-note: Les comptes utilisent un identifiant local enregistré par l’extension. Compagnon WoW ne lit pas votre compte de connexion. Nommez chaque identifiant pour le reconnaître.
  flow-note: Les soldes initiaux ne comptent pas comme entrées. Courrier, échanges, dépôts, retraits et transferts entre vos personnages comptent comme mouvements d’argent.
  balance-note: Les soldes couvrent uniquement les personnages observés lors de leur dernière lecture. Ils ne sont pas tous actuels. La banque de bataillon est exclue.
  demo-note: Les données de démonstration restent hors du registre. Les variations d’argent actualisent le contexte de discussion sans réponses vocales spontanées.
  money: '{sign}{gold}po {silver}pa {copper}pc'
status:
  disabled: Compagnon désactivé
  disconnected: Passerelle indisponible
  waiting: En attente du jeu
  live: Personnage en direct
  stale: Capture obsolète
  demo: Données de démonstration
  paused: Capture suspendue
versions:
  label: Version de World of Warcraft
  isolation: Chaque version possède ses paramètres, étalonnage, événements et historiques d’or, d’équipement et de niveaux. Changer de page supprime les modifications non enregistrées.
  retail:
    name: World of Warcraft actuel
    description: Paramètres du compagnon et registre d’or pour la version actuelle.
    capture-help: Utilisez /wowc compact pour une grille de 64 × 64, puis /wowc status pour lire son origine. Les bordures et autres écrans modifient les coordonnées. Gardez la grille visible. Si elle est floue, utilisez /wowc cell 2 et une taille de cellule de 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Paramètres du compagnon et registre d’or indépendants pour Forever.
    preview: Cette version est préparée avant la sortie du client. La compatibilité nécessite une vérification après sa sortie. La connexion est désactivée par défaut.
    capture-help: Après l’installation de l’extension Forever, utilisez /wowf compact pour une grille de 64 × 64 et /wowf status pour lire son origine. Gardez-la visible. Si elle est floue, utilisez /wowf cell 2 et une taille de cellule de 2.
level-history:
  title: Historique des niveaux du personnage
  description: Compagnon WoW enregistre les niveaux observés de chaque personnage sur cet ordinateur. La durée utilise l’horloge réelle et inclut le temps hors ligne.
  empty: Aucun historique de niveaux. Connectez un personnage réel pour commencer un suivi à partir de son niveau actuel.
  storage-error: Le chargement ou l’enregistrement de l’historique des niveaux a échoué. Le stockage sur disque n’est pas confirmé. Vérifiez l’erreur et l’espace disponible.
  current-character: Personnage actuel
  account: Identifiant du compte local
  current-level: 'Dernier niveau observé : {level}'
  first-seen: Premier enregistrement
  complete-count: Intervalles complets d’un niveau
  average: Moyenne des intervalles complets
  show-records: Afficher l’historique des niveaux
  hide-records: Masquer l’historique des niveaux
  table-description: Tous les changements enregistrés, du plus récent au plus ancien. Les heures utilisent le fuseau horaire de cet ordinateur.
  level-change: Changement de niveau
  recorded-at: Heure d’enregistrement
  duration: Durée de ce niveau
  source-title: Observation
  unknown-duration: Inconnue
  partial: Durée depuis la première observation du niveau précédent. Ce n’est pas la durée complète de ce niveau.
  offline-note: L’intervalle inclut le temps hors ligne, sur d’autres personnages et lorsque Compagnon WoW est fermé. Les enregistrements persistent après redémarrage.
  observation-note: Compagnon WoW ne peut pas retrouver les montées de niveau manquées. Une première observation ou un changement après une interruption ne prouve pas l’heure exacte.
  average-note: La moyenne utilise seulement les intervalles complets d’un niveau. Elle exclut les intervalles partiels, changements manqués, baisses de niveau et changements d’horloge.
  duration-days: '{days}j {hours}h {minutes}min {seconds}s'
  duration-hours: '{hours}h {minutes}min {seconds}s'
  duration-minutes: '{minutes}min {seconds}s'
  duration-seconds: '{seconds}s'
  source:
    baseline: Première observation. L’heure de la montée de niveau antérieure est inconnue.
    live: Montée de niveau observée pendant la capture en direct.
    gap: Changement détecté après une interruption ou sur plusieurs niveaux. Les heures des montées sont inconnues.
    decrease: Baisse de niveau observée. Aucun intervalle de progression ne s’applique.
    clock-change: L’horloge de l’ordinateur a changé. Cet intervalle ne peut pas être mesuré.
