equipment-write: 'Impossibile salvare la cronologia equipaggiamento ({path}). Le modifiche sono solo in memoria. Compagno di WoW riproverà. {detail}'
comparisons-read: 'Impossibile caricare i confronti dell’equipaggiamento ({path}). Ripristina il file e riavvia Compagno di WoW. {detail}'
comparisons-write: 'Impossibile salvare i confronti dell’equipaggiamento ({path}). Le modifiche sono solo in memoria. Compagno di WoW riproverà. {detail}'
