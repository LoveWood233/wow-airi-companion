allow-visible-on-all-workspaces:
  title: Visibilità tra spazi di lavoro
  description: Mostra la finestra in tutti gli spazi di lavoro, solo su macOS.
microphone-permission:
  prompt:
    title: Consentire l'accesso al microfono?
    description: Compagno di WoW usa il microfono per input vocale e trascrizione. La scelta resta attiva finché non la reimposti nelle impostazioni.
    allow: Consenti
    deny: Nega
  states:
    not-determined: Non impostato
    granted: Consentito
    denied: Negato
  settings:
    title: Microfono
    description: Controlla se Compagno di WoW può usare il microfono. Reimpostare la scelta interrompe il flusso attuale e richiede di nuovo il consenso al prossimo utilizzo.
    revoke: Revoca accesso
    reset: Reimposta scelta
spotlight:
  errors:
    unknown: Errore sconosciuto
    prefix: 'Si è verificato un problema: {message}'
    shortcutRegistrationFailed: Impossibile registrare la scorciatoia dei comandi rapidi.
pages:
  modules:
    mcp-server:
      description: Collega e gestisci server e strumenti MCP
      title: Server MCP
  system:
    general:
      hide-app-icon:
        title: Nascondi icona nella barra / Dock
        description: Mantieni Compagno di WoW solo nell'area di notifica. Usa il relativo menu per aprire finestre o uscire. Le modifiche si applicano subito.
        load-error: Non è riuscito a caricare l'impostazione dell'icona dell'app.
        save-error: Non è riuscito ad aggiornare le impostazioni dell'icona dell'app.
    sections:
      section:
        window-shortcuts:
          title: Scorciatoie da tastiera
    window-shortcuts:
      description: Modificare le scorciatoie della finestra.
      title: Scorciatoie delle finestre
      empty: Non impostato
      spotlight:
        title: Scorciatoia dei comandi rapidi
        description: Fai clic sulla scorciatoia e premi una nuova combinazione. Premi Esc per annullare.
      push-to-talk:
        title: Scorciatoia Premi per parlare
        description: Tieni premuta questa scorciatoia in qualsiasi app mentre parli a Compagno di WoW. Per cambiarla, fai clic e premi una nuova combinazione. Esc annulla.
        inactive: La scorciatoia funziona solo con la modalità Premi per parlare in Ascolto e il microfono attivo.
      actions:
        recording: Premi i tasti
        reset: Reimposta
      errors:
        load: Impossibile caricare la scorciatoia
        conflict: Scorciatoia già in uso.
        failed: Impossibile aggiornare la scorciatoia
        requiresModifier: Usa almeno uno tra Cmd, Ctrl, Alt o Super.
        requiresHoldModifier: Usa Cmd, Ctrl, Alt, Super o un tasto funzione come F13. Il solo Maiusc non basta.
        denied: Compagno di WoW non può leggere i tasti globali. Autorizzalo nelle impostazioni Accessibilità, poi riprova.
        unsupported: Il sistema non rileva il rilascio di una scorciatoia globale.
      toggle-move:
        label: Attiva/disattiva spostamento
      toggle-resize:
        label: Attiva/disattiva ridimensionamento
      toggle-ignore-mouse-event:
        label: Attiva/disattiva il passaggio dei clic
      press-keys: Premi i tasti…
    developer:
      sections:
        section:
          use-window-mouse:
            title: utilizzareWindowMouse Tool
            description: Provare la posizione del cursore della finestra Electron
devtools:
  title: Sviluppatore
  pages:
    context-flow:
      title: Flusso di contesto
    presence-bubble:
      title: La bolla di presenza
      description: Spostare la bolla sopra il personaggio e guardarla dalla finestra principale
      override:
        title: Conduci la bolla da qui.
        description: Mentre questo è fuori dal palcoscenico non si vede nessuna bolla a meno che non ci sia un turno di chat.
      thinking:
        title: Ragionamento
        description: Mostra i punti. Ha la precedenza sul conto non letto.
      unread:
        title: Messaggi non letti
        description: Mostra come un pannello sulla testa, con un segno e il conteggio.
      main-window-note: Le modifiche vengono visualizzate nella finestra principale Compagno di WoW.
    live2d-ambient-light:
      title: Luce ambientale Live2D
      description: Il campionamento dello schermo di sintonia e l'ombrador di luci a colori Live2D
      controls:
        title: Fonte luminosa e uscita
      enabled:
        title: Luce ambientale
        description: Applicare il filtro di luce ambientale al modello Live2D attivo.
      source:
        title: Fonte luminosa
        options:
          screen-capture: Captura dello schermo
          forced-color: Colore forzato
      mode:
        title: Modalità di illuminazione
        options:
          window-gradient: Gradiente delle finestre
          global: Ambienti globali
      forced-color:
        title: Colore di prova
        description: Applicare questo colore senza la cattura dello schermo.
      strength:
        title: Forza luminosa
        description: Imposta la quantità di effetto complessiva. 1 è l'aspetto progettato, e fino a 3 rende il rivestimento luminoso e la luce posteriore più forte.
      squint:
        title: Squillare a cambiamenti luminosi
        description: Stringete gli occhi quando lo schermo risplende più velocemente di quanto il personaggio si sia adattato. Uno schermo che rimane luminoso lascia gli occhi aperti. 0 lo spegne.
      main-window-note: Le modifiche vengono visualizzate nella finestra principale Compagno di WoW.
      diagnostics:
        title: Diagnostiche di cattura
        waiting: Aspetto la diagnosi dalla finestra principale di Compagno di WoW.
        status:
          disabled: Disattivato
          starting: Iniziare
          capturing: La cattura
          forced-color: Colore forzato
          error: Errore
        capture:
          title: Stato di cattura
          description: Ispezionare il display selezionato, le dimensioni di cattura e le coordinate di esclusione.
          display: Display e confini
          video-size: Video sorgente
          sample-size: Quadro campione
          window-bounds: Lenti di finestre Compagno di WoW
          excluded-region: Regione esclusa
          exposure: esposizione allo schermo
          behind-luminance: Luce dietro il personaggio
          updated: Ultimo aggiornamento
        preview:
          title: Captura in scala ridotta
          description: Il rettangolo rosso segna la finestra Compagno di WoW. Il rettangolo tracciato segna l'area che le mappe luminose coprono.
          unavailable: Nessun quadro catturato è disponibile.
        pixels:
          title: Decisioni di pixel
          total: Complesso
          accepted: Accettazione
          excluded: Pintura
          transparent: Trasparenza
          see-through: La trasparenza
        maps:
          title: Mappe luminose
          window: Ogni mappa copre la finestra Compagno di WoW e mezza finestra su ogni lato. Il contorno segna la finestra.
          unavailable: Nessun ambiente è disponibile.
          target: Misurato
          applied: Applicato dopo il liscio
          surround:
            title: Mappa circostante
            description: Grande sfoco dello schermo intorno e dietro la finestra. Porta il colore della luce e il lato da cui viene.
          contact:
            title: Mappa di contatto
            description: Stretta confusione dello stesso contenuto. Questa mappa guida il rivestimento della luce e il bordo della retroilluminazione.
      sampling:
        title: campionamento dello schermo
        capture-interval:
          title: Intervallo di acquisizione
          description: Impostare il tempo tra i campioni dello schermo. Il flusso di cattura corre a questa velocità.
        response-time:
          title: Tempo di risposta
          description: Impostare la velocità con cui i colori campionati si adattano al cambiamento dello schermo.
        sample-width:
          title: Dimensione del campione
          description: Impostare la larghezza della cornice di cattura a scalata inferiore. Un quadro più ampio mette più dettagli nelle mappe luminose. L'altezza segue il tuo display.
        neutral-color-weight:
          title: Peso neutro di colore
          description: Imposta il peso minimo per i colori a bassa saturazione. Il contenuto colorato conta per qualcosa di più che il grigio.
      shader:
        title: Risposta dell' ombra
        dark-base:
          title: Pavimento di luminosità
          description: Imposta la luminosità del modello su uno schermo nero. Uno schermo bianco mostra il modello disegnato, e uno schermo più scuro lo oscura verso questo piano.
        base-curve:
          title: Curva di luminosità
          description: Impostare come la luminosità del modello aumenta tra il pavimento e l'opera d'arte. Al di sopra di 1 uno schermo mezzo illuminato mantiene il modello più vicino al pavimento.
        local-share:
          title: Parte della luce locale
          description: Indicare quanto della luminosità del modello segue la luce accanto a esso piuttosto che l'intero display. A 0 il modello mantiene una luminosità ovunque sia la sua finestra.
        tint:
          title: Tinta
          description: Imposta la quantità di tonalità dello schermo che il modello richiede. A 0 solo la luminosità dello schermo raggiunge il modello.
        color-boost:
          title: Aumento del colore della luce scura
          description: Imposta quanto colore extra il modello prende dalla luce scarsa ma satura. La luminosità rimane dove la luce la mette, e nessun canale cade al di sotto del modello non illuminato.
        wrap-intensity:
          title: Intensità di rivestimento leggero
          description: Impostare quanto forte il colore di sfondo sanguini sul bordo del modello.
        wrap-saturation:
          title: Saturazione di rivestimento leggero
          description: Impostare la quantità di tonalità dello schermo che la luce avvolta conserva. 0 aggiunge luce bianca della stessa luminosità. 1 aggiunge il colore dello schermo completo.
        backlight:
          title: Luce posteriore
          description: Imposta la intensità della luce da dietro il personaggio che illumina il bordo sottile lungo tutto il bordo.
        wrap-diffuse:
          title: Larghezza leggera dell'imballaggio
          description: Indicare fino a che punto il colore di sfondo avvolto raggiunge l'interno del bordo del modello.
        translucent-wrap:
          title: Riduzione dell'imballaggio sulle parti traslucide
          description: Scale il rivestimento leggero e il bordo per il quadrato del modello alfa. Le parti disegnate con alfa parziale mostrano già il desktop attraverso se stessi.
      preview-shader:
        title: Preview dell' ombra
        description: Eseguire il vero shader su una scheda di prova, con l'ambiente live e le impostazioni sopra.
        window-mapping: Il filtro prende questa tela come intera finestra dello stadio, quindi l'anteprima non è una copia pixel accurata dello stadio.
        filtered: Uscita di ombra
        unavailable: La preview ha bisogno di WebGL, e questa finestra non ha potuto creare un contesto.
        environment:
          live: La luce proviene dall'ultimo istantaneo pubblicato dalla finestra principale Compagno di WoW.
          neutral: Non è ancora arrivato un'istantanea, quindi l'anteprima utilizza l'ambiente neutro.
        regions:
          title: Regioni delle schede di prova
          body: Il corpo largo porta una rampa di tono da sRGB {low} a {high}. Brillantezza, contrasto, croma, e spettacolo di testa.
          bars: Le barre sono pixel di larghezza {first}, {second}, {third}, {fourth} e {fifth}. Esse mostrano fino a che punto la luce raggiunge una forma sottile.
          patches: Le due macchie sono disegnate a {strong} e {weak} alpha, su cui agisce l'opzione di rivestimento translucente.
