      parameter-note: Il joystick controlla X/Y. Mappe R a 1/3 squint. F mappa a 2/3 squint. Mappe C a occhi completamente chiusi. Mappe W/S a forma orale ±1. Mappe spaziali a bocca aperta 1. Mappe A/D al corpo X ±10°. Mappe Q/E per la direzione Z ±30°.
