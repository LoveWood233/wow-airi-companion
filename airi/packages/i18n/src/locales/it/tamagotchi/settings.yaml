screen-capture:
  permissions-prompt:
    title: Acquisizione schermo
    description: Per acquisire schermi o finestre servono le autorizzazioni alla registrazione dello schermo e dell'audio di sistema.
    open-preferences: Apri impostazioni di sistema
    dismiss: Ignora
    instructions:
      step-1: Apri le impostazioni di sistema e seleziona Privacy e sicurezza nella barra laterale.
      step-2: Nelle sezioni di registrazione dello schermo e dell'audio di sistema, attiva gli interruttori per Compagno di WoW.
      step-2-note: Se Compagno di WoW non compare, aggiungilo con il pulsante + selezionandolo dalla cartella Applicazioni.
