  curseforge-too-many-redirects: Il download presenta troppi reindirizzamenti. Riprova più tardi.
  curseforge-not-found: CurseForge non trova questo addon o file. Aggiorna la lista degli addon.
  curseforge-disposed: Il servizio addon si è arrestato. Riapri il centro addon e riprova.
  curseforge-incompatible-version: Il file addon non corrisponde alla versione del gioco configurata.
  curseforge-distribution-disabled: L'autore non consente l'installazione di questo addon tramite strumenti di terze parti.
  curseforge-download-unavailable: CurseForge non offre un download per questo file addon.
  curseforge-unsafe-download-url: L'indirizzo di download non ha superato la convalida.
  curseforge-download-integrity: Il download dell'addon non ha superato il controllo di integrità. Riprova.
  wow-addons-settings-invalid: Controlla le impostazioni addon e riprova.
  wow-addons-directory-required: Imposta la cartella del client WoW nelle impostazioni addon.
  wow-addons-version-required: Seleziona una versione del gioco compatibile nelle impostazioni addon.
  wow-addons-busy: È in corso un'altra operazione addon. Attendi che finisca.
  wow-addons-key-storage-unavailable: L'archiviazione sicura delle chiavi non è disponibile. Riavvia Compagno di WoW e riprova.
  wow-addons-key-unreadable: Compagno di WoW non riesce a leggere la chiave API salvata. Salvala di nuovo.
  wow-addons-required-dependency: Impossibile installare una dipendenza richiesta dall'addon. Riprova.
  wow-addons-unmanaged-conflict: Esiste già una cartella addon non gestita. Spostala prima di installare questo addon.
  wow-addons-folder-conflict: Una cartella addon è in conflitto con un altro addon. Spostala prima dell'installazione.
  wow-addons-unsafe-archive: L'archivio addon contiene percorsi non sicuri e non può essere installato.
  wow-addons-install-failed: Installazione non riuscita. Controlla la cartella del client e riprova.
  wow-addons-invalid-directory: La cartella del client non è valida o disponibile. Controlla il percorso nelle impostazioni addon.
  wow-addons-invalid-archive: L'archivio addon non è valido o sicuro e non può essere installato.
  wow-addons-directory-conflict: Una cartella addon esistente è in conflitto con l'installazione. Spostala prima di riprovare.
  wow-addons-request-failed: Operazione addon non riuscita. Controlla la cartella del client e riprova.
  wow-addons-dependency-limit: L'addon richiede troppe dipendenze annidate per un'installazione sicura.
  wow-addons-stopped: Operazione addon interrotta. Riapri il centro addon e riprova.
