current: Attuale
historical: Ultimo stato noto
no-character: Nessuna osservazione del personaggio. Controlla il ponte e le coordinate di acquisizione.
preferences: Preferenze del compagno
preferences-description: La connessione continua dopo aver chiuso questa pagina. Solo la finestra principale del personaggio genera risposte.
options:
  enabled: Attiva compagno
  muted: Silenzia reazioni al gioco
  quietInCombat: Resta in silenzio in combattimento
  levelUp: Festeggia gli aumenti di livello
  zone: Commenta nuove località
  death: Reagisci alla morte
  revive: Accogli la resurrezione
  allowDemo: Consenti risposte agli eventi dimostrativi
hints:
  enabled: Mantieni lo stato attuale del gioco disponibile al personaggio.
  muted: Continua ad aggiornare il contesto senza risposte spontanee al gioco.
  quietInCombat: Conserva un evento importante fino alla fine del combattimento. Scarta gli eventi dopo 30 secondi.
  levelUp: Rileva un livello superiore nella stessa sessione del personaggio.
  zone: Reagisci a una nuova mappa o zona, rispettando il tempo di attesa.
  death: Reagisci brevemente nel tono del personaggio selezionato, con battute su fazioni o razze quando appropriate.
  revive: Reagisci quando il personaggio torna in vita.
  allowDemo: Disattivato per impostazione predefinita. Le risposte di prova usano il modello e la voce configurati.
cooldown: Secondi minimi tra le reazioni
cooldown-description: Da 0 a 300 secondi. Durante l'attesa resta in coda un solo evento recente.
capture: Calibrazione schermo
capture-description: La griglia predefinita usa un pixel fisico per cella e occupa 64 × 64 pixel, il minimo per questo formato in bianco e nero. Le coordinate usano pixel fisici del desktop.
capture-x: Sinistra della griglia (X)
capture-y: Alto della griglia (Y)
cell-size: Dimensione cella in pixel
poll-ms: Intervallo di acquisizione in millisecondi
pause-capture: Sospendi acquisizione
capture-help: Usa /wowc compact per una griglia 64 × 64 e /wowc status per leggerne l'origine. Non coprire la griglia. Se le celle da un pixel sono sfocate, usa /wowc cell 2 e imposta qui Dimensione cella a 2.
save-preferences: Salva preferenze
save-capture: Applica calibrazione
saved: Salvato.
failed: Operazione non riuscita.
demo: Test di connessione
demo-description: Prova senza accedere al gioco. Gli eventi dimostrativi restano fuori dal contesto finché non li autorizzi sopra.
demo-label: Dimostrazione
start-demo: Avvia dimostrazione
stop-demo: Torna all'acquisizione dal vivo
