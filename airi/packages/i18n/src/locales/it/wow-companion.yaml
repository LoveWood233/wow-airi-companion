  identity-note: Gli account usano un ID locale salvato dall'addon. Compagno di WoW non legge l'account di accesso. Assegna un'etichetta a ogni ID per riconoscerlo.
  flow-note: I saldi iniziali non contano come entrate. Posta, scambi, depositi, prelievi e trasferimenti tra personaggi contano come flussi di denaro.
  balance-note: I saldi coprono solo i personaggi osservati, ciascuno all'ultima osservazione. Non sono tutti attuali. La banca della Brigata è esclusa.
  demo-note: I dati dimostrativi restano fuori dal registro. Le variazioni di denaro aggiornano il contesto senza risposte vocali spontanee.
