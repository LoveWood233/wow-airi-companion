  revive: Simula resurrezione
  combat: Attiva/disattiva combattimento
events: Eventi recenti del gioco
events-description: Sono osservazioni, non ricevute di consegna. Gli eventi silenziati o filtrati restano visibili qui.
no-events: Nessun evento per ora.
