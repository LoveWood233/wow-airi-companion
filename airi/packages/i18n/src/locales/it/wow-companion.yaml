    declined: Rifiutato
    failed: Non confermato
    expired: Domanda scaduta
  reason:
    confirmed: L'addon ha confermato la modifica dopo la tua approvazione nel gioco.
    user: Hai rifiutato la modifica nel gioco.
    timeout: L'addon non ha confermato il risultato. Controlla l'equipaggiamento nel gioco.
    combat: Il combattimento ha interrotto la richiesta. Conferma una nuova richiesta dopo il combattimento.
