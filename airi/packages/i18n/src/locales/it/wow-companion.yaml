equipment-prompt:
  message: Congratulazioni per il nuovo equipaggiamento, {name}! È un'altra occasione per diventare più forte. {reason} Vuoi cambiare equipaggiamento?
  message-player: "{player}, congratulazioni per il nuovo equipaggiamento, {name}! È un'altra occasione per diventare più forte. {reason} Vuoi cambiare equipaggiamento?"
  message-player-tradeoff: "{player}, congratulazioni per il nuovo equipaggiamento, {name}! Può migliorare l'attributo primario. {reason} Vuoi cambiare equipaggiamento?"
  reason:
    stats: Gli attributi registrati migliorano chiaramente dal confronto (livello oggetto {oldLevel} → {newLevel}).
    empty: Lo scomparto di destinazione è vuoto.
    tradeoff: Livello oggetto {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, ma {decreases}. Gli attributi comportano compromessi. Il beneficio complessivo non è garantito.
    separator: ', '
  accepted: Fai clic su “Conferma modifica” nel gioco. Compagno di WoW non invia comandi al gioco.
  accept: Sì
  decline: No, grazie
  timeout: Scegli entro 10 secondi. Senza scelta, il promemoria si chiude. Le modifiche richiedono comunque conferma nel gioco.
  description: Miglioramenti chiari e livelli oggetto superiori con guadagni primari possono proporre una modifica. Le perdite secondarie restano esplicite. Ogni modifica richiede conferma.
