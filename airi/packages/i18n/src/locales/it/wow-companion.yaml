equipment-prompt:
  message: 'Congratulazioni per il nuovo equipaggiamento, {name}! Sei diventato più forte. {reason} Conferma il cambio nel gioco.'
  message-player: '{player}, congratulazioni per il nuovo equipaggiamento, {name}! Sei diventato più forte. {reason} Conferma il cambio nel gioco.'
  message-player-tradeoff: '{player}, congratulazioni per il nuovo equipaggiamento, {name}! Può migliorare la tua statistica primaria. {reason} Valuta i compromessi e conferma il cambio nel gioco.'
  reason:
    stats: Gli attributi registrati migliorano chiaramente dal confronto (livello oggetto {oldLevel} → {newLevel}).
    empty: Lo scomparto di destinazione è vuoto.
    tradeoff: Livello oggetto {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, ma {decreases}. Gli attributi comportano compromessi. Il beneficio complessivo non è garantito.
