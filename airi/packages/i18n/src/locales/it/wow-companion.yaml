  recorded-at: Ora registrata
  duration: Tempo per questo livello
  source-title: Osservazione
  unknown-duration: Sconosciuto
  partial: Tempo dalla prima osservazione del livello precedente. Non rappresenta tutto il tempo trascorso a quel livello.
  offline-note: L'intervallo include tempo offline, con altri personaggi e con Compagno di WoW chiuso. I dati restano dopo il riavvio.
  observation-note: Compagno di WoW non recupera gli orari mancati. Una prima osservazione o una variazione dopo un'interruzione non prova l'orario dell'aumento.
  average-note: La media usa solo intervalli completi di un livello. Esclude intervalli parziali, variazioni mancate, riduzioni di livello e cambi dell'orologio.
