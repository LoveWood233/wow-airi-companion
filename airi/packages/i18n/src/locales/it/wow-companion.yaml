versions:
  label: Versione di World of Warcraft
  isolation: Ogni versione ha impostazioni, calibrazione, eventi, registri dell'oro e cronologie separate. Cambiare pagina scarta le modifiche non salvate.
  retail:
    name: World of Warcraft Retail
    description: Preferenze del compagno e registri dell'oro per Retail.
    capture-help: Usa /wowc compact per una griglia 64 × 64, poi /wowc status per leggerne l'origine. Bordi della finestra e altri monitor cambiano le coordinate. Non coprire la griglia. Se le celle sono sfocate, usa /wowc cell 2 e imposta Dimensione cella a 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Preferenze del compagno e registri dell'oro indipendenti per Forever.
    preview: Questa versione è preparata prima dell'uscita del client. La compatibilità dal vivo richiede una verifica dopo l'uscita. La connessione è disattivata per impostazione predefinita.
    capture-help: Dopo aver installato l'addon Forever, usa /wowf compact per una griglia 64 × 64 e /wowf status per leggerne l'origine. Non coprire la griglia. Se le celle sono sfocate, usa /wowf cell 2 e imposta Dimensione cella a 2.
level-history:
  title: Cronologia livelli del personaggio
  description: Compagno di WoW salva le osservazioni dei livelli su questo computer. Il tempo trascorso usa l'orologio reale e include il tempo offline.
  empty: Nessuna cronologia livelli. Collega un personaggio reale per iniziare dal suo livello attuale.
  storage-error: Impossibile caricare o salvare la cronologia livelli. Il salvataggio su disco non è confermato. Controlla l'errore e lo spazio disponibile.
