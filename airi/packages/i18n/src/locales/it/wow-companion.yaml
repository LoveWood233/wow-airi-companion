  current-unavailable: Denaro attuale non disponibile. Mantieni online un personaggio reale con acquisizione dal vivo per leggere il saldo.
  empty: Nessuna osservazione di denaro reale. Installa addon e ponte aggiornati, poi accedi a ogni personaggio per avviare il registro.
  storage-error: Impossibile caricare o salvare il registro. I totali non sono confermati su disco. Controlla l'errore e lo spazio disponibile.
