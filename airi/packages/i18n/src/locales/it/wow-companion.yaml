equipment-swaps:
  title: Risultati delle modifiche all'equipaggiamento
  description: L'addon propone miglioramenti chiari, scomparti vuoti e livelli oggetto superiori con guadagni primari e perdite secondarie. Ogni modifica richiede conferma.
  confirmation: Conferma nel gioco. Scegliere Sì in Compagno di WoW mostra il passo successivo, senza cambiare l'equipaggiamento o inviare comandi al gioco.
  empty: Nessun risultato di conferma in questa sessione del personaggio.
  bridge-update: Questo ponte non fornisce risultati delle modifiche. Aggiorna addon e ponte, poi riavvia Compagno di WoW.
  read-error: Alcuni risultati dell'equipaggiamento non sono disponibili.
