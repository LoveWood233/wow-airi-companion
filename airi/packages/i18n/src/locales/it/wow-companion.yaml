    inspection-failed: Il programma non poteva essere verificato. Controlla
      l'accesso ai file e prova di nuovo.
    not-configured: Nessuna applicazione è salvata per questa opzione. Configura e
      salva prima la posizione del file.
    storage-error: Non è possibile leggere o salvare le impostazioni di avvio.
      Controllare l'accesso alla cartella dati dell'applicazione.
    launch-failed: Non posso avviare l'applicazione. Controlla le autorizzazioni di
      installazione e file.
    busy: La domanda è già iniziata. Aspetta che finisca.
    request-failed: Il servizio desktop non ha risposto. Prova di nuovo o riavvia il compagno.
screen-assist:
  title: Assistenza tramite schermate del gioco
  description: Chiedi al tuo compagno di esaminare lo screenshot di Warcraft per
    il terreno, le missioni di gioco o la guida NPC.
  enabled: Acquisisci quando chiedo di vedere il gioco
  enabled-description: Una richiesta esplicita acquisisce una schermata del gioco.
    La chat normale non avvia acquisizioni.
  image-use: La schermata viene inviata al fornitore di visione selezionato.
    L’immagine originale non viene salvata nella cronologia locale della chat.
  target: Finestra del gioco
  target-description: La selezione automatica richiede una sola finestra di
    Warcraft. Se sono aperte più versioni, scegline una. Chiudi le finestre
    aggiuntive di quella versione.
  games:
    auto: Automatico
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Configura modello di visione
  vision-description: Scegli un fornitore e un modello che supportano le immagini
    nelle impostazioni Visione. Aprire queste impostazioni non acquisisce
    schermate.
  examples-title: Chiedi in chat o a voce
  examples:
    terrain: Puoi guardare il terreno davanti a me e aiutarmi a trovare un passaggio?
    quest: La missione indica che il PNG è qui, ma non lo vedo. Puoi aiutarmi a
      trovarlo?
    scene: Guarda la schermata del gioco e spiega l’obiettivo della missione.
  command: Per richiedere una schermata, inizia il messaggio con /look e aggiungi
    la domanda. Dopo esserti mosso nel gioco, chiedi di nuovo per ottenere una
    nuova immagine.
  limits: Solo Windows. Mantieni il gioco visibile. Una schermata non conferma
    collisioni, ingressi nascosti o fasi delle missioni. I consigli non
    controllano il personaggio.
  capturing: Acquisizione della finestra di Warcraft…
  analyzing: Analisi della schermata del gioco…
  ready: Schermata analizzata. Preparazione della risposta.
  errors:
    unsupported-platform: L'assistenza dello screenshot del gioco richiede Windows.
    invalid-request: La versione del gioco selezionata è invalida. Selezionalo di
      nuovo nelle impostazioni di assistenza per le riprese di schermo.
    game-not-found: Non è stata trovata una finestra corrispondente a Warcraft. Apri
      il gioco e riprova.
    ambiguous-window: Molte finestre di gioco corrispondenti sono aperte.
      Selezionare una versione del gioco o chiudere le finestre extra e
      riprovare.
    minimized-window: La finestra di gioco è ridotta al minimo. Riprendi e chiedi di nuovo.
    unverified-game: Non riesco a verificare questa finestra di gioco. Usa
      un'installazione ufficiale di Warcraft supportata.
    capture-failed: Non posso scattare uno schermo di gioco. Mantenete il gioco
      visibile e provate la modalità con finestre.
    empty-frame: Lo screenshot è vuoto o nero. Tieni il gioco visibile e chiedi di nuovo.
    capture-timeout: L'operazione di screenshot è finita. Aspetta un attimo e chiedi di nuovo.
    busy: Un altro screenshot è in corso. Aspetta che finisca.
    window-changed: La finestra del gioco è cambiata mentre scatto la schermata.
      Chiedi di nuovo un nuovo screenshot.
    vision-not-configured: Seleziona un fornitore e un modello di visione prima di
      richiedere assistenza tramite schermate del gioco.
    vision-failed: Il modello AI di analisi delle immagini non può leggere lo
      screenshot. Controlla le impostazioni del modello e riprova.
    no-description: Il modello di IA di analisi delle immagini non ha restituito
      alcuna descrizione. Prova di nuovo o scegli un altro modello che supporti
      le immagini.

