title: Compagno di WoW
description: Insieme ad Azeroth. Leggi lo stato del personaggio e reagisci ai momenti importanti.
product:
  about-title: Informazioni su Compagno di WoW
  description: Compagnia in World of Warcraft, chat vocale e gestione addon.
  version: Versione
  project: Progetto
  third-party: Licenze di terze parti
  license-note: Questo software usa componenti open source. I relativi avvisi di copyright e licenze restano nei file sorgente e distribuiti.
  local-provider-note: Configura i servizi di chat e voce nelle impostazioni. Non serve un account dell'applicazione.
connection: Connessione al gioco
last-seen: Ultima osservazione
demo-warning: Questi dati sono simulati. Non descrivono un personaggio reale.
model-required: Seleziona un fornitore e un modello di chat in Compagno di WoW per attivare le risposte. La voce usa le impostazioni vocali esistenti.
start-bridge: Compagno di WoW avvia il ponte locale quando attivi questa connessione. Mantieni visibile la griglia dell'addon. Su Windows serve Python 3.10 o successivo.
