    cursor: Il cursore teneva un oggetto. Richiesta interrotta.
    dead: Il personaggio era morto. Richiesta interrotta.
    restricted: Il gioco ha limitato l'azione. Richiesta interrotta.
    disabled: La conferma equipaggiamento era disattivata. Richiesta interrotta.
