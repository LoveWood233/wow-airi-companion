    live: Aumento di livello osservato durante l'acquisizione dal vivo.
    gap: Variazione rilevata dopo un'interruzione o su più livelli. Orari degli aumenti sconosciuti.
    decrease: Riduzione di livello osservata. Nessun intervallo di aumento applicabile.
    clock-change: L'orologio del computer è cambiato. Impossibile misurare questo intervallo.
