  wow-addons-invalid-directory: クライアントフォルダーが無効か、利用できません。アドオン設定でパスを確認してください。
  wow-addons-invalid-archive: アドオンの圧縮ファイルが無効または安全でないため、インストールできません。
  wow-addons-directory-conflict: 既存のアドオンフォルダーがインストール先と競合しています。そのフォルダーを移動して再試行してください。
  wow-addons-request-failed: アドオンの操作に失敗しました。クライアントフォルダーを確認して再試行してください。
  wow-addons-dependency-limit: 依存関係の階層が多すぎるため、安全にインストールできません。
  wow-addons-stopped: アドオンの操作が停止しました。アドオンセンターを開き直して再試行してください。
