hints:
  enabled: 現在のゲーム状態をキャラクターが参照できるようにします。
  muted: 自発的なゲームへの応答を止め、コンテキストの更新を続けます。
  quietInCombat: 重要なイベントを1件、戦闘終了まで保留します。30秒経過したイベントは破棄します。
  levelUp: 同じキャラクターセッション内でレベルの上昇を検出します。
  zone: 待機時間を守りながら、新しいマップやエリアに反応します。
  death: 選択したキャラクターの口調で短く反応します。適切な場合は陣営や種族の冗談を交えます。
  revive: キャラクターが復活したときに反応します。
  allowDemo: 初期設定は無効です。テスト応答は設定済みのモデルと音声を使用します。
cooldown: 反応の最小間隔（秒）
cooldown-description: 0〜300秒。待機中に保留できるのは直近のイベント1件だけです。
capture: 画面の位置調整
capture-description: 標準のグリッドは1セルが物理1ピクセルで、全体は64 × 64ピクセルです。この白黒形式の最小サイズです。座標はデスクトップの物理ピクセルです。
capture-x: グリッドの左端（X）
capture-y: グリッドの上端（Y）
cell-size: セルのサイズ（ピクセル）
poll-ms: キャプチャ間隔（ミリ秒）
pause-capture: キャプチャを一時停止
capture-help: /wowc compactで64 × 64のグリッドを表示し、/wowc statusで原点を確認してください。グリッドを隠さないでください。1ピクセルのセルがぼやける場合は/wowc cell 2を実行し、ここでもセルのサイズを2に設定してください。
save-preferences: 設定を保存
save-capture: 位置調整を適用
saved: 保存しました。
failed: 操作に失敗しました。
demo: 接続テスト
