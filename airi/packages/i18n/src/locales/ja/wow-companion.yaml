equipment-prompt:
  message: '新しい装備{name}の獲得おめでとう！ また強くなったね。{reason}装備の変更はゲーム内で確認してください。'
  message-player: '{player}、新しい装備{name}の獲得おめでとう！ また強くなったね。{reason}装備の変更はゲーム内で確認してください。'
  message-player-tradeoff: '{player}、新しい装備{name}の獲得おめでとう！ 主能力値が上がりそうです。{reason}属性の増減を確認して、ゲーム内で装備を変更するか決めてください。'
  reason:
    stats: '比較した記録上の属性が明確に向上しています（アイテムレベル {oldLevel} → {newLevel}）。'
    empty: 対象の装備スロットは空いています。
    tradeoff: 'アイテムレベル {oldLevel} → {newLevel}、{primary} {oldPrimary} → {newPrimary}、ただし{decreases}。属性には利点と欠点があります。総合的な強化は保証されません。'
    separator: '、'
  accepted: ゲーム内の「変更を確認」をクリックしてください。WoW コンパニオンはゲームへの入力を行いません。
  accept: はい
  decline: 今はやめておく
  timeout: 10秒以内に選択してください。選択しないと通知を閉じます。装備変更にはゲーム内の確認が必要です。
  description: 'アドオンが装備を比較します。属性を確認し、変更は毎回ゲーム内で承認してください。'
