title: WoW コンパニオン
description: アゼロスで一緒に過ごしましょう。キャラクターの状態を読み取り、大切な瞬間に反応します。
product:
  about-title: WoW コンパニオンについて
  description: World of Warcraftでの付き添い、音声チャット、アドオン管理。
  version: バージョン
  project: プロジェクト
  third-party: サードパーティーのライセンス
  license-note: このソフトウェアはオープンソースのコンポーネントを使用しています。著作権表示とライセンスはソースおよび配布ファイルに含まれています。
  local-provider-note: 設定でチャットと音声サービスを設定してください。アプリのアカウントは不要です。
