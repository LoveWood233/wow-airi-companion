  message: '新しい装備「{name}」の入手、おめでとう！ さらに強くなるチャンスだね。{reason} 装備を変更する？'
  message-player: '{player}、新しい装備「{name}」の入手、おめでとう！ さらに強くなるチャンスだね。{reason} 装備を変更する？'
  message-player-tradeoff: '{player}、新しい装備「{name}」の入手、おめでとう！ 主要属性を強化できるよ。{reason} 装備を変更する？'
  reason:
    stats: '比較した記録上の属性が明確に向上しています（アイテムレベル {oldLevel} → {newLevel}）。'
    empty: 対象の装備スロットは空いています。
    tradeoff: 'アイテムレベル {oldLevel} → {newLevel}、{primary} {oldPrimary} → {newPrimary}、ただし{decreases}。属性には利点と欠点があります。総合的な強化は保証されません。'
    separator: '、'
  accepted: ゲーム内の「変更を確認」をクリックしてください。WoW コンパニオンはゲームへの入力を行いません。
