comparison:
  title: 入手時の比較
  missing: 対応する比較データを受信していません。アイテムレベルだけでは強化を判断できません。
  historical: '入手時に観測した装備と専門化:'
  stale-spec: これは過去の比較です。現在のキャラクターまたは専門化が異なるか、取得できません。
  type: 装備の種類
  empty-slot: 空きスロット
  attribute: 属性
  difference: 変化
  item-level: アイテムレベル
  unknown: 不明
  limitation: アイテムレベルと主要属性が上がる場合、副属性が下がっても確認を求めます。特殊効果、セット、ソケット、不完全な情報は別途確認してください。
  verdict:
    upgrade: 明確な強化
    not_upgrade: このキャラクターの強化にはなりません
    review: 確認が必要
  reason:
    empty_slot: 使用可能なアイテムで空きスロットを埋めます
    stats_upgrade: 比較属性が向上し、記録上の低下はありません
    unusable: このアイテムは現在使用できません
    wrong_spec: 観測した専門化に適合しません
    weaker_stats: 比較属性が低下します
    equivalent: 向上する比較属性がありません
    incomplete: 比較データが不完全か、未対応の属性を含んでいます
    unknown_spec: 専門化への適合性が不明です
    weapon_change: 装備の種類が異なります
    complex_item: 効果や装備の組み合わせの確認が必要です
    stat_tradeoff: 属性に利点と欠点があります
    primary_upgrade_tradeoff: アイテムレベルと主要属性は向上しますが、副属性に低下があります。確認して判断してください。
    no_target: 対象スロットを取得できません
loadout:
  title: 装備中のアイテム
  description: ログイン、装備入手、装備変更時に全19スロットを更新します。WoW コンパニオンはキャラクターごとに最新のスナップショットを保存します。
  characters: 保存済みキャラクター
  waiting: 今回のログインの完全な装備スナップショットを待っています。既存の記録は過去の状態として残ります。
  empty: 装備スナップショットをまだ受信していません。更新済みのアドオンでログインし、転送グリッドを表示してください。
  received: 受信日時
  observed: 観測日時
  historical: 最後に記録したスナップショットです。装備を常時ライブ表示するものではありません。
  unknown: 不明 / 取得不可
  empty-slot: 空きスロット
  incomplete: 一部のアイテム情報が不完全か、短縮されています。
  note: 空きスロットと不明なスロットは異なります。セットの説明だけでは有効なボーナスは分かりません。このスナップショットには入手履歴の10件制限を適用しません。
launcher:
  title: ゲーム起動設定
  description: Battle.net または World of Warcraft アプリケーションを選択してください.
    各ゲームバージョンのアプリケーションファイルの位置を保存します.
  configure: ゲーム起動を設定
  target: 起動するプログラム
  targets:
    battle-net: Battle.net
    retail: World of Warcraft Retail
    forever: World of Warcraft Forever
    classic: World of Warcraft Classic
  default-summary: クイック起動：{target}
  path-label: '{target} のプログラムパス'
  path-description: このゲームバージョンのフォルダで .exe ファイルを選択してください. World of Warcraft
    Launcher.exeについては, Battle.net を選択してください. ショートカットやスクリプトを選択しないでください.
  path-placeholder: .exe ファイルを選択するか、完全なパスを入力
  browse: プログラムを参照
  make-default: このプログラムをクイック起動に使用
  make-default-description: キャラクターのツールバーから、この保存済みプログラムを起動します。
  current-default: クイック起動にこのプログラムが選択されています。
  save: 確認して保存
  clear: 保存したパスを削除
  retry: 設定を再読み込み
  launch-game: ゲームを起動
  launch-battle-net: Battle.net を起動
  quick-launch: ゲームのクイック起動
  quick-launch-description: 保存したデフォルトアプリケーションを起動します. アプリケーションが設定されていない場合は,起動設定を開く.
  saved: プログラムを確認して保存しました。
  cleared: 保存したパスを削除しました。
  launched: 起動リクエストを送信しました。
  unsaved: 起動する前に変更内容を確認して保存してください。
  launch-note: Battle.netはアプリケーションを開設します ゲームにはログインや更新が必要です. 保存されたアプリケーションは,各起動前にチェックされます.
  verified-program: 確認済みプログラム
  errors:
    unsupported-platform: このアプリケーションからゲームを始めるには Windowsが必要です
    invalid-request: 起動設定は無効です ゲームとそのアプリケーションを再び選択します.
    invalid-path: ローカルアプリケーションファイルの完全な位置を入力します. コマンドラインの引数を追加しないでください.
    file-not-found: プログラムが見つかりませんでした 現在の位置を選択します.
    not-executable: Windows の .exe プログラムを選択してください。ショートカット、スクリプト、フォルダーは選択しないでください。
    invalid-signature: 有効な Blizzard の署名がありません。インストール先フォルダーから公式プログラムを選択してください。
    wrong-product: このアプリケーションは選択された Battle.net または World of Warcraft オプションに一致しません.
    wrong-version: このWorld of Warcraftアプリケーションは別のゲームバージョンのものです
      適切なゲームバージョンまたはアプリケーションを選択してください.
    unrecognized-version: ゲームバージョンは確認できなかった. Battle.net で開始するか,このバージョンのサポートを更新します.
    inspection-failed: プログラムを確認できなかった. ファイルアクセスを確認して また試してみてください
    not-configured: このオプションにはアプリケーションが保存されていません. まずファイル位置を設定して保存します
    storage-error: 起動設定を読み取ったり保存したりできません. アプリケーションデータフォルダーへのアクセスを確認する.
    launch-failed: 申請を開始できない. インストールとファイル許可を確認する
    busy: 申し込みが始まっています 終わるまで待って
    request-failed: デスクトップサービスは反応しませんでした また試すか 仲間を再起動する
screen-assist:
  title: ゲーム画面の確認支援
  description: ウォークラフトのスクリーンショットを 地形,ゲームクエスト,またはNPCガイドを調べてください
  enabled: ゲーム画面の確認を頼んだときに撮影する
  enabled-description: 明示的な依頼でゲーム画面を1枚撮影します。通常の会話では撮影しません。
  image-use: 画像は選択した画像認識サービスに送信されます。元画像はローカルのチャット履歴に保存されません。
  target: ゲームウィンドウ
  target-description: 自動選択には Warcraft
    のウィンドウが1つ必要です。複数のバージョンを開いている場合は1つを選び、同じバージョンの余分なウィンドウを閉じてください。
  games:
    auto: 自動
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: 画像認識モデルを設定
  vision-description: 視覚設定で画像対応のサービスとモデルを選択してください。この設定画面を開いても撮影しません。
  examples-title: チャットまたは音声で依頼
  examples:
    terrain: 前の地形を見て、通れる道を探すのを手伝ってくれる？
    quest: クエストではここに NPC がいるはずなのに見えません。探すのを手伝ってくれる？
    scene: ゲーム画面を見て、クエストの目標を説明して。
  command: 撮影を依頼するには、メッセージを /look で始めて質問を続けてください。ゲーム内で移動した後は、もう一度依頼すると新しい画面を確認します。
  limits: Windows
    のみ対応。ゲームを表示したままにしてください。1枚の画像では当たり判定、隠れた入口、クエストのフェーズを確認できません。助言でキャラクターを操作することはありません。
  capturing: Warcraft ウィンドウを撮影中…
  analyzing: ゲーム画面を分析中…
  ready: ゲーム画面を分析しました。返答を準備中。
  errors:
    unsupported-platform: ゲームのスクリーンショット支援は Windowsが必要です.
    invalid-request: 選択したゲームバージョンは無効です. スクリーンショット支援設定で再び選択します.
    game-not-found: ウォークラフトと一致する窓が見つかりませんでした ゲームを開いてもう一度やってみてください.
    ambiguous-window: 数匹のゲームウィンドウが開いている. ゲームバージョンを選択するか,追加ウィンドウを閉じて再試してください.
    minimized-window: ゲームの窓は最小限に抑えられている. 復元して 再問する
    unverified-game: このゲームウィンドウを検証できない. 公式にサポートされているウォークラフトのインストールを使用します
    capture-failed: ゲームのスクリーンショットを撮れない ゲームを目に見えるままにして 窓付きモードを試してみてください
    empty-frame: スクリーンショットは空か黒です. ゲームを目に見えるままにして また聞いてみてください
    capture-timeout: スクリーンショット操作が終了しました ちょっと待って もう一度聞いてくれ
    busy: もう1つのスクリーンショットが進行中です 終わるまで待って
    window-changed: スクリーンショット撮影中にゲームウィンドウが変わった. 新しいスクリーンショットをもう一度お願いします
    vision-not-configured: ゲーム画面の確認を依頼する前に、画像認識サービスとモデルを選択してください。
    vision-failed: 画像分析 AIモデルはスクリーンショットを読み取れない. モデルの設定を確認してもう一度試してみてください.
    no-description: 画像分析AIモデルは説明を返さなかった. また試してみるか 画像をサポートする別のモデルを選択するか.

coordinates:
  title: マップ座標
  value: X {x} · Y {y}
  unavailable: この観測では取得できません
  note: 現在のマップ内の座標（0〜100）。一部のエリアでは取得できません。
