  curseforge-invalid-request: 요청이 유효하지 않습니다. 설정한 게임 버전을 확인하고 다시 시도하세요.
  curseforge-too-many-files: 이 애드온은 파일이 너무 많아 안전하게 불러올 수 없습니다. 다른 애드온을 선택하세요.
  curseforge-too-many-redirects: 다운로드 리디렉션이 너무 많습니다. 나중에 다시 시도하세요.
  curseforge-not-found: CurseForge에서 이 애드온이나 파일을 찾을 수 없습니다. 애드온 목록을 새로 고치세요.
  curseforge-disposed: 애드온 서비스가 중지되었습니다. 애드온 센터를 다시 열고 시도하세요.
  curseforge-incompatible-version: 이 애드온 파일은 설정한 게임 버전과 호환되지 않습니다.
  curseforge-distribution-disabled: 제작자가 외부 도구를 통한 이 애드온의 설치를 허용하지 않습니다.
  curseforge-download-unavailable: CurseForge에 이 애드온 파일의 다운로드가 없습니다.
  curseforge-unsafe-download-url: 다운로드 주소 검증에 실패했습니다.
  curseforge-download-integrity: 애드온 다운로드의 무결성 확인에 실패했습니다. 다시 시도하세요.
  wow-addons-settings-invalid: 애드온 설정을 확인하고 다시 시도하세요.
  wow-addons-directory-required: 애드온 설정에서 와우 클라이언트 폴더를 지정하세요.
  wow-addons-version-required: 애드온 설정에서 호환 게임 버전을 선택하세요.
  wow-addons-busy: 다른 애드온 작업이 진행 중입니다. 완료될 때까지 기다리세요.
  wow-addons-key-storage-unavailable: 보안 키 저장소를 사용할 수 없습니다. 와우 동반자를 다시 시작하고 시도하세요.
  wow-addons-key-unreadable: 와우 동반자가 저장된 API 키를 읽을 수 없습니다. 키를 다시 저장하세요.
  wow-addons-required-dependency: 필수 의존 애드온을 설치하지 못했습니다. 다시 시도하세요.
  wow-addons-unmanaged-conflict: 관리하지 않는 애드온 폴더가 이미 있습니다. 해당 폴더를 옮긴 후 설치하세요.
  wow-addons-folder-conflict: 애드온 폴더가 다른 애드온과 충돌합니다. 해당 폴더를 옮긴 후 설치하세요.
  wow-addons-unsafe-archive: 애드온 압축 파일에 안전하지 않은 경로가 있어 설치할 수 없습니다.
  wow-addons-install-failed: 설치에 실패했습니다. 클라이언트 폴더를 확인하고 다시 시도하세요.
  wow-addons-invalid-directory: 클라이언트 폴더가 유효하지 않거나 사용할 수 없습니다. 애드온 설정에서 경로를 확인하세요.
  wow-addons-invalid-archive: 애드온 압축 파일이 유효하지 않거나 안전하지 않아 설치할 수 없습니다.
  wow-addons-directory-conflict: 기존 애드온 폴더가 이 설치와 충돌합니다. 충돌하는 폴더를 옮긴 후 다시 시도하세요.
  wow-addons-request-failed: 애드온 작업에 실패했습니다. 클라이언트 폴더를 확인하고 다시 시도하세요.
  wow-addons-dependency-limit: 중첩된 의존성이 너무 많아 애드온을 안전하게 설치할 수 없습니다.
  wow-addons-stopped: 애드온 작업이 중지되었습니다. 애드온 센터를 다시 열고 시도하세요.
