  quietInCombat: 중요한 이벤트 하나를 전투가 끝날 때까지 보관합니다. 30초가 지나면 버립니다.
  levelUp: 같은 캐릭터 세션에서 레벨이 높아졌는지 감지합니다.
  zone: 대기 시간을 지키면서 새로운 지도나 지역에 반응합니다.
  death: 선택한 캐릭터의 말투로 짧게 반응합니다. 적절한 경우 진영이나 종족에 대한 농담을 곁들입니다.
  revive: 캐릭터가 되살아나면 반응합니다.
  allowDemo: 기본적으로 꺼져 있습니다. 테스트 응답은 설정된 모델과 음성을 사용합니다.
