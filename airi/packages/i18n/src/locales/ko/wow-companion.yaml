title: 와우 동반자
description: 아제로스에서 함께하세요. 캐릭터 상태를 읽고 중요한 순간에 반응합니다.
product:
  about-title: 와우 동반자 정보
  description: 월드 오브 워크래프트 동반자, 음성 대화 및 애드온 관리.
  version: 버전
