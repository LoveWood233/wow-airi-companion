    invalid-request: 선택된 게임 버전은 유효하지 않습니다. 스크린샷 도움말 설정에서 다시 선택하십시오.
    game-not-found: 워크래프트와 일치하는 창은 발견되지 않았습니다. 게임을 열고 다시 시도해 보세요.
    ambiguous-window: 몇 개의 일치하는 게임 창이 열려 있습니다. 게임 버전을 선택하거나 추가 창을 닫고 다시 시도하십시오.
    minimized-window: 게임 창은 최소화됩니다. 복원하고 다시 물어봐
    unverified-game: 이 게임 창을 확인할 수 없습니다. 공식 지원된 워크래프트 설치를 사용하세요.
    capture-failed: 게임 스크린샷을 찍을 수 없어요 게임을 눈에 띄게 유지하고 윈도우 모드를 시도하십시오.
    empty-frame: 스크린샷은 빈거나 검은색입니다. 게임을 볼 수 있게 하고 다시 물어봐
    capture-timeout: 스크린샷 작업이 끝났습니다. 잠깐만 기다려 다시 물어봐
    busy: 또 다른 스크린샷이 진행중입니다. 끝낼 때까지 기다려
    window-changed: 스크린샷을 찍는 동안 게임 창이 바뀌었습니다. 새로운 스크린샷을 다시 요청하세요.
    vision-not-configured: 게임 화면 분석을 요청하기 전에 시각 제공자와 모델을 선택하세요.
    vision-failed: 이미지 분석 인공지능 모델은 스크린샷을 읽을 수 없습니다. 모델 설정을 확인하고 다시 시도하십시오.
    no-description: 이미지 분석 인공지능 모델은 어떤 설명도 반환하지 않았습니다. 다시 시도하거나 이미지를 지원하는 다른 모델을 선택하십시오.

