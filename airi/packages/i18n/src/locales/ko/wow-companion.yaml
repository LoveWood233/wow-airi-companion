versions:
  label: 월드 오브 워크래프트 버전
  isolation: 버전마다 설정, 보정, 이벤트, 골드 기록, 장비 및 레벨 기록이 분리됩니다. 페이지를 전환하면 저장하지 않은 변경 사항을 버립니다.
