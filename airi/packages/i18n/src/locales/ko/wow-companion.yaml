capture: 화면 보정
capture-description: 기본 격자는 셀당 물리 픽셀 하나를 사용하며 크기는 64 × 64픽셀입니다. 이 흑백 형식의 최소 크기입니다. 좌표는 바탕 화면의 물리 픽셀입니다.
capture-x: 격자 왼쪽(X)
capture-y: 격자 위쪽(Y)
cell-size: 셀 크기(픽셀)
poll-ms: 캡처 간격(밀리초)
pause-capture: 캡처 일시 중지
capture-help: /wowc compact로 64 × 64 격자를 표시하고 /wowc status로 시작 좌표를 확인하세요. 격자를 가리지 마세요. 한 픽셀 셀이 흐리면 /wowc cell 2를 실행하고 여기서 셀 크기를 2로 설정하세요.
save-preferences: 환경 설정 저장
