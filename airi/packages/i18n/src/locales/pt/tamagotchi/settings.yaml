allow-visible-on-all-workspaces:
  title: Visibilidade entre áreas de trabalho
  description: Mostrar a janela em todas as áreas de trabalho, apenas no macOS.
microphone-permission:
  prompt:
    title: Permitir acesso ao microfone?
    description: O Companheiro de WoW usa seu microfone para entrada de voz e transcrição. A escolha permanece ativa até ser redefinida nas configurações.
    allow: Permitir
    deny: Negar
  states:
    not-determined: Não definido
    granted: Permitido
    denied: Negado
  settings:
    title: Microfone
    description: Controle se o Companheiro de WoW pode usar o microfone. Redefinir a escolha interrompe a captura atual e solicita permissão no próximo uso.
    revoke: Revogar acesso
    reset: Redefinir decisão
spotlight:
  errors:
    unknown: Erro desconhecido
    prefix: 'Ocorreu um problema: {message}'
    shortcutRegistrationFailed: Não foi possível registrar o atalho de comandos rápidos.
pages:
  modules:
    mcp-server:
      description: Conectar e gerenciar servidor e ferramentas MCP
      title: Servidor MCP
  system:
    general:
      hide-app-icon:
        title: Ocultar ícone na barra de tarefas / Dock
        description: Manter o Companheiro de WoW apenas na bandeja. Use o menu dela para abrir janelas ou sair. As alterações são aplicadas imediatamente.
        load-error: Não conseguiu carregar a configuração do ícone do aplicativo.
        save-error: Não conseguiu atualizar a configuração do ícone do aplicativo.
    sections:
      section:
        window-shortcuts:
          title: Atalhos de teclado
    window-shortcuts:
      description: Modifique os atalhos da janela.
      title: Atalhos de janela
      empty: Não definido
      spotlight:
        title: Atalho de comandos rápidos
        description: Clique no atalho e pressione uma nova combinação. Pressione Esc para cancelar.
      push-to-talk:
        title: Atalho de Pressione para falar
        description: Segure este atalho em qualquer aplicativo enquanto fala com o Companheiro de WoW. Para alterá-lo, clique e pressione uma nova combinação. Esc cancela.
        inactive: O atalho funciona apenas com o modo Pressione para falar em Audição e o microfone ligado.
      actions:
        recording: Pressione as teclas
        reset: Redefinir
      errors:
        load: Falha ao carregar atalho
        conflict: Atalho já em uso.
        failed: Falha ao atualizar atalho
        requiresModifier: 'Use pelo menos uma destas teclas: Cmd, Ctrl, Alt ou Super.'
        requiresHoldModifier: Use Cmd, Ctrl, Alt, Super ou uma tecla de função como F13. Apenas Shift não basta.
        denied: O Companheiro de WoW não consegue ler teclas globais. Autorize-o nas configurações de Acessibilidade e tente novamente.
        unsupported: O sistema não detecta a liberação de um atalho global.
      toggle-move:
        label: Alternar movimento
      toggle-resize:
        label: Alternar redimensionamento
      toggle-ignore-mouse-event:
        label: Alternar passagem de cliques
      press-keys: Pressione as teclas…
    developer:
      sections:
        section:
          use-window-mouse:
            title: UseWindowMouse Tool
            description: Teste a posição do cursor da janela Electron
devtools:
  title: Desenvolvedor
  pages:
    context-flow:
      title: Fluxo de contexto
    presence-bubble:
      title: Bolha de presença
      description: Leve a bolha acima do personagem e observe-a na janela principal .
      override:
        title: Leva a bolha daqui.
        description: Enquanto isto está fora do palco não mostra bolhas a menos que um turno de conversa esteja em andamento.
      thinking:
        title: Raciocínio
        description: Mostra os pontos. Tem prioridade sobre o conteúdo não lido.
      unread:
        title: Mensagens não lidas
        description: Mostra-se como um painel na cabeça, com marca e contagem.
      main-window-note: As alterações aparecem na janela principal Companheiro de WoW.
    live2d-ambient-light:
      title: Luz Ambiental Live2D
      description: Tune screen sampling e o Live2D color-light shader
      controls:
        title: Fonte de luz e saída
      enabled:
        title: Luz ambiental
        description: Aplicar o filtro de luz ambiente no modelo ativo Live2D.
      source:
        title: Fonte de luz
        options:
          screen-capture: Captura de tela
          forced-color: Coloração forçada
      mode:
        title: Modo de iluminação
        options:
          window-gradient: Gradiente da janela
          global: Ambiente global
      forced-color:
        title: Cor de ensaio
        description: Aplique esta cor sem captura de tela.
      strength:
        title: Força de luz
        description: Defina a quantidade de efeito global. 1 é o visual concebido, e até 3 torna o revestimento de luz e a luz do fundo mais forte.
      squint:
        title: Desfocar em mudanças brilhantes
        description: Limite os olhos quando a tela brilha mais rápido do que o personagem se adaptou. Uma tela que permanece brilhante deixa os olhos abertos. O 0 desliga isto.
      main-window-note: As alterações aparecem na janela principal Companheiro de WoW.
      diagnostics:
        title: Diagnóstico de captura
        waiting: Esperando pelo diagnóstico da janela principal do Companheiro de WoW.
        status:
          disabled: Desativado
          starting: Começando
          capturing: Captura
          forced-color: Coloração forçada
          error: Erro
        capture:
          title: Estado de captura
          description: Inscreva a tela selecionada, as dimensões de captura e as coordenadas de exclusão.
          display: Dispositivos e limites
          video-size: Vídeo fonte
          sample-size: Quadro de amostra
          window-bounds: Os limites das janelas Companheiro de WoW
          excluded-region: Região excluída
          exposure: Exposição à tela
          behind-luminance: Luz por trás do personagem
          updated: Última atualização
        preview:
          title: Captura em escala reduzida
          description: O retângulo vermelho marca a janela Companheiro de WoW. O retângulo rasgado marca a área que os mapas de luz cobrem.
          unavailable: Nenhum quadro capturado está disponível.
        pixels:
          title: Decisões de pixels
          total: Total
          accepted: Aceitação
          excluded: Pintado
          transparent: Transparência
          see-through: Visão transparente
        maps:
          title: Mapa de luz
          window: Cada mapa cobre a janela Companheiro de WoW e meia janela de cada lado. O contorno marca a janela.
          unavailable: Não há ambiente disponível.
          target: Medidos
          applied: Aplicado após o esfregamento
          surround:
            title: Mapa de arredores
            description: Grande borbulho da tela ao redor e atrás da janela. Carrega a cor da luz e do lado de onde vem.
          contact:
            title: Mapa de contacto
            description: Um estreito borboleta do mesmo conteúdo. Este mapa impulsiona o revestimento de luz e a borda de retroiluminação.
      sampling:
        title: Amostragem de tela
        capture-interval:
          title: Intervalo de captura
          description: Estabelecer o tempo entre as amostras de tela. O fluxo de captura corre a esta velocidade.
        response-time:
          title: Tempo de resposta
          description: Defina a rapidez com que as cores da amostra se adaptam a uma mudança de tela.
        sample-width:
          title: Tamanho da amostra
          description: Defina a largura do quadro de captura em escala descendente. Um quadro mais amplo coloca mais detalhes nos mapas de luz. A altura segue a sua exposição.
        neutral-color-weight:
          title: Peso de cor neutro
          description: Defina o peso mínimo para cores com baixa saturação. O conteúdo colorido conta para mais do que o cinza.
      shader:
        title: Resposta do Shader
        dark-base:
          title: Pavimento de brilho
          description: Coloque o brilho do modelo sobre uma tela preta. Uma tela branca mostra o modelo como desenhado, e uma tela mais escura diminui-o em direção a este andar.
        base-curve:
          title: Curva de brilho
          description: Defina como o brilho do modelo aumenta entre o chão e a obra de arte. Por cima de 1, uma tela com meia luz mantém o modelo mais próximo do chão.
        local-share:
          title: Partilha de luz local
          description: Defina quanto do brilho do modelo segue a luz ao seu lado, em vez de toda a tela. A 0 o modelo mantém um brilho onde quer que a janela esteja.
        tint:
          title: Tintão
          description: Defina a quantidade de tons de tela que o modelo requer. Em 0 apenas o brilho da tela atinge o modelo.
        color-boost:
          title: Aumentar a cor com luz escura
          description: Defina a quantidade de cor extra que o modelo recebe da luz fraca, mas saturada. O brilho permanece onde a luz o colocou, e nenhum canal cai abaixo do modelo não iluminado.
        wrap-intensity:
          title: Intensidade de revestimento leve
          description: Defina a intensidade com que a cor do fundo sangra na borda do modelo.
        wrap-saturation:
          title: Saturação de revestimento leve
          description: Defina a quantidade de tinta da tela que a luz envolta mantém. 0 adiciona luz branca do mesmo brilho. 1 adiciona a cor da tela completa.
        backlight:
          title: Luz de fundo
          description: Defina a intensidade com que a luz por trás do personagem ilumina a borda fina ao longo de toda a borda.
        wrap-diffuse:
          title: Largura de envelope leve
          description: Defina até que ponto a cor de fundo envolta atinge o interior da borda do modelo.
        translucent-wrap:
          title: Redução do envolvimento em peças translúcidas
          description: Escalar o revestimento leve e a borda pelo quadrado do modelo alfa. As partes desenhadas com alfa parcial já mostram o desktop através de si mesmas.
      preview-shader:
        title: Previsão do Shader
        description: Execute o shader real sobre um cartão de teste, com o ambiente ao vivo e as configurações acima.
        window-mapping: O filtro toma esta tela como toda a janela do palco, então a prévia não é uma cópia pixel-acurada do palco.
        filtered: Saída de sombreamento
        unavailable: A previsão precisa de WebGL, e esta janela não pode criar um contexto.
        environment:
          live: A luz vem do último instantâneo que a janela principal da Companheiro de WoW publicou.
          neutral: Ainda não chegou nenhuma imagem instantânea, por isso a visualização usa o ambiente neutro.
        regions:
          title: Regiões dos cartões de ensaio
          body: O corpo largo carrega uma rampa de tom de sRGB {low} a {high}. Brilhantismo, contraste, croma e show de cabeça ao longo dele.
          bars: As barras são {first}, {second}, {third}, {fourth} e {fifth} pixels de largura. Eles mostram o quão longe o envolvente de luz alcança uma forma fina.
          patches: Os dois parches são desenhados em {strong} e {weak} alfa, que é o que a opção de envoltura translúcida atua.
