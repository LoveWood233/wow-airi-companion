screen-capture:
  permissions-prompt:
    title: Captura de tela
    description: Para capturar telas ou janelas, são necessárias permissões de gravação de tela e áudio do sistema.
    open-preferences: Abrir configurações do sistema
    dismiss: Dispensar
    instructions:
      step-1: Abra as configurações do sistema e selecione Privacidade e Segurança na barra lateral.
      step-2: Nas seções de gravação da tela e do áudio do sistema, ative as opções do Companheiro de WoW.
      step-2-note: Se o Companheiro de WoW não aparecer, adicione-o pelo botão + e selecione-o na pasta Aplicativos.
