      instructions: Arraste o joystick, ou use as teclas de flecha para X/Y. R adiciona um ligeiro piscar. F adiciona um olhar mais forte. C fecha os olhos. O W/S altera a forma da boca. O espaço abre a boca. A A/D move o corpo em X. O Q/E inclina a cabeça. As chaves liberadas retornam suavemente ao centro.
      parameter-note: O joystick controla X/Y. Mapas R para 1/3 de miragem. Mapas F para 2/3 de mirilho. Mapas C para olhos completamente fechados. Mapas W/S para a forma oral ±1. Mapas espaciais à boca aberta 1. Mapa A/D do corpo X ±10°. Mapas de Q/E para a direcção Z ± 30°.
