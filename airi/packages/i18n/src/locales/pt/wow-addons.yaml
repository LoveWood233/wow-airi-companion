  curseforge-too-many-redirects: O download tem redirecionamentos demais. Tente mais tarde.
  curseforge-not-found: O CurseForge não encontrou este addon ou arquivo. Atualize a lista de addons.
  curseforge-disposed: O serviço de addons parou. Reabra a central de addons e tente novamente.
  curseforge-incompatible-version: Este arquivo de addon não corresponde à versão do jogo configurada.
  curseforge-distribution-disabled: O autor não permite instalar este addon por ferramentas de terceiros.
  curseforge-download-unavailable: O CurseForge não tem download para este arquivo de addon.
  curseforge-unsafe-download-url: O endereço de download falhou na validação.
  curseforge-download-integrity: O download do addon falhou na verificação de integridade. Tente novamente.
  wow-addons-settings-invalid: Verifique as configurações dos addons e tente novamente.
  wow-addons-directory-required: Defina a pasta do cliente WoW nas configurações dos addons.
  wow-addons-version-required: Selecione uma versão compatível do jogo nas configurações dos addons.
  wow-addons-busy: Outra operação de addon está em andamento. Aguarde sua conclusão.
  wow-addons-key-storage-unavailable: O armazenamento seguro de chaves está indisponível. Reinicie o Companheiro de WoW e tente novamente.
  wow-addons-key-unreadable: O Companheiro de WoW não consegue ler a chave de API salva. Salve-a novamente.
  wow-addons-required-dependency: Não foi possível instalar uma dependência necessária do addon. Tente novamente.
  wow-addons-unmanaged-conflict: Já existe uma pasta de addon não gerenciada. Mova-a antes de instalar este addon.
  wow-addons-folder-conflict: Uma pasta de addon conflita com outro addon. Mova-a antes da instalação.
  wow-addons-unsafe-archive: O arquivo compactado do addon contém caminhos inseguros e não pode ser instalado.
  wow-addons-install-failed: A instalação falhou. Verifique a pasta do cliente e tente novamente.
  wow-addons-invalid-directory: A pasta do cliente é inválida ou está indisponível. Verifique o caminho nas configurações dos addons.
  wow-addons-invalid-archive: O arquivo compactado do addon é inválido ou inseguro e não pode ser instalado.
  wow-addons-directory-conflict: Uma pasta de addon existente conflita com esta instalação. Mova-a antes de tentar novamente.
  wow-addons-request-failed: A operação do addon falhou. Verifique a pasta do cliente e tente novamente.
  wow-addons-dependency-limit: O addon exige dependências aninhadas demais para uma instalação segura.
  wow-addons-stopped: A operação do addon parou. Reabra a central de addons e tente novamente.
