equipment-swaps:
  title: Resultados das trocas de equipamento
  description: O addon propõe melhorias claras, espaços vazios e nível de item maior com ganhos primários e perdas secundárias. Cada troca exige confirmação.
  confirmation: Confirme dentro do jogo. Escolher Sim no Companheiro de WoW mostra a próxima etapa, sem trocar equipamentos ou enviar comandos ao jogo.
  empty: Nenhum resultado de confirmação nesta sessão do personagem.
  bridge-update: Esta ponte não fornece resultados de trocas. Atualize o addon e a ponte e reinicie o Companheiro de WoW.
  read-error: Alguns resultados de equipamento estão indisponíveis.
