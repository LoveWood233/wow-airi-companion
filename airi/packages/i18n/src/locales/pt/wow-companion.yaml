equipment-prompt:
  message: Parabéns pelo novo equipamento, {name}! É outra chance de ficar mais forte. {reason} Quer trocar o equipamento?
  message-player: '{player}, parabéns pelo novo equipamento, {name}! É outra chance de ficar mais forte. {reason} Quer trocar o equipamento?'
  message-player-tradeoff: '{player}, parabéns pelo novo equipamento, {name}! Ele pode melhorar seu atributo primário. {reason} Quer trocar o equipamento?'
  reason:
    stats: Os atributos registrados melhoram claramente na comparação (nível de item {oldLevel} → {newLevel}).
    empty: O espaço de destino está vazio.
    tradeoff: Nível de item {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, mas {decreases}. Há ganhos e perdas nos atributos. O benefício geral não é garantido.
    separator: ', '
  accepted: Clique em “Confirmar troca” no jogo. O Companheiro de WoW não envia comandos ao jogo.
  accept: Sim
  decline: Não, obrigado
  timeout: Escolha em até 10 segundos. Sem escolha, o lembrete fecha. As trocas ainda exigem confirmação no jogo.
  description: Melhorias claras e nível de item maior com ganho primário podem propor uma troca. Perdas secundárias permanecem explícitas. Cada troca exige confirmação.
idle-interaction:
  title: Interação fora do combate
