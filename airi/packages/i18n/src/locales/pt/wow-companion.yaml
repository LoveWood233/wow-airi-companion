  image-use: 'A captura é enviada ao provedor de visão. Serviços de chat compatíveis com imagens também a recebem nesta interação. O chat de texto usa a descrição. A imagem não é salva no histórico local.'
  target: Janela do jogo
  target-description: A seleção automática exige uma única janela de Warcraft. Se
    várias versões estiverem abertas, escolha uma. Feche as janelas extras dessa
    versão.
  games:
    auto: Automático
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Configurar modelo de visão
  vision-description: Escolha um provedor e modelo compatíveis com imagens nas
    configurações de Visão. Abrir essas configurações não tira capturas.
  examples-title: Pergunte por texto ou voz
  examples:
    terrain: Você pode olhar o terreno à frente e me ajudar a encontrar uma passagem?
    quest: A missão indica que o PNJ está aqui, mas não consigo vê-lo. Você pode me
      ajudar a encontrá-lo?
    scene: 'Olhe isto e diga o que você vê.'
    equipment: 'Olhe meu equipamento. O que acha?'
  command: Para pedir uma captura, comece a mensagem com /look e adicione sua
    pergunta. Após se mover no jogo, pergunte novamente para obter outra imagem.
  limits: Somente Windows. Mantenha o jogo visível. Uma imagem não confirma
