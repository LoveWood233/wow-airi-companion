  duration: Tempo neste nível
  source-title: Observação
  unknown-duration: Desconhecido
  partial: Tempo desde a primeira observação do nível anterior. Não representa todo o tempo naquele nível.
  offline-note: O intervalo inclui tempo offline, em outros personagens e com o Companheiro de WoW fechado. Os registros persistem após reinícios.
  observation-note: O Companheiro de WoW não recupera horários perdidos. A primeira observação ou mudança após uma pausa não comprova o horário do aumento.
  average-note: A média usa apenas intervalos completos de um nível. Exclui intervalos parciais, mudanças perdidas, reduções de nível e alterações no relógio.
