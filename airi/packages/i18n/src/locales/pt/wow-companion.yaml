title: Companheiro de WoW
description: Juntos em Azeroth. Leia o estado do personagem e reaja aos momentos importantes.
product:
  about-title: Sobre o Companheiro de WoW
  description: Companhia em World of Warcraft, conversa por voz e gerenciamento de addons.
  version: Versão
  project: Projeto
  third-party: Licenças de terceiros
  license-note: Este software usa componentes de código aberto. Os avisos de direitos autorais e licenças permanecem nos arquivos de código e distribuição.
  local-provider-note: Configure serviços de conversa e voz nas configurações. Não é necessária uma conta do aplicativo.
connection: Conexão com o jogo
last-seen: Última observação
demo-warning: Estes dados são simulados. Não descrevem um personagem real.
model-required: Selecione um provedor e modelo de conversa no Companheiro de WoW para ativar respostas. A fala usa suas configurações de voz existentes.
start-bridge: O Companheiro de WoW inicia a ponte local ao ativar esta conexão. Mantenha a grade do addon visível. No Windows, é necessário Python 3.10 ou posterior.
