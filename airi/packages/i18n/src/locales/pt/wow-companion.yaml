  flow-note: Saldos iniciais não contam como entradas. Correio, trocas, depósitos, saques e transferências entre personagens contam como movimentações.
  balance-note: Os saldos cobrem apenas personagens observados, cada um na última observação. Nem todos são atuais. O banco do Bando fica excluído.
  demo-note: Dados de demonstração ficam fora deste registro. Mudanças no dinheiro atualizam o contexto sem respostas de voz espontâneas.
