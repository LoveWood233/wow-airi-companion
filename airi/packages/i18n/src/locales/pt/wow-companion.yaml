equipment-prompt:
  message: 'Parabéns pelo novo equipamento, {name}! Você ficou mais forte. {reason} Confirme a troca no jogo.'
  message-player: '{player}, parabéns pelo novo equipamento, {name}! Você ficou mais forte. {reason} Confirme a troca no jogo.'
  message-player-tradeoff: '{player}, parabéns pelo novo equipamento, {name}! Ele pode melhorar seu atributo principal. {reason} Analise as vantagens e perdas e confirme a troca no jogo.'
  reason:
    stats: Os atributos registrados melhoram claramente na comparação (nível de item {oldLevel} → {newLevel}).
    empty: O espaço de destino está vazio.
    tradeoff: Nível de item {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, mas {decreases}. Há ganhos e perdas nos atributos. O benefício geral não é garantido.
    separator: ', '
  accepted: Clique em “Confirmar troca” no jogo. O Companheiro de WoW não envia comandos ao jogo.
  accept: Sim
  decline: Não, obrigado
  timeout: Escolha em até 10 segundos. Sem escolha, o lembrete fecha. As trocas ainda exigem confirmação no jogo.
  description: 'O addon compara os equipamentos. Confira os atributos e confirme cada troca no jogo.'
