    seu personagem.
  capturing: Capturando a janela de Warcraft…
  analyzing: Analisando a tela do jogo…
  ready: Tela analisada. Preparando a resposta.
  errors:
    unsupported-platform: A assistência de captura de tela do jogo requer Windows.
    invalid-request: A versão do jogo selecionada é inválida. Selecione novamente
