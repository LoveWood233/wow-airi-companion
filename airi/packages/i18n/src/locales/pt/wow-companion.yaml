preferences: Preferências do companheiro
preferences-description: A conexão continua ao fechar esta página. Apenas a janela principal do personagem gera respostas.
options:
  enabled: Ativar companheiro
  muted: Silenciar reações ao jogo
  quietInCombat: Ficar em silêncio durante o combate
  levelUp: Comemorar aumentos de nível
  zone: Comentar novas localizações
  death: Reagir à morte
  revive: Celebrar a ressurreição
  allowDemo: Permitir respostas aos eventos de demonstração
hints:
  enabled: Mantenha o estado atual do jogo disponível para o personagem.
  muted: Continue atualizando o contexto sem respostas espontâneas ao jogo.
  quietInCombat: Guarde um evento importante até o fim do combate. Descarte eventos após 30 segundos.
  levelUp: Detecte um nível superior na mesma sessão do personagem.
  zone: Reaja a um novo mapa ou zona, respeitando o intervalo entre reações.
  death: Reaja brevemente no tom do personagem selecionado, com brincadeiras sobre facção ou raça quando apropriado.
  revive: Reaja quando o personagem voltar à vida.
  allowDemo: Desativado por padrão. As respostas de teste usam o modelo e a voz configurados.
cooldown: Segundos mínimos entre reações
cooldown-description: De 0 a 300 segundos. Apenas um evento recente aguarda durante o intervalo.
capture: Calibração da tela
capture-description: A grade padrão usa um pixel físico por célula e ocupa 64 × 64 pixels, o mínimo para este formato em preto e branco. As coordenadas usam pixels físicos da área de trabalho.
capture-x: Esquerda da grade (X)
capture-y: Topo da grade (Y)
cell-size: Tamanho da célula em pixels
poll-ms: Intervalo de captura em milissegundos
pause-capture: Pausar captura
capture-help: Use /wowc compact para uma grade de 64 × 64 e /wowc status para ler a origem. Mantenha a grade livre. Se células de um pixel ficarem borradas, use /wowc cell 2 e defina Tamanho da célula como 2 aqui.
save-preferences: Salvar preferências
save-capture: Aplicar calibração
saved: Salvo.
failed: A operação falhou.
demo: Teste de conexão
demo-description: Teste sem entrar no jogo. Eventos de demonstração ficam fora do contexto até você permiti-los explicitamente acima.
demo-label: Demonstração
start-demo: Iniciar demonstração
stop-demo: Voltar à captura ao vivo
