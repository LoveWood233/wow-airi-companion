versions:
  label: Versão de World of Warcraft
  isolation: Cada versão tem configurações, calibração, eventos, registros de ouro e históricos separados. Trocar de página descarta alterações não salvas.
  retail:
    name: World of Warcraft Retail
    description: Configurações do companheiro e registros de ouro do Retail.
    capture-help: Use /wowc compact para uma grade de 64 × 64 e /wowc status para ler a origem. Bordas da janela e outros monitores alteram as coordenadas. Mantenha a grade livre. Se as células ficarem borradas, use /wowc cell 2 e defina Tamanho da célula como 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Configurações do companheiro e registros de ouro independentes para Forever.
    preview: Esta versão é preparada antes do lançamento do cliente. A compatibilidade ao vivo exige verificação após o lançamento. A conexão vem desativada por padrão.
    capture-help: Após instalar o addon Forever, use /wowf compact para uma grade de 64 × 64 e /wowf status para ler a origem. Mantenha a grade livre. Se as células ficarem borradas, use /wowf cell 2 e defina Tamanho da célula como 2.
level-history:
  title: Histórico de níveis do personagem
  description: O Companheiro de WoW salva as observações de nível neste computador. O tempo usa o relógio real e inclui períodos offline.
  empty: Nenhum histórico de níveis. Conecte um personagem real para iniciar um registro do nível atual.
  storage-error: Falha ao carregar ou salvar o histórico de níveis. O armazenamento não foi confirmado. Verifique o erro e o espaço disponível.
