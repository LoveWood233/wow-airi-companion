    ambiguous-window: Várias janelas de jogo correspondentes estão abertas.
      Selecione uma versão do jogo ou feche as janelas extras e tente novamente.
    minimized-window: A janela de jogo é minimizada. Restaura-o e pergunta outra vez.
    unverified-game: Não posso verificar esta janela de jogo. Use uma instalação
