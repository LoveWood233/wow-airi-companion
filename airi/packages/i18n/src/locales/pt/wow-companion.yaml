    capture-failed: Não posso tirar uma captura de tela do jogo. Mantenha o jogo
      visível e tente o modo com janelas.
    empty-frame: A captura de tela está vazia ou preta. Mantenha o jogo visível e
      pergunte novamente.
    capture-timeout: A operação de captura de tela terminou. Espera um momento e
      pergunta outra vez.
    busy: Outra captura de tela está em andamento. Espera até acabar.
    window-changed: A janela do jogo mudou ao tirar a captura de tela. Peça outra
      vez uma nova captura de tela.
    vision-not-configured: Selecione um provedor e modelo de visão antes de
      solicitar assistência por captura do jogo.
    vision-failed: O modelo de IA de análise de imagem não consegue ler a captura de
      tela. Verifique as configurações do modelo e tente novamente.
    no-description: O modelo de IA de análise de imagem não retornou nenhuma
      descrição. Tente novamente ou escolha outro modelo que suporta imagens.

