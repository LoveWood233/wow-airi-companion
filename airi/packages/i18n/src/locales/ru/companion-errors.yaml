bridge-local-address: Мост WoW должен использовать локальный адрес HTTP.
bridge-stopped: Мост WoW остановлен.
bridge-cancelled: Запуск моста WoW отменён.
bridge-retry: Спутник WoW повторит попытку через 30 секунд. {detail}
bridge-windows: Автоматический захват WoW требует Windows. Локальный мост не может работать в этой системе.
bridge-exited: Мост WoW завершил работу.
bridge-start-failed: Не удалось запустить мост WoW. Проверьте файлы и настройки захвата. {detail}
bridge-start-exited: Мост WoW завершил работу при запуске. Проверьте, занят ли его порт.
bridge-timeout: Мост WoW не запустился за 10 секунд. Проверьте Python и настройки захвата.
bridge-port-unavailable: Локальный порт моста WoW не ответил. Перед повторной попыткой проверьте порт {port}.
bridge-port-incompatible: Порт {port} занят несовместимой службой. Закройте её или обновите мост WoW.
bridge-profile-incompatible: Порт {port} занят несовместимой службой. Используйте мост WoW 2.11 или новее для профиля {game}.
bridge-files-missing: Отсутствуют файлы моста WoW. Восстановите WOWAddons рядом с исходниками Спутника WoW или переустановите настольную программу.
bridge-python-missing: Не найден Python 3.10 или новее. Установите Python с добавлением в PATH, затем перезапустите Спутник WoW.
bridge-unavailable: Мост WoW недоступен.
bridge-http: Мост WoW вернул HTTP {status}.
bridge-response-profile: Ответ моста WoW не соответствует профилю {game}.
connection-disabled: Включите соединение спутника для этой игры перед командами захвата или демонстрации.
connection-changed: Соединение спутника изменилось до завершения команды.
gold-account-unknown: Локальная учётная запись золота не найдена.
gold-read: Не удалось загрузить журнал золота ({path}). Восстановите файл и перезапустите Спутник WoW. {detail}
gold-write: Не удалось сохранить журнал золота ({path}). Изменения остались только в памяти. Спутник WoW повторит попытку. {detail}
levels-read: Не удалось загрузить историю уровней ({path}). Восстановите файл и перезапустите Спутник WoW. {detail}
levels-write: Не удалось сохранить историю уровней ({path}). Изменения остались только в памяти. Спутник WoW повторит попытку. {detail}
equipment-read: Не удалось загрузить историю снаряжения ({path}). Восстановите файл и перезапустите Спутник WoW. {detail}
equipment-write: Не удалось сохранить историю снаряжения ({path}). Изменения остались только в памяти. Спутник WoW повторит попытку. {detail}
comparisons-read: Не удалось загрузить сравнения снаряжения ({path}). Восстановите файл и перезапустите Спутник WoW. {detail}
comparisons-write: Не удалось сохранить сравнения снаряжения ({path}). Изменения остались только в памяти. Спутник WoW повторит попытку. {detail}
loadouts-read: Не удалось загрузить снимки снаряжения ({path}). Восстановите файл и перезапустите Спутник WoW. {detail}
loadouts-write: Не удалось сохранить снимки снаряжения ({path}). Изменения остались только в памяти. Спутник WoW повторит попытку. {detail}
