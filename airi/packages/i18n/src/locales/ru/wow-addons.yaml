  curseforge-timeout: CurseForge не ответил вовремя. Повторите попытку.
  curseforge-invalid-response: CurseForge вернул недопустимый ответ. Повторите попытку.
  curseforge-response-too-large: Ответ CurseForge превышает допустимый размер.
  curseforge-request-failed: Запрос CurseForge не выполнен. Проверьте соединение и повторите попытку.
  curseforge-invalid-request: Недопустимый запрос. Проверьте выбранную версию игры и повторите попытку.
  curseforge-too-many-files: У аддона слишком много файлов для безопасной загрузки. Выберите другой аддон.
  curseforge-too-many-redirects: Слишком много перенаправлений при загрузке. Повторите попытку позже.
  curseforge-not-found: CurseForge не нашёл аддон или файл. Обновите список аддонов.
  curseforge-disposed: Служба аддонов остановлена. Снова откройте центр аддонов и повторите попытку.
  curseforge-incompatible-version: Файл аддона несовместим с выбранной версией игры.
  curseforge-distribution-disabled: Автор запретил установку аддона через сторонние программы.
  curseforge-download-unavailable: В CurseForge нет загрузки для этого файла аддона.
  curseforge-unsafe-download-url: Адрес загрузки не прошёл проверку.
  curseforge-download-integrity: Файл аддона не прошёл проверку целостности. Повторите попытку.
  wow-addons-settings-invalid: Проверьте настройки аддонов и повторите попытку.
  wow-addons-directory-required: Укажите папку клиента WoW в настройках аддонов.
  wow-addons-version-required: Выберите совместимую версию игры в настройках аддонов.
  wow-addons-busy: Выполняется другая операция с аддоном. Дождитесь её завершения.
  wow-addons-key-storage-unavailable: Защищённое хранилище ключей недоступно. Перезапустите Спутник WoW и повторите попытку.
  wow-addons-key-unreadable: Спутник WoW не может прочитать сохранённый ключ API. Сохраните ключ снова.
  wow-addons-required-dependency: Не удалось установить обязательную зависимость аддона. Повторите попытку.
  wow-addons-unmanaged-conflict: Папка стороннего аддона уже существует. Переместите её перед установкой.
  wow-addons-folder-conflict: Папка аддона конфликтует с другим аддоном. Переместите её перед установкой.
  wow-addons-unsafe-archive: Архив аддона содержит небезопасные пути. Установка невозможна.
  wow-addons-install-failed: Установка не выполнена. Проверьте папку клиента и повторите попытку.
  wow-addons-invalid-directory: Папка клиента недопустима или недоступна. Проверьте путь в настройках аддонов.
  wow-addons-invalid-archive: Архив аддона повреждён или небезопасен. Установка невозможна.
  wow-addons-directory-conflict: Существующая папка аддона мешает установке. Переместите её и повторите попытку.
  wow-addons-request-failed: Операция с аддоном не выполнена. Проверьте папку клиента и повторите попытку.
  wow-addons-dependency-limit: У аддона слишком много вложенных зависимостей для безопасной установки.
  wow-addons-stopped: Операция с аддоном остановлена. Снова откройте центр аддонов и повторите попытку.
