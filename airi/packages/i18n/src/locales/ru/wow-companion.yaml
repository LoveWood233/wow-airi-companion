  isolation: У каждой версии отдельные настройки, калибровка, события, учёт золота и история снаряжения и уровней. Переход между страницами отменяет несохранённые изменения.
  retail:
    name: Актуальная World of Warcraft
    description: Настройки спутника и учёт золота актуальной версии.
    capture-help: Введите /wowc compact для сетки 64 × 64, затем /wowc status для её координат. Рамки окна и другие мониторы меняют координаты рабочего стола. Не перекрывайте сетку. Если ячейки размыты, введите /wowc cell 2 и задайте размер ячейки 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Отдельные настройки спутника и учёт золота Forever.
    preview: Эта версия подготовлена до выхода клиента. Совместимость необходимо проверить после его выхода. Соединение по умолчанию выключено.
    capture-help: После установки аддона Forever введите /wowf compact для сетки 64 × 64 и /wowf status для координат. Не перекрывайте сетку. Если ячейки размыты, введите /wowf cell 2 и задайте размер ячейки 2.
