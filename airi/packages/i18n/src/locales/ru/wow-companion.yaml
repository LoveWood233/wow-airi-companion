hints:
  enabled: Предоставлять персонажу текущее состояние игры.
  muted: Обновлять контекст без самостоятельных ответов на игровые события.
  quietInCombat: Сохранить одно важное событие до конца боя. События удаляются через 30 секунд.
  levelUp: Обнаруживать повышение уровня в одном сеансе персонажа.
  zone: Реагировать на новую карту или зону с учётом задержки между реакциями.
  death: Кратко реагировать в манере выбранного персонажа, при необходимости шутить о фракции или расе.
