equipment-prompt:
  message: 'Поздравляю с новым снаряжением — {name}! Это ещё один шанс стать сильнее. {reason} Хочешь сменить снаряжение?'
  message-player: '{player}, поздравляю с новым снаряжением — {name}! Это ещё один шанс стать сильнее. {reason} Хочешь сменить снаряжение?'
  message-player-tradeoff: '{player}, поздравляю с новым снаряжением — {name}! Оно может повысить основную характеристику. {reason} Хочешь сменить снаряжение?'
  reason:
    stats: 'Сравнение показало явное улучшение записанных характеристик (уровень предмета {oldLevel} → {newLevel}).'
    empty: Целевая ячейка пуста.
    tradeoff: 'Уровень предмета {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, но {decreases}. У характеристик есть компромиссы. Общая польза не гарантирована.'
    separator: ', '
  accepted: Нажмите «Подтвердить смену» в игре. Спутник WoW не отправляет команды игре.
  accept: Да
  decline: Нет, спасибо
  timeout: Выберите ответ за 10 секунд. Без ответа напоминание закроется. Смена снаряжения всё равно требует подтверждения в игре.
  description: Явные улучшения и рост уровня предмета с основной характеристикой могут вызвать запрос смены. Потери вторичных характеристик указаны явно. Каждая смена требует вашего подтверждения.
idle-interaction:
