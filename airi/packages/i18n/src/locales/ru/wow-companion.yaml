  message: 'Поздравляю с новой экипировкой: {name}! Вы стали сильнее. {reason}Подтвердите замену в игре.'
  message-player: '{player}, поздравляю с новой экипировкой: {name}! Вы стали сильнее. {reason}Подтвердите замену в игре.'
  message-player-tradeoff: '{player}, поздравляю с новой экипировкой: {name}! Она может повысить основную характеристику. {reason}Оцените изменения характеристик и подтвердите замену в игре.'
  reason:
    stats: 'Сравнение показало явное улучшение записанных характеристик (уровень предмета {oldLevel} → {newLevel}).'
    empty: Целевая ячейка пуста.
    tradeoff: 'Уровень предмета {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, но {decreases}. У характеристик есть компромиссы. Общая польза не гарантирована.'
