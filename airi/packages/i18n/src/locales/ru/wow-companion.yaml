  identity-note: Учётные записи определяются локальным идентификатором аддона. Спутник WoW не читает данные входа. Задайте названия идентификаторам.
  flow-note: Начальные балансы не считаются доходом. Почта, обмен, банковские операции и переводы между вашими персонажами учитываются как денежные потоки.
