equipment-swaps:
  title: Результаты смены снаряжения
  description: Аддон спрашивает о явных улучшениях, пустых ячейках и повышении уровня предмета с ростом основной и снижением вторичных характеристик. Каждая смена требует подтверждения.
  confirmation: Подтвердите в игре. Ответ «Да» в Спутнике WoW показывает следующий шаг. Он не меняет снаряжение и не отправляет команды игре.
