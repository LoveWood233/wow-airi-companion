bridge-local-address: บริการเชื่อมต่อ WoW ต้องใช้ที่อยู่ HTTP ในเครื่อง
bridge-stopped: บริการเชื่อมต่อ WoW หยุดแล้ว
bridge-cancelled: ยกเลิกการเริ่มบริการเชื่อมต่อ WoW แล้ว
bridge-retry: เพื่อนคู่ใจ WoW จะลองอีกครั้งใน 30 วินาที {detail}
bridge-windows: การจับภาพ WoW อัตโนมัติต้องใช้ Windows บริการเชื่อมต่อในเครื่องไม่สามารถเริ่มบนระบบนี้ได้
bridge-exited: บริการเชื่อมต่อ WoW ปิดตัวแล้ว
bridge-start-failed: ไม่สามารถเริ่มบริการเชื่อมต่อ WoW โปรดตรวจสอบไฟล์และการตั้งค่าจับภาพ {detail}
bridge-start-exited: บริการเชื่อมต่อ WoW ปิดระหว่างเริ่มต้น โปรดตรวจสอบว่ามีโปรแกรมอื่นใช้พอร์ตอยู่หรือไม่
bridge-timeout: บริการเชื่อมต่อ WoW ไม่พร้อมภายใน 10 วินาที โปรดตรวจสอบ Python และการตั้งค่าจับภาพในเครื่อง
bridge-port-unavailable: พอร์ตบริการเชื่อมต่อ WoW ไม่ตอบสนอง โปรดตรวจสอบพอร์ต {port} ก่อนลองใหม่
bridge-port-incompatible: บริการที่เข้ากันไม่ได้กำลังใช้พอร์ต {port} โปรดปิดบริการนั้นหรืออัปเดตบริการเชื่อมต่อ WoW
bridge-profile-incompatible: บริการที่เข้ากันไม่ได้กำลังใช้พอร์ต {port} โปรดใช้บริการเชื่อมต่อ WoW รุ่น 2.11 ขึ้นไปสำหรับโปรไฟล์ {game}
bridge-files-missing: ไม่พบไฟล์บริการเชื่อมต่อ WoW โปรดคืนค่า WOWAddons ไว้ข้างซอร์สโค้ดเพื่อนคู่ใจ WoW หรือติดตั้งแอปเดสก์ท็อปใหม่
bridge-python-missing: ไม่พบ Python 3.10 ขึ้นไป โปรดติดตั้ง Python พร้อมเพิ่มใน PATH แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่
bridge-unavailable: บริการเชื่อมต่อ WoW ไม่พร้อมใช้งาน
bridge-http: บริการเชื่อมต่อ WoW ส่งกลับ HTTP {status}
bridge-response-profile: ข้อมูลตอบกลับของบริการเชื่อมต่อ WoW ไม่ตรงกับโปรไฟล์ {game}
connection-disabled: โปรดเปิดการเชื่อมต่อเพื่อนคู่ใจสำหรับเกมนี้ก่อนส่งคำสั่งจับภาพหรือสาธิต
connection-changed: การเชื่อมต่อเพื่อนคู่ใจเปลี่ยนแปลงก่อนคำสั่งเสร็จ
gold-account-unknown: ไม่พบบัญชีทองในเครื่อง
gold-read: ไม่สามารถโหลดบัญชีทอง ({path}) โปรดคืนค่าไฟล์แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่ {detail}
gold-write: ไม่สามารถบันทึกบัญชีทอง ({path}) การเปลี่ยนแปลงอยู่ในหน่วยความจำเท่านั้น เพื่อนคู่ใจ WoW จะลองอีกครั้ง {detail}
levels-read: ไม่สามารถโหลดประวัติเลเวล ({path}) โปรดคืนค่าไฟล์แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่ {detail}
levels-write: ไม่สามารถบันทึกประวัติเลเวล ({path}) การเปลี่ยนแปลงอยู่ในหน่วยความจำเท่านั้น เพื่อนคู่ใจ WoW จะลองอีกครั้ง {detail}
equipment-read: ไม่สามารถโหลดประวัติอุปกรณ์ ({path}) โปรดคืนค่าไฟล์แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่ {detail}
equipment-write: ไม่สามารถบันทึกประวัติอุปกรณ์ ({path}) การเปลี่ยนแปลงอยู่ในหน่วยความจำเท่านั้น เพื่อนคู่ใจ WoW จะลองอีกครั้ง {detail}
comparisons-read: ไม่สามารถโหลดบันทึกเปรียบเทียบอุปกรณ์ ({path}) โปรดคืนค่าไฟล์แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่ {detail}
comparisons-write: ไม่สามารถบันทึกบันทึกเปรียบเทียบอุปกรณ์ ({path}) การเปลี่ยนแปลงอยู่ในหน่วยความจำเท่านั้น เพื่อนคู่ใจ WoW จะลองอีกครั้ง {detail}
loadouts-read: ไม่สามารถโหลดภาพข้อมูลอุปกรณ์ที่สวมใส่ ({path}) โปรดคืนค่าไฟล์แล้วเริ่มเพื่อนคู่ใจ WoW ใหม่ {detail}
loadouts-write: ไม่สามารถบันทึกภาพข้อมูลอุปกรณ์ที่สวมใส่ ({path}) การเปลี่ยนแปลงอยู่ในหน่วยความจำเท่านั้น เพื่อนคู่ใจ WoW จะลองอีกครั้ง {detail}
