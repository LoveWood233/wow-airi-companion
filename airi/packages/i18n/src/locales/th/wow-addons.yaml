  curseforge-too-many-redirects: การดาวน์โหลดเปลี่ยนเส้นทางมากเกินไป โปรดลองใหม่ภายหลัง
  curseforge-not-found: CurseForge ไม่พบแอดออนหรือไฟล์นี้ โปรดรีเฟรชรายการแอดออน
  curseforge-disposed: บริการแอดออนหยุดแล้ว โปรดเปิดศูนย์แอดออนใหม่แล้วลองอีกครั้ง
  curseforge-incompatible-version: ไฟล์แอดออนไม่ตรงกับรุ่นเกมที่ตั้งค่าไว้
  curseforge-distribution-disabled: ผู้สร้างไม่อนุญาตให้ติดตั้งแอดออนนี้ผ่านเครื่องมือของบุคคลที่สาม
  curseforge-download-unavailable: CurseForge ไม่มีไฟล์ดาวน์โหลดของแอดออนนี้
  curseforge-unsafe-download-url: ที่อยู่ดาวน์โหลดไม่ผ่านการตรวจสอบ
  curseforge-download-integrity: ไฟล์แอดออนไม่ผ่านการตรวจสอบความสมบูรณ์ โปรดลองใหม่
  wow-addons-settings-invalid: โปรดตรวจสอบการตั้งค่าแอดออนแล้วลองใหม่
  wow-addons-directory-required: ตั้งค่าโฟลเดอร์ไคลเอนต์ WoW ในการตั้งค่าแอดออน
  wow-addons-version-required: เลือกรุ่นเกมที่เข้ากันได้ในการตั้งค่าแอดออน
  wow-addons-busy: มีการดำเนินการแอดออนอื่นอยู่ โปรดรอให้เสร็จ
  wow-addons-key-storage-unavailable: ที่เก็บคีย์ปลอดภัยไม่พร้อมใช้งาน โปรดเริ่มเพื่อนคู่ใจ WoW ใหม่แล้วลองอีกครั้ง
  wow-addons-key-unreadable: เพื่อนคู่ใจ WoW อ่านคีย์ API ที่บันทึกไว้ไม่ได้ โปรดบันทึกคีย์ใหม่
  wow-addons-required-dependency: ติดตั้งแอดออนที่จำเป็นไม่สำเร็จ โปรดลองใหม่
  wow-addons-unmanaged-conflict: มีโฟลเดอร์แอดออนที่ไม่ได้จัดการอยู่แล้ว โปรดย้ายออกก่อนติดตั้งแอดออนนี้
  wow-addons-folder-conflict: โฟลเดอร์แอดออนขัดแย้งกับแอดออนอื่น โปรดย้ายออกก่อนติดตั้ง
  wow-addons-unsafe-archive: แพ็กแอดออนมีเส้นทางที่ไม่ปลอดภัย จึงติดตั้งไม่ได้
  wow-addons-install-failed: ติดตั้งไม่สำเร็จ โปรดตรวจสอบโฟลเดอร์ไคลเอนต์แล้วลองใหม่
  wow-addons-invalid-directory: โฟลเดอร์ไคลเอนต์ไม่ถูกต้องหรือเข้าถึงไม่ได้ โปรดตรวจสอบเส้นทางในการตั้งค่าแอดออน
  wow-addons-invalid-archive: แพ็กแอดออนไม่ถูกต้องหรือไม่ปลอดภัย จึงติดตั้งไม่ได้
  wow-addons-directory-conflict: โฟลเดอร์แอดออนเดิมขัดแย้งกับการติดตั้งนี้ โปรดย้ายโฟลเดอร์ที่ขัดแย้งออกแล้วลองใหม่
  wow-addons-request-failed: ดำเนินการแอดออนไม่สำเร็จ โปรดตรวจสอบโฟลเดอร์ไคลเอนต์แล้วลองใหม่
  wow-addons-dependency-limit: แอดออนมีการพึ่งพาซ้อนกันมากเกินกว่าจะติดตั้งได้อย่างปลอดภัย
  wow-addons-stopped: หยุดดำเนินการแอดออนแล้ว โปรดเปิดศูนย์แอดออนใหม่แล้วลองอีกครั้ง
