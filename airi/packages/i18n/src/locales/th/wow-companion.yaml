  image-use: 'ภาพจะส่งไปยังบริการวิเคราะห์ภาพ ในรอบนี้บริการแชตที่รองรับภาพจะได้รับภาพด้วย แชตแบบข้อความจะใช้คำบรรยายภาพ ภาพต้นฉบับจะไม่บันทึกในประวัติแชตภายในเครื่อง'
  target: หน้าต่างเกม
