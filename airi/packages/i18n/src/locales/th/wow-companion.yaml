screen-assist:
  title: ผู้ช่วยวิเคราะห์ภาพเกม
  description: ขอเพื่อนของคุณตรวจสอบ Warcraft รูปจอสําหรับพื้นที่
    การเล่นเกมหรือการแนะนํา NPC
  enabled: จับภาพเมื่อฉันขอให้ดูเกม
  enabled-description: คำขอโดยตรงจะจับภาพเกมหนึ่งภาพ การสนทนาทั่วไปจะไม่เริ่มจับภาพ
  image-use: ภาพหน้าจอจะถูกส่งไปยังผู้ให้บริการวิเคราะห์ภาพที่คุณเลือก
    ภาพต้นฉบับจะไม่ถูกบันทึกในประวัติแชตภายในเครื่อง
  target: หน้าต่างเกม
  target-description: การเลือกอัตโนมัติต้องมีหน้าต่าง Warcraft เพียงหนึ่งหน้าต่าง
    หากเปิดหลายเวอร์ชัน
    ให้เลือกหนึ่งเวอร์ชันและปิดหน้าต่างส่วนเกินของเวอร์ชันนั้น
  games:
    auto: อัตโนมัติ
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: ตั้งค่าโมเดลวิเคราะห์ภาพ
  vision-description: เลือกผู้ให้บริการและโมเดลที่รองรับภาพในการตั้งค่าการมองเห็น
    การเปิดหน้าการตั้งค่านี้จะไม่จับภาพหน้าจอ
  examples-title: ถามผ่านแชตหรือเสียง
  examples:
    terrain: ช่วยดูภูมิประเทศข้างหน้าและหาทางผ่านให้หน่อยได้ไหม
    quest: ภารกิจบอกว่า NPC อยู่ตรงนี้ แต่ฉันมองไม่เห็น ช่วยหาให้หน่อยได้ไหม
    scene: ดูหน้าจอเกมแล้วอธิบายเป้าหมายของภารกิจให้หน่อย
  command: หากต้องการจับภาพ ให้เริ่มข้อความด้วย /look แล้วตามด้วยคำถาม
    หลังจากเคลื่อนที่ในเกม ให้ถามอีกครั้งเพื่อดูภาพใหม่
  limits: รองรับเฉพาะ Windows ต้องแสดงหน้าต่างเกมไว้ ภาพเดียวไม่สามารถยืนยันการชน
    ทางเข้าที่ซ่อนอยู่ หรือเฟสภารกิจได้ คำแนะนำจะไม่ควบคุมตัวละครของคุณ
  capturing: กำลังจับภาพหน้าต่าง Warcraft…
  analyzing: กำลังวิเคราะห์หน้าจอเกม…
  ready: วิเคราะห์หน้าจอเกมแล้ว กำลังเตรียมคำตอบ
  errors:
    unsupported-platform: การช่วยถ่ายจอเกมต้อง Windows
    invalid-request: เวอร์ชั่นเกมที่เลือกไม่ได้ผล เลือกมันอีกครั้งในการตั้งค่าการช่วยภาพจอ
    game-not-found: ไม่พบหน้าต่างที่ตรงกันกับวอคราฟท์ เปิดเกม แล้วลองอีกครั้ง
    ambiguous-window: มีหน้าต่างเกมที่ตรงกันหลายช่องเปิดแล้ว เลือกเวอร์ชั่นเกม
      หรือปิดหน้าต่างเพิ่มเติม แล้วลองอีกครั้ง
    minimized-window: ช่องทางเกมถูกลดน้อยลง ยืนยันและถามอีกครั้ง
    unverified-game: ไม่สามารถตรวจสอบหน้าต่างเกมนี้ได้ ใช้การติดตั้ง Warcraft
      ที่ได้รับการสนับสนุนอย่างเป็นทางการ
    capture-failed: ไม่ได้ถ่ายจอเกม ทําให้เกมดูและลองโหมดหน้าต่าง
    empty-frame: รูปจอว่าง หรือดํา ทําให้เกมได้เห็นและถามอีกครั้ง
    capture-timeout: การถ่ายจอปิดเวลา รอสักครู่ แล้วถามอีกครั้ง
    busy: รูปฉากหน้าจออีกหนึ่งกําลังเกิดขึ้น รอจนจบ
    window-changed: หน้าต่างเกมเปลี่ยนตอนถ่ายภาพจอ ขอภาพหน้าจอใหม่อีกครั้ง
    vision-not-configured: เลือกผู้ให้บริการและโมเดลวิเคราะห์ภาพก่อนขอความช่วยเหลือจากภาพเกม
    vision-failed: รูปแบบวิเคราะห์ภาพ AI ไม่สามารถอ่านฉากจอได้ ตรวจสอบการตั้งค่าแบบ
      และลองอีกครั้ง
    no-description: รูปแบบ AI การวิเคราะห์ภาพ ไม่ตอบสนองคําอธิบาย ลองอีกครั้ง
      หรือเลือกแบบอื่นที่รองรับภาพ

