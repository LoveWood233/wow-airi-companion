screen-assist:
  title: ผู้ช่วยวิเคราะห์ภาพเกม
  description: 'พูดว่า “ดูนี่ให้หน่อย” หรือ “ดูอุปกรณ์ของฉันให้หน่อย” เพื่อให้ผู้ช่วยดูหน้าต่าง Warcraft ปัจจุบันและตอบจากภาพ'
  enabled: จับภาพเมื่อฉันขอให้ดูเกม
