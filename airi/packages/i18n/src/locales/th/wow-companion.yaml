  location-error: 'สร้างเรื่องราวสถานที่ไม่สำเร็จ โปรดตรวจสอบการตั้งค่าแชตหรือเสียง'
  combats-required: 'จำนวนครั้งที่ต้องออกจากการต่อสู้ก่อนคุยแต่ละครั้ง'
  combats-required-description: 'นับการออกจากการต่อสู้จริงตั้งแต่ตัวละครเข้าเกมครั้งนี้ หลังคุยทั่วไปหนึ่งครั้งจะเริ่มนับทั้งเวลาและจำนวนครั้งใหม่ การเชื่อมต่อใหม่จะเก็บความคืบหน้าไว้'
