  scene-description: 'ใช้ความถี่ตามพื้นที่กลางแจ้งหรือพื้นที่เฉพาะที่สังเกตได้ พื้นที่ไม่ทราบชนิดและ PvP ใช้ความถี่พื้นฐาน เวลาการคุยทั่วไปยังเดินต่อระหว่างต่อสู้ ส่วนการจับภาพนับเวลาแยกกัน'

