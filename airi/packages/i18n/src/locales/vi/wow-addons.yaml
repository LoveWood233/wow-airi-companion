errors:
  unknown: Yêu cầu thất bại. Hãy thử lại.
  curseforge-api-key-required: Thêm khóa API CurseForge trong cài đặt addon.
  curseforge-unauthorized: CurseForge từ chối khóa API. Kiểm tra khóa trong cài đặt addon.
  curseforge-rate-limited: CurseForge đã giới hạn yêu cầu. Chờ rồi thử lại.
  curseforge-timeout: CurseForge không phản hồi kịp thời. Hãy thử lại.
  curseforge-invalid-response: CurseForge trả về phản hồi không hợp lệ. Hãy thử lại.
  curseforge-response-too-large: Phản hồi CurseForge vượt quá kích thước được hỗ trợ.
  curseforge-request-failed: Yêu cầu CurseForge thất bại. Kiểm tra kết nối rồi thử lại.
  curseforge-invalid-request: Yêu cầu không hợp lệ. Kiểm tra phiên bản trò chơi đã cấu hình rồi thử lại.
  curseforge-too-many-files: Addon này có quá nhiều tệp để tải an toàn. Hãy chọn addon khác.
  curseforge-too-many-redirects: Quá nhiều lần chuyển hướng khi tải. Hãy thử lại sau.
  curseforge-not-found: CurseForge không tìm thấy addon hoặc tệp này. Làm mới danh sách addon.
  curseforge-disposed: Dịch vụ addon đã dừng. Mở lại trung tâm addon rồi thử lại.
  curseforge-incompatible-version: Tệp addon không phù hợp với phiên bản trò chơi đã cấu hình.
  curseforge-distribution-disabled: Tác giả không cho phép cài addon này qua công cụ bên thứ ba.
  curseforge-download-unavailable: CurseForge không có bản tải cho tệp addon này.
  curseforge-unsafe-download-url: Địa chỉ tải không vượt qua kiểm tra.
  curseforge-download-integrity: Bản tải addon không vượt qua kiểm tra tính toàn vẹn. Hãy thử lại.
  wow-addons-settings-invalid: Kiểm tra cài đặt addon rồi thử lại.
  wow-addons-directory-required: Thiết lập thư mục máy khách WoW trong cài đặt addon.
  wow-addons-version-required: Chọn phiên bản trò chơi tương thích trong cài đặt addon.
  wow-addons-busy: Một thao tác addon khác đang chạy. Chờ thao tác đó hoàn tất.
  wow-addons-key-storage-unavailable: Kho khóa bảo mật không khả dụng. Khởi động lại Bạn đồng hành WoW rồi thử lại.
  wow-addons-key-unreadable: Bạn đồng hành WoW không đọc được khóa API đã lưu. Hãy lưu lại khóa.
  wow-addons-required-dependency: Không cài được addon phụ thuộc bắt buộc. Hãy thử lại.
  wow-addons-unmanaged-conflict: Đã có thư mục addon ngoài phạm vi quản lý. Di chuyển thư mục đó trước khi cài addon này.
  wow-addons-folder-conflict: Thư mục addon xung đột với addon khác. Di chuyển thư mục đó trước khi cài đặt.
  wow-addons-unsafe-archive: Gói addon chứa đường dẫn không an toàn nên không thể cài đặt.
  wow-addons-install-failed: Cài đặt thất bại. Kiểm tra thư mục máy khách rồi thử lại.
  wow-addons-invalid-directory: Thư mục máy khách không hợp lệ hoặc không truy cập được. Kiểm tra đường dẫn trong cài đặt addon.
  wow-addons-invalid-archive: Gói addon không hợp lệ hoặc không an toàn nên không thể cài đặt.
  wow-addons-directory-conflict: Thư mục addon hiện có xung đột với lần cài đặt này. Di chuyển thư mục xung đột rồi thử lại.
  wow-addons-request-failed: Thao tác addon thất bại. Kiểm tra thư mục máy khách rồi thử lại.
  wow-addons-dependency-limit: Addon yêu cầu quá nhiều lớp phụ thuộc để cài đặt an toàn.
  wow-addons-stopped: Thao tác addon đã dừng. Mở lại trung tâm addon rồi thử lại.
