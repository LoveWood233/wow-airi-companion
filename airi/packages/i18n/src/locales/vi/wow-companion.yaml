screen-assist:
  title: Trợ giúp qua ảnh chụp trò chơi
  description: 'Nói “xem cái này” hoặc “xem trang bị của tôi” để người đồng hành xem cửa sổ Warcraft hiện tại và trả lời theo hình ảnh.'
  enabled: Chụp khi tôi yêu cầu xem trò chơi
  enabled-description: 'Yêu cầu xem bằng văn bản hoặc giọng nói sẽ chụp một ảnh trò chơi. Ảnh đính kèm được ưu tiên. Trò chuyện thông thường không chụp ảnh.'
  image-use: 'Ảnh được gửi đến dịch vụ thị giác. Dịch vụ trò chuyện hỗ trợ ảnh cũng nhận ảnh trong lượt này. Trò chuyện chỉ có văn bản dùng mô tả ảnh. Ảnh gốc không lưu vào lịch sử cục bộ.'
  target: Cửa sổ trò chơi
  target-description: Chế độ tự động cần đúng một cửa sổ Warcraft. Nếu mở nhiều
    phiên bản, hãy chọn một và đóng các cửa sổ thừa của phiên bản đó.
  games:
    auto: Tự động
    retail: Retail
    forever: Forever
    classic: Classic
  configure-vision: Cấu hình mô hình thị giác
  vision-description: Chọn nhà cung cấp và mô hình hỗ trợ hình ảnh trong cài đặt
    Thị giác. Mở phần cài đặt này không chụp ảnh màn hình.
  examples-title: Hỏi qua chat hoặc giọng nói
  examples:
    terrain: Bạn có thể nhìn địa hình phía trước và giúp tôi tìm đường đi qua không?
    quest: Nhiệm vụ đánh dấu NPC ở đây nhưng tôi không thấy. Bạn giúp tôi tìm NPC
      được không?
    scene: 'Xem cái này và cho tôi biết bạn thấy gì.'
    equipment: 'Xem trang bị của tôi. Bạn thấy thế nào?'
  command: Để yêu cầu chụp ảnh, bắt đầu tin nhắn bằng /look rồi thêm câu hỏi. Sau
    khi di chuyển trong trò chơi, hãy hỏi lại để lấy ảnh mới.
  limits: Chỉ hỗ trợ Windows. Giữ cửa sổ trò chơi hiển thị. Một ảnh không thể xác
    nhận va chạm, lối vào ẩn hoặc pha nhiệm vụ. Lời khuyên không điều khiển nhân
    vật.
  capturing: Đang chụp cửa sổ Warcraft…
  analyzing: Đang phân tích màn hình trò chơi…
  ready: Đã phân tích màn hình. Đang chuẩn bị trả lời.
  errors:
    unsupported-platform: Hỗ trợ chụp màn hình trò chơi yêu cầu Windows.
    invalid-request: Phiên bản trò chơi được chọn là không hợp lệ. Chọn nó một lần
      nữa trong cài đặt hỗ trợ chụp màn hình.
    game-not-found: Không tìm thấy cửa sổ nào phù hợp với Warcraft. Mở game và thử lại.
    ambiguous-window: Một số cửa sổ trò chơi phù hợp đã mở. Chọn phiên bản trò chơi
      hoặc đóng cửa sổ bổ sung và thử lại.
    minimized-window: Chiếc cửa sổ trò chơi được giảm thiểu. Khôi phục nó và hỏi lại.
    unverified-game: Tôi không thể xác minh cửa sổ trò chơi này. Sử dụng một cài đặt
      Warcraft chính thức được hỗ trợ.
    capture-failed: Không thể chụp ảnh màn hình trò chơi. Giữ trò chơi hiển thị và
      thử chế độ cửa sổ.
    empty-frame: Chụp màn hình trống hoặc đen. Giữ trò chơi hiển thị và hỏi lại.
    capture-timeout: Việc chụp màn hình đã hết thời gian. Chờ một chút và hỏi lại.
    busy: Một bức ảnh màn hình khác đang diễn ra. Chờ cho nó kết thúc.
    window-changed: Chiếc cửa sổ trò chơi đã thay đổi khi chụp ảnh màn hình. Hãy hỏi
      lại một bức ảnh màn hình mới.
    vision-not-configured: Chọn nhà cung cấp và mô hình thị giác trước khi yêu cầu
      trợ giúp qua ảnh trò chơi.
    vision-failed: Mô hình AI phân tích hình ảnh không thể đọc ảnh chụp màn hình.
      Kiểm tra cài đặt mô hình và thử lại.
    no-description: Mô hình phân tích hình ảnh AI không trả lời mô tả. Hãy thử lại
      hoặc chọn một mô hình khác hỗ trợ hình ảnh.

