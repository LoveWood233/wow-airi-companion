  identity-note: Tài khoản sử dụng ID địa phương được lưu bởi addon. Bạn đồng hành WoW không đọc tài khoản đăng nhập của bạn Đánh dấu mỗi thẻ để xác định nó.
  flow-note: Số dư ban đầu không được tính là dòng chảy. Bưu điện, giao dịch, tiền gửi ngân hàng, rút tiền và chuyển tiền giữa các nhân vật của bạn được tính theo dòng tiền.
  balance-note: Các cân bằng chỉ bao gồm các nhân vật được quan sát, mỗi nhân vật ở quan sát cuối cùng của nó. Không phải tất cả đều hiện tại. Các số dư ngân hàng Warband được loại trừ.
  demo-note: Dữ liệu demo vẫn nằm ngoài sổ cái này. Tiền thay đổi cập nhật ngữ cảnh trò chuyện mà không có câu trả lời bằng giọng nói chủ động.
