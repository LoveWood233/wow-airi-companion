equipment-prompt:
  message: Chúc mừng cho thiết bị mới của bạn, {name}! Điều này cho bạn một cơ hội khác để phát triển mạnh hơn. {reason} Bạn muốn thay thiết bị?
  message-player: '{player}, chúc mừng về thiết bị mới của bạn, {name}! Điều này cho bạn một cơ hội khác để phát triển mạnh hơn. {reason} Bạn muốn thay thiết bị?'
  message-player-tradeoff: '{player}, chúc mừng về thiết bị mới của bạn, {name}! Nó có thể cải thiện tình trạng cơ bản của bạn. {reason} Bạn muốn thay thiết bị?'
  reason:
    stats: Các thuộc tính được ghi nhận của nó cải thiện rõ ràng sau khi so sánh ({oldLevel} → {newLevel} cấp mục).
    empty: Vị trí đích của nó trống rỗng.
    tradeoff: Cấp vật phẩm {oldLevel} → {newLevel}, {primary} {oldPrimary} → {newPrimary}, nhưng {decreases}. Các chỉ số có đánh đổi. Không đảm bảo lợi ích tổng thể.
    separator: ', '
  accepted: Hãy nhấp “Xác nhận thay đổi” trong trò chơi. Bạn đồng hành WoW không gửi thao tác vào trò chơi.
  accept: Có
  decline: Không, cảm ơn
  timeout: Chọn trong 10 giây. Nếu không chọn, lời nhắc này sẽ đóng. Việc thay trang bị vẫn cần xác nhận trong trò chơi.
  description: Nâng cấp rõ ràng hoặc cấp vật phẩm và chỉ số chính cao hơn có thể yêu cầu thay. Chỉ số phụ giảm luôn được nêu rõ. Mỗi lần thay cần bạn xác nhận.
idle-interaction:
