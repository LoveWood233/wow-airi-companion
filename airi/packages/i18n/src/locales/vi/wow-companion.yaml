title: Bạn đồng hành WoW
description: Hãy cùng nhau ở Azeroth. Đọc tình trạng nhân vật và phản ứng vào những khoảnh khắc quan trọng.
product:
  about-title: Về Bạn đồng hành WoW
  description: Đồng hành trong World of Warcraft, trò chuyện bằng giọng nói và quản lý addon.
  version: Phiên bản
  project: Dự án
  third-party: Giấy phép bên thứ ba
  license-note: Phần mềm này sử dụng các thành phần mã nguồn mở. Thông báo bản quyền và giấy phép của họ vẫn ở trong các tập tin nguồn và phân phối.
  local-provider-note: Cấu hình dịch vụ trò chuyện và giọng nói trong cài đặt. Không cần tài khoản ứng dụng.
