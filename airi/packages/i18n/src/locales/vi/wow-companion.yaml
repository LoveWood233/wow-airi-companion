pause-capture: Tạm dừng chụp
capture-help: Dùng /wowc compact để hiện lưới 64 × 64 và /wowc status để đọc tọa độ gốc. Không che lưới. Nếu ô một pixel bị nhòe, dùng /wowc cell 2 rồi đặt kích thước ô ở đây thành 2.
