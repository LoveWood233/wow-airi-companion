      và lưu vị trí tập tin đầu tiên.
    storage-error: Không thể đọc hoặc lưu cài đặt khởi động. Kiểm tra truy cập vào
      thư mục dữ liệu ứng dụng.
    launch-failed: Không thể khởi động ứng dụng. Kiểm tra cài đặt và quyền tập tin.
    busy: Việc nộp đơn đã bắt đầu rồi. Chờ cho nó kết thúc.
    request-failed: Dịch vụ máy tính để bàn không trả lời. Hãy thử lại hoặc khởi
