    baseline: Quan sát đầu tiên. Thời gian nâng cấp trước đó là không rõ.
    live: Sự gia tăng mức độ được quan sát trong thời gian bắt sống.
    gap: Sự thay đổi được tìm thấy sau một khoảng trống hoặc qua nhiều cấp độ. Thời gian nâng cấp là không rõ.
    decrease: Giảm mức được quan sát thấy. Không có khoảng thời gian nâng cấp áp dụng.
    clock-change: Đồng hồ máy tính đã thay đổi. Khoảng thời gian này không thể đo được.
equipment:
  title: Lịch sử nhận trang bị
  description: Bạn đồng hành WoW giữ 10 hồ sơ mới nhất cho phiên bản trò chơi này trên máy tính này. Một khi có 10 bản ghi, mỗi bản ghi mới sẽ loại bỏ bản ghi cũ nhất.
  empty: Không có lịch sử thiết bị. Các mặt hàng túi hiện có không phải là một việc mua lại mới.
  bridge-update: Cầu nối này chỉ cung cấp dữ liệu nhân vật. Dừng cầu nối độc lập cũ rồi khởi động lại Bạn đồng hành WoW để đọc trang bị bằng cầu nối mới.
  capture-note: Sử dụng khoảng thời gian chụp 100 ms cho các câu hỏi thiết bị nhanh chóng. Thời gian dài hơn có thể lặp đi lặp lại bỏ lỡ các mảnh thiết bị.
