  offline-note: Khoảng thời gian bao gồm thời gian offline, trên các ký tự khác, và với Bạn đồng hành WoW đóng. Các hồ sơ vẫn còn sau khi khởi động lại.
  observation-note: Bạn đồng hành WoW không thể phục hồi thời gian nâng cấp bị bỏ lỡ. Một quan sát đầu tiên hoặc một sự thay đổi được tìm thấy sau khi có khoảng cách không chứng minh thời gian nâng cấp.
  average-note: Tỷ lệ trung bình chỉ sử dụng khoảng thời gian một cấp độ hoàn chỉnh. Các khoảng thời gian một phần, thay đổi bị bỏ qua, mức giảm và thay đổi đồng hồ được loại trừ.
