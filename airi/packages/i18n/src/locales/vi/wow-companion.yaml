  enabled: Giữ trạng thái trò chơi hiện tại sẵn sàng cho nhân vật.
  muted: Tiếp tục cập nhật ngữ cảnh mà không có câu trả lời trò chơi chủ động.
  quietInCombat: Giữ một sự kiện quan trọng đến khi hết chiến đấu. Bỏ sự kiện sau 30 giây.
  levelUp: Khám phá một cấp độ cao hơn trong cùng một phiên nhân vật.
  zone: Phản ứng với một bản đồ hoặc khu vực mới, tùy thuộc vào việc làm mát.
  death: Phản ứng ngắn gọn trong giọng nói của nhân vật được chọn, với nhóm trò chơi hoặc trò đùa chủng tộc khi thích hợp.
  revive: Phản ứng khi nhân vật trở lại cuộc sống.
  allowDemo: Mặc định tắt. Câu trả lời thử nghiệm dùng mô hình và giọng nói đã cấu hình.
cooldown: Khoảng giây tối thiểu giữa các phản ứng
cooldown-description: Từ 0 đến 300 giây. Chỉ có một sự kiện gần đây chờ đợi trong thời gian làm mát.
capture: Hiệu chỉnh màn hình
capture-description: Lưới mặc định dùng một pixel vật lý mỗi ô, kích thước 64 × 64 pixel. Đây là kích thước nhỏ nhất của định dạng đen trắng này. Tọa độ dùng pixel vật lý trên màn hình.
