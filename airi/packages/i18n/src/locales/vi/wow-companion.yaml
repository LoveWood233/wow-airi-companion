title: Bạn đồng hành WoW
description: Hãy cùng nhau ở Azeroth. Đọc tình trạng nhân vật và phản ứng vào những khoảnh khắc quan trọng.
product:
  about-title: Về Bạn đồng hành WoW
  description: Đồng hành trong World of Warcraft, trò chuyện bằng giọng nói và quản lý addon.
  version: Phiên bản
