no-events: Chưa có sự kiện.
gold:
  title: Sổ vàng
  description: Theo dõi dòng tiền theo tài khoản addon địa phương. Tổng cập nhật với kết nối trò chơi và vẫn được lưu trên máy tính này.
  current-balance: Tiền của nhân vật hiện tại
  current-unavailable: Tiền hiện tại không có sẵn. Giữ một nhân vật thực sự trực tuyến với chụp trực tiếp để đọc cân bằng.
  empty: Vẫn chưa có quan sát tiền thật. Thiết lập thêm và cầu cập nhật, sau đó đăng nhập vào mỗi ký tự để bắt đầu sổ cái.
  storage-error: sổ cái không tải hoặc lưu. Những tổng số này không được xác nhận trên đĩa. Kiểm tra lỗi lưu trữ và không gian đĩa có sẵn.
