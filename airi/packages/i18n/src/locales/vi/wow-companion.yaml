model-required: Chọn nhà cung cấp trò chuyện và mô hình trong Bạn đồng hành WoW để bật câu trả lời của nhân vật. Giọng nói dùng cài đặt hiện có.
start-bridge: Bạn đồng hành WoW khởi chạy cầu nối cục bộ khi bật kết nối này. Giữ lưới addon hiển thị. Windows cần Python 3.10 trở lên.
