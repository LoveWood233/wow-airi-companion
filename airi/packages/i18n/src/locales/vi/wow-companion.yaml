equipment-swaps:
  title: Kết quả thay trang bị
  description: Addon hỏi về nâng cấp rõ ràng, ô trống, hoặc cấp vật phẩm cao hơn với chỉ số chính tăng và chỉ số phụ giảm. Mỗi lần thay đều cần xác nhận.
  confirmation: Hãy xác nhận trong trò chơi. Chọn Có trong Bạn đồng hành WoW chỉ hiện bước tiếp theo, không thay trang bị hay gửi thao tác vào trò chơi.
  empty: Không có kết quả xác nhận thiết bị trong phiên diễn văn này.
