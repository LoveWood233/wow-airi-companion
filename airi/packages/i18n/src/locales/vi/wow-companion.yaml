versions:
  label: Phiên bản World of Warcraft
  isolation: Mỗi phiên bản có cài đặt riêng biệt, hiệu chuẩn, sự kiện, hồ sơ vàng, lịch sử thiết bị và lịch sử cấp độ. Thay đổi các trang loại bỏ các chỉnh sửa chưa được lưu.
  retail:
    name: World of Warcraft Retail
    description: Cài đặt đồng hành và hồ sơ vàng cho Retail.
    capture-help: Sử dụng /wowc compact cho lưới 64 × 64, sau đó /wowc status để đọc nguồn gốc của nó. Biên giới cửa sổ và các màn hình khác thay đổi tọa độ máy tính để bàn. Giữ lưới không bị cản trở. Nếu các tế bào một pixel mờ, sử dụng /wowc cell 2 và đặt kích thước tế bào lên 2.
  forever:
    name: 'World of Warcraft: Forever'
    description: Cài đặt đồng hành độc lập và hồ sơ vàng cho Forever.
    preview: Phiên bản này được chuẩn bị trước khi phát hành. Sự tương thích trực tiếp yêu cầu kiểm tra sau khi phát hành. Kết nối bị vô hiệu hóa theo mặc định.
    capture-help: Sau khi cài đặt addon Forever, sử dụng /wowf compact cho lưới 64 × 64. Sử dụng /wowf status để đọc nguồn gốc của nó. Giữ lưới không bị cản trở. Nếu các tế bào một pixel bị mờ, hãy sử dụng /wowf cell 2 và đặt kích thước tế bào lên 2.
level-history:
  title: Lịch sử cấp độ nhân vật
  description: Bạn đồng hành WoW lưu các quan sát cấp độ cho mỗi ký tự trên máy tính này. Thời gian trôi qua sử dụng đồng hồ thế giới thực và bao gồm thời gian offline.
  empty: Không có lịch sử cấp độ nào. Kết nối một nhân vật thực sự để bắt đầu một bản ghi từ cấp độ hiện tại của nó.
  storage-error: Lịch sử cấp độ không tải hoặc lưu. Không xác nhận lưu trữ đĩa. Kiểm tra lỗi và không gian đĩa có sẵn.
