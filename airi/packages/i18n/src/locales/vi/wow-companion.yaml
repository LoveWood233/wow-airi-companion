start-bridge: Bạn đồng hành WoW khởi chạy cầu nối cục bộ khi bật kết nối này. Giữ lưới addon hiển thị. Bản phát hành Windows có sẵn Python. Chế độ phát triển cần cài Python 3.10 trở lên.
