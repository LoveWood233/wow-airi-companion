    live: Sự gia tăng mức độ được quan sát trong thời gian bắt sống.
    gap: Sự thay đổi được tìm thấy sau một khoảng trống hoặc qua nhiều cấp độ. Thời gian nâng cấp là không rõ.
    decrease: Giảm mức được quan sát thấy. Không có khoảng thời gian nâng cấp áp dụng.
    clock-change: Đồng hồ máy tính đã thay đổi. Khoảng thời gian này không thể đo được.
