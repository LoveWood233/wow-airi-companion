title: 'Thống kê cài đặt và sử dụng'
description: 'Gửi bản ghi cài đặt ẩn danh và token do mô hình báo cáo mỗi 5 phút.'
disclosure-title: 'Thông báo trước khi thống kê'
disclosure-intro: 'Hãy đọc thông báo trước khi thu thập. Tùy chọn mặc định bật nhưng có thể tắt. Chưa thu thập trước khi bấm tiếp tục.'
collect: 'Gửi mã cài đặt ngẫu nhiên, phiên bản, nền tảng và bộ đếm token tích lũy đến máy chủ đã cấu hình.'
no-content: 'Không thu thập trò chuyện, nhân vật, ảnh chụp, âm thanh, tên nhà cung cấp, tên mô hình hoặc khóa API.'
coverage: 'Chỉ tính mức dùng do mô hình trò chuyện, thị giác và tác vụ đồng hành trả về. Dữ liệu thiếu là chưa rõ. Không gồm dịch vụ giọng nói.'
installation-limit: 'Số cài đặt không phải số người. Xóa hoặc tạo lại hồ sơ có thể tạo thêm bản ghi cài đặt.'
control: 'Có thể tắt thu thập và gửi trong cài đặt. Tổng đã gửi vẫn được giữ trên máy chủ.'
