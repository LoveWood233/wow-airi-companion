  raw-spell-template: 原始技能模板不能代表角色当前等级下的最终效果。
  level-scaling-unresolved: 尚未解析等级缩放与角色最终技能数值。
  raw-item-fields: 展示原始 DB2 字段，不把缩放分布直接解释为固定属性。
  item-scaling-unresolved: 尚未解析本地物品缩放与附加参数实例属性。
  base-spell-values: 技能描述来自来源基础数值，尚未核实角色最终效果。
  source-level-capped: 无限服来源最多接受 60 级，此次来源查询按 60 级处理。
  description-unavailable: 来源尚未提供可用的技能描述。
  proc-rate-unverified: 效果文本不能证明触发概率、覆盖率或套装效果已经生效。
  effects-unavailable: 暂无已核实的目录效果描述。
  purchased-node-inactive: 此节点已有点数投入，但本次观察未显示由其生效的技能。
  result-truncated: 解释已达到节点数量上限，未展示的节点保持未知。
  source-adjusted-node: 来源调整了一个节点，尚未提供具体原因。
