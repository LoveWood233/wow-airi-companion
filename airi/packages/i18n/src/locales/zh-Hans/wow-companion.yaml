  restart-game: 插件文件已更新，请完整重启游戏，启用插件并进入角色；文件检查通过不代表游戏已经加载插件。
  backup: 原插件备份
  calibrate: 打开连接与校准设置
  configure: 打开配置
  test-chat: 测试聊天
  cancel-test: 取消测试
  preview: 试听一句
