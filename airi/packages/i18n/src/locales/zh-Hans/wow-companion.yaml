  demo: 演示数据
  paused: 采集已暂停

versions:
  label: 魔兽世界版本
  isolation: 两个版本的连接设置、采集坐标、事件、金币记录、装备历史和等级历史独立保存。切换页面会放弃尚未保存的修改。
  retail:
    name: 魔兽世界正式服
    description: 正式服专用的陪伴设置与金币记录。
    capture-help: 正式服输入 /wowc compact 缩至 64×64，再用 /wowc status 查看起点。窗口边框或其他显示器会改变桌面坐标。保持传输码无遮挡。若单像素显示模糊，可用 /wowc cell 2，并将这里的单元格大小改为 2。
  forever:
    name: 魔兽世界：无限
    description: 无限服独立的陪伴设置与金币记录。
    preview: 当前为客户端开放前的预备版本，真实游戏兼容性需待开放后验证。陪伴连接默认关闭。
    capture-help: 安装无限服插件后，输入 /wowf compact 缩至 64×64，再用 /wowf status 查看起点。填写该客户端的桌面坐标，并保持传输码无遮挡。若单像素显示模糊，可用 /wowf cell 2，并将这里的单元格大小改为 2。

