title: 魔兽陪伴精灵
description: 一起漫游艾泽拉斯。了解角色状态，在重要时刻陪你回应。
product:
  about-title: 关于魔兽陪伴精灵
  description: 魔兽世界角色陪伴、语音聊天与插件管理。
  version: 版本
  project: 项目地址
  third-party: 第三方许可
  license-note: 本软件使用开源组件，其版权与许可证保留在源码和发行文件中。
  local-provider-note: 在设置中配置聊天和语音服务，无需软件账号。
connection: 游戏连接
last-seen: 最近有效画面
demo-warning: 当前为演示数据，不代表真实游戏角色。
model-required: 请在魔兽陪伴精灵中选择对话服务和模型后启用角色回应。语音沿用现有声音设置。
start-bridge: 开启陪伴连接后，魔兽陪伴精灵会自动启动本机桥接，无需单独操作。请保持插件数据传输码可见。Windows 需已安装 Python 3.10 或更高版本。
