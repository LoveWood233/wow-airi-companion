equipment-swaps:
  title: 确认换装记录
  description: 新装备满足条件且装等更高或对应栏位为空时，插件会在游戏中逐件询问。每次换装都需要确认。
  confirmation: 请在游戏内最终确认。在 AIRI 中选择“好”只会显示下一步提示，不会执行换装或向游戏发送输入。
  empty: 当前角色会话中还没有换装确认记录。
  bridge-update: 当前桥接没有提供换装结果。请更新插件和桥接，然后重启 AIRI。
  read-error: 部分换装结果暂时不可用。
  historical: 以下为上次收到的结果。连接或结果数据不可用时，AIRI 不会将其作为实时上下文。
  observed: 结果时间
  previous: 原物品
  empty-slot: 空栏位
  expired-reason: 询问已过期，插件没有执行换装。
  scope-note: 记录反映过去的操作，不代表当前仍然穿戴。装等更高不保证属性、套装效果或实战收益更好。
  status:
    equipped: 换装已核实
    declined: 已拒绝
    failed: 未能确认
    expired: 询问已过期
  reason:
    confirmed: 在你于游戏内确认后，插件已核实该次换装。
    user: 你在游戏内拒绝了此次换装。
    timeout: 未能确认换装结果，请检查游戏穿戴栏。
    combat: 战斗中断了请求，请在战斗结束后重新确认。
    changed: 物品或目标栏位发生变化，请求已停止。
    unavailable: 所需的物品信息或游戏接口不可用。
    locked: 物品被锁定，请求已停止。
    cursor: 鼠标正在拖动物品，请求已停止。
    dead: 角色已死亡，请求已停止。
    restricted: 游戏限制了此操作，请求已停止。
    disabled: 换装确认已关闭，请求已停止。
    left_world: 角色离开了游戏世界，请求已停止。
