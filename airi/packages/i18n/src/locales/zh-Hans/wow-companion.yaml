equipment-prompt:
  message: '恭喜获得{name}！{reason}要换上这件装备吗？'
  reason:
    higher: '新装备装等为 {newLevel}，当前装备为 {oldLevel}。'
    empty: 对应装备栏位当前为空。
  accepted: 请在游戏内点击“确认换装”。AIRI 不会向游戏发送输入。
  accept: 好
  decline: 不用
  timeout: 请在 10 秒内选择。不选择会关闭此提醒，换装仍需在游戏内确认。
  description: 建议仅依据装等或空栏位，不代表属性、特效或套装的总收益更好。
