no-character: 尚未读取到角色。请检查桥接服务和屏幕坐标。
preferences: 陪伴偏好
preferences-description: 离开此页面后连接仍会继续。仅主角色窗口生成回应，避免多窗口重复播报。
options:
  enabled: 开启陪伴
  muted: 游戏提醒静音
  quietInCombat: 战斗时免打扰
  levelUp: 升级时祝贺
  zone: 进入新区域时回应
  death: 死亡时回应
  revive: 复活后鼓励
  allowDemo: 允许角色回应演示事件
hints:
  enabled: 将当前游戏状态提供给角色的对话上下文。
  muted: 继续更新上下文，但不主动回应游戏事件。
  quietInCombat: 保留一个重要事件，战斗结束后回应；超过 30 秒的事件会丢弃。
  levelUp: 只在同一角色会话内检测等级提高。
  zone: 地图或区域改变时回应，遵守提醒间隔。
  death: 按当前角色语气简短回应，可结合已知的游戏阵营或种族调侃。
  revive: 在角色恢复生命时回应。
  allowDemo: 默认关闭。开启后测试回应会使用已配置的模型和语音。
cooldown: 两次回应的最小间隔（秒）
cooldown-description: 可设 0～300 秒。间隔期间只保留一个近期事件。
capture: 屏幕位置校准
capture-description: 默认每格 1 个物理像素，占用 64×64 像素，已是当前黑白编码格式的最小尺寸。坐标按桌面物理像素填写。
capture-x: 编码区左侧 X
capture-y: 编码区顶部 Y
cell-size: 单元格大小（像素）
poll-ms: 采集间隔（毫秒）
pause-capture: 暂停采集
capture-help: 在游戏输入 /wowc compact 缩至 64×64，再用 /wowc status 查看起点。保持传输码无遮挡。若单像素显示模糊，可用 /wowc cell 2，并将这里的单元格大小改为 2。
save-preferences: 保存陪伴偏好
save-capture: 应用校准
saved: 已保存。
failed: 操作失败。
demo: 连接演示
demo-description: 无需登录游戏即可测试。默认不会将演示信息加入角色上下文，需要先明确开启上方开关。
demo-label: 演示
start-demo: 开始演示
stop-demo: 返回真实画面采集
actions:
  level_up: 模拟升级
  zone: 切换区域
  death: 模拟死亡
  revive: 模拟复活
  combat: 切换战斗状态
events: 最近游戏事件
