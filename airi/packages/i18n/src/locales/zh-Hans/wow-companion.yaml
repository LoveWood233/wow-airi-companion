guide:
  title: 首次使用向导
  description: 跟随遮罩与气泡，逐步了解角色、模型服务、语音和游戏连接。随时可以跳过，之后从设置重新打开。
  game: 本次向导使用的游戏版本
  start: 开始向导
  restart: 重新开始
  continue: 继续上次进度
  no-changes: 向导不会自动填写密钥或修改设置。配置检查中的插件安装和模型测试需手动点击；浏览完成不代表配置成功。
  progress: '使用向导 · 第 {current} / {total} 步'
  previous: 上一步
  next: 下一步
  configure: 去配置
  resume: 配置好，继续向导
  skip: 暂时跳过
  complete: 完成向导
  target-unavailable: 页面内容尚未显示。可以先去配置，或继续下一步。
  navigation-failed: 未能打开对应设置页。请重试，或稍后从设置重新打开向导。
  open-failed: 未能打开使用向导。可在设置中点击“首次使用向导”重试。
  steps:
    welcome:
      title: 欢迎来到魔兽陪伴精灵
      body: 在这里选择正式服或无限服，再按“下一步”浏览设置。需要实际操作时，点击“去配置”收起遮罩；配置后可继续。按 Esc 可跳过，设置中始终保留向导入口。
    model:
      title: 选择陪伴你的角色形象
      body: 在角色模型页选择或导入形象，查看预览并调整显示。角色外观与聊天模型是两项独立设置；暂时没有模型也可以继续浏览向导。
    providers:
      title: 配置模型服务
      body: 选择要使用的聊天、语音或视觉服务，填写对应地址和凭据，并使用页面提供的连接检查。需要的服务取决于你想开启的功能。向导不会读取或代填密钥。
    chat:
      title: 让角色能够回应你
      body: 选择已配置的聊天服务与模型。保存后回到角色聊天窗口发送一句问候，确认可以收到回复。聊天成功不代表语音已配置，下一步会介绍声音设置。
    speech:
      title: 选择声音并试听
      body: 选择语音服务、模型与音色，使用试听确认能听到声音。需要语音输入时，再到听觉设置配置识别服务和麦克风。只使用文字聊天时可跳过。
    connection:
      title: 连接你的魔兽世界角色
      retail: 将 WoWMapCompanion 安装到正式服的 Interface/AddOns，启用插件并进入角色。Windows 发行包已内置 Python。开发模式需安装 Python 3.10 或更新版本。开启陪伴连接，保持左上角 64×64 数据传输码无遮挡，按游戏客户区位置校准，确认状态显示当前角色而非演示数据。
      forever: 将 WoWForeverCompanion 安装到无限服实际使用的 Interface/AddOns，完整重启游戏并进入角色。Windows 发行包已内置 Python。开发模式需安装 Python 3.10 或更新版本。开启无限服陪伴连接，保持 64×64 数据传输码无遮挡并校准；客户端接口兼容性仍需实机核对。
    chatter:
      title: 调整提醒与闲聊节奏
      body: 普通闲聊、截图闲聊和地图逸闻分别设置。先使用较低的互动频率，并检查静音及战斗免打扰。截图闲聊需要视觉、聊天和语音服务，开启前留意调用费用。
    vision:
      title: 按需开启游戏截图辅助
      body: 配置视觉服务后，在此开启游戏截图辅助。之后可说“看看这个”或使用 /look 提问。截图会发送到配置的模型服务；只截当前请求所需画面。暂不需要时保持关闭。
    knowledge:
      title: 为无限服接入资料查询
      body: MCP 设置管理外部查询服务。无限服可使用 wuxianwow，地址为 https://wuxianwow.com/mcp，采用 Streamable HTTP，无需登录。配置后检查工具连接，问“瑟银锭有什么用”并核对来源链接。该服数据不能当作正式服资料。
    launcher:
      title: 设置游戏快捷启动
      body: 配置战网或对应游戏版本的启动路径，并选择默认目标。之后可从角色工具栏启动。启动程序成功不等于已经登录游戏；无需此功能时可以跳过。
    finish:
      title: 回到角色，开始一次对话
      body: 检查能否收到聊天回复、听到试听声音，并在连接页核对真实角色。装备换装仍需游戏内确认。向导可以随时从“设置 → 首次使用向导”重新打开；完成这里只记录浏览进度。
