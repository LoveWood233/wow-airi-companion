  no-web-link: 此本地记录暂无已核实的公开来源网页。
stats:
  title: 数据覆盖范围
  count: '{count} 条记录'
busy: 正在读取本地数据库…
notices:
  client-db2-only: 这是客户端 DB2 资料，不包含服务器独有信息。
  hotfixes-not-applied: 尚未叠加服务器热修，数值可能与当前游戏不同。
  encrypted-sections: 部分来源表包含加密分段，已解码行数不代表全部记录。
  missing-fields: 此次导出缺少部分预期字段。
  raw-spell-template: 技能文本为客户端模板，占位符未解析为当前角色数值。
  map-id-not-uimap-id: 底层地图 ID 与世界地图区域 ID 属于不同类型。
  content-tuning-not-exploration-level: 内容缩放参数不能当作旧世地图探索等级。
  result-truncated: 当前返回的资料不完整。
errors:
  configuration-invalid: 已保存的数据库配置无效，请重新选择导出库。
  configuration-save-failed: 无法保存数据库选择，请检查本地访问权限后重试。
  database-unconfigured: 请先选择本地数据库。
  database-missing: 已选数据库文件不存在，请选择可用的导出文件。
  database-unreadable: 无法读取已选数据库，请检查访问权限或选择其他文件。
  database-invalid: 此文件不是受支持的正式服 DB2 导出库。
  database-changed: 查询期间数据库发生变化，请检查已选导出后重试。
  query-invalid: 请检查资料类型、查询内容或记录编号。
  query-timeout: 本地查询超时，请缩小查询范围后重试。
  query-failed: 本地查询失败，请检查已选数据库后重试。
  bridge-unavailable: 本地数据库服务暂不可用。
  generic: 操作失败，请检查已选数据库后重试。
