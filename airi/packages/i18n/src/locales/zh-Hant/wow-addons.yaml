  curseforge-too-many-files: 此插件的檔案數量過多，無法安全載入，請選擇其他插件。
  curseforge-too-many-redirects: 下載地址的重定向次數過多，請稍後重試。
  curseforge-not-found: CurseForge 找不到此插件或檔案，請重新整理插件列表。
  curseforge-disposed: 插件服務已停止，請重新開啟插件中心後重試。
  curseforge-incompatible-version: 此插件檔案與已配置的遊戲版本不相容。
  curseforge-distribution-disabled: 作者不允許透過第三方工具安裝此插件。
  curseforge-download-unavailable: CurseForge 未提供此插件檔案的下載。
  curseforge-unsafe-download-url: 下載地址未透過安全檢查。
  curseforge-download-integrity: 插件下載未透過完整性校驗，請重試。
  wow-addons-settings-invalid: 請檢查插件設定後重試。
  wow-addons-directory-required: 請在插件設定中填寫魔獸世界客戶端目錄。
  wow-addons-version-required: 請在插件設定中選擇相容的遊戲版本。
  wow-addons-busy: 其他插件操作正在進行，請等待完成。
  wow-addons-key-storage-unavailable: 安全金鑰儲存不可用，請重啟 魔獸陪伴精靈 後重試。
  wow-addons-key-unreadable: 魔獸陪伴精靈 無法讀取已儲存的 API 金鑰，請重新儲存。
  wow-addons-required-dependency: 必需依賴插件安裝失敗，請重試。
  wow-addons-unmanaged-conflict: 已存在未由 魔獸陪伴精靈 管理的同名插件資料夾，請先將其移走再安裝。
  wow-addons-folder-conflict: 插件資料夾與其他插件衝突，請先將其移走再安裝。
  wow-addons-unsafe-archive: 插件壓縮包包含不安全的路徑，無法安裝。
  wow-addons-install-failed: 安裝失敗，請檢查客戶端目錄後重試。
  wow-addons-invalid-directory: 客戶端目錄無效或不可用，請在插件設定中檢查路徑。
  wow-addons-invalid-archive: 插件壓縮包無效或不安全，無法安裝。
  wow-addons-directory-conflict: 已有插件資料夾與此次安裝衝突，請先將衝突資料夾移走再重試。
  wow-addons-request-failed: 插件操作失敗，請檢查客戶端目錄後重試。
  wow-addons-dependency-limit: 此插件的巢狀依賴數量過多，無法安全安裝。
  wow-addons-stopped: 插件操作已停止，請重新開啟插件中心後重試。
