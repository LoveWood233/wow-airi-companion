  item-level: 物品等級
  unknown: 未知
  limitation: 裝等和主屬性提高時，副屬性有下降也會說明取捨並詢問。特效、套裝、插槽和資料不全仍需自行復核。
  verdict:
    upgrade: 明確提升
    not_upgrade: 當前角色不適合或沒有提升
    review: 需要複核
  reason:
    empty_slot: 可使用裝備填補空槽
    stats_upgrade: 已比較屬性有提升，且沒有已記錄屬性下降
    unusable: 當前無法使用
    wrong_spec: 不符合記錄時的專精
    weaker_stats: 已比較屬性更低
    equivalent: 已比較屬性沒有提升
    incomplete: 比較資料不全或包含暫不支援的屬性
    unknown_spec: 無法確認專精適配
    weapon_change: 裝備型別不同
    complex_item: 涉及特效或裝備組合，需要自行復核
    stat_tradeoff: 屬性存在取捨
    primary_upgrade_tradeoff: 裝等與主屬性提高，但副屬性存在取捨，由你確認
    no_target: 無法確認目標槽位

loadout:
  title: 當前穿戴裝備
  description: 登入、獲取新裝備和換裝後，插件重新採集全部 19 個穿戴槽位。魔獸陪伴精靈按角色儲存最新快照，供聊天參考。
  characters: 已儲存的角色
  waiting: 正在等待本次登入的全套裝備快照，已有記錄僅代表上次採集時的裝備。
  empty: 尚未收到穿戴裝備快照。請登入角色、載入新版插件，並保持傳輸碼可見。
  received: 桌面接收時間
  observed: 遊戲採集時間
  historical: 以下為最近一次記錄的快照，不代表持續實時檢視穿戴欄。
  unknown: 未知 / 暫不可讀取
  empty-slot: 空槽位
  incomplete: 部分物品資料未完整讀取或已截斷。
  note: 空槽位與未知不同；套裝效果文字不代表效果已啟用。每角色的裝備快照不受最近 10 條獲取記錄限制。
launcher:
  title: 遊戲啟動配置
  description: 選擇戰網或魔獸世界啟動程式，為不同遊戲版本分別儲存路徑。
  configure: 配置遊戲啟動
  target: 啟動目標
  targets:
    battle-net: 戰網
    retail: 魔獸世界正式服
    forever: 魔獸世界無限服
    classic: 魔獸世界懷舊服
  default-summary: 快捷啟動目標：{target}
  path-label: '{target}程式路徑'
  path-description: 請選擇對應遊戲版本安裝子目錄內的 .exe；通用 World of Warcraft Launcher.exe
    請配置在戰網目標下。不支援快捷方式和指令碼。
  path-placeholder: 選擇 .exe 檔案或填寫完整路徑
  browse: 瀏覽程式
  make-default: 將此目標設為快捷啟動預設項
  make-default-description: 角色工具欄的啟動按鈕將啟動此處儲存的目標。
  current-default: 此目標已設為快捷啟動預設項。
  save: 校驗並儲存
  clear: 移除已儲存路徑
  retry: 重新讀取配置
  launch-game: 啟動遊戲
  launch-battle-net: 啟動戰網
  quick-launch: 遊戲快捷啟動
  quick-launch-description: 啟動已儲存的預設程式；尚未配置時開啟啟動設定。
  saved: 程式校驗透過，配置已儲存。
  cleared: 已移除儲存的程式路徑。
  launched: 已傳送啟動請求。
  unsaved: 請先校驗並儲存修改，再啟動此目標。
  launch-note: 戰網目標會開啟戰網；遊戲程式仍可能要求登入或更新。每次啟動前都會重新檢查儲存的程式。
  verified-program: 已透過校驗的程式
  errors:
    unsupported-platform: 遊戲快捷啟動目前僅支援 Windows。
    invalid-request: 啟動配置無效，請重新選擇目標和程式。
    invalid-path: 請填寫完整的本地程式路徑，不要包含命令列引數。
    file-not-found: 找不到程式，請重新選擇當前安裝位置。
    not-executable: 請選擇 Windows .exe 程式，不能選擇快捷方式、指令碼或資料夾。
    invalid-signature: 無法驗證程式的暴雪官方簽名，請選擇安裝目錄中的官方程式。
    wrong-product: 此程式不是所選目標對應的戰網或魔獸世界程式。
    wrong-version: 此魔獸世界程式屬於其他版本，請選擇對應目標或正確程式。
    unrecognized-version: 無法確認遊戲版本，請透過戰網啟動，或更新陪伴精靈以適配此版本。
    inspection-failed: 無法完成程式檢查，請確認檔案可訪問後重試。
    not-configured: 尚未配置此目標，請先選擇程式並儲存。
    storage-error: 無法讀取或儲存啟動配置，請檢查應用資料目錄的訪問許可權。
    launch-failed: 程式啟動失敗，請檢查安裝是否完整及檔案訪問許可權。
    busy: 正在處理啟動操作，請稍候。
    request-failed: 桌面服務未響應，請重試或重新啟動陪伴精靈。
screen-assist:
  title: 遊戲截圖輔助
  description: 主動請精靈檢視當前魔獸畫面，輔助判斷地形、理解任務和尋找 NPC。
  enabled: 請求檢視遊戲時截圖
  enabled-description: 明確請求檢視畫面時擷取一幀遊戲視窗，普通聊天不會觸發此截圖。
  image-use: 截圖會傳送給你選擇的視覺模型服務，原圖不儲存到本地聊天記錄。
  target: 遊戲視窗
  target-description: 自動識別要求只開啟一個魔獸視窗。多個版本同時執行時請選擇版本；同版本多開時請先關閉多餘視窗。
  games:
    auto: 自動識別
    retail: 正式服
    forever: 無限服
    classic: 懷舊服
  configure-vision: 配置視覺模型
  vision-description: 請在視覺設定中選擇支援圖片分析的服務和模型。開啟此配置頁不會截圖。
  examples-title: 在聊天中輸入或說出
  examples:
    terrain: 你幫我看看我面前這個地形，我走得過去嗎？
    quest: 任務顯示 NPC 在這裡，但是我到了沒看見，你能帶我過去嗎？
    scene: 幫我看看遊戲畫面，這個任務目標是什麼意思？
  command: 也可以用 /look 加問題明確觸發截圖，例如“/look 幫我找一下附近的入口”。移動後再次提問，精靈會檢視新畫面。
  limits: 目前支援 Windows，請保持遊戲視窗可見。單張截圖不能確認碰撞、隱藏入口或任務相位；精靈提供建議，不會操控角色。
  capturing: 正在擷取魔獸世界視窗…
  analyzing: 正在分析遊戲畫面…
  ready: 遊戲畫面分析完成，正在組織回答。
  errors:
    unsupported-platform: 遊戲截圖輔助目前僅支援 Windows。
    invalid-request: 遊戲版本選項無效，請在遊戲截圖輔助設定中重新選擇。
    game-not-found: 未找到對應的魔獸世界視窗，請開啟遊戲後再試。
    ambiguous-window: 檢測到多個對應的遊戲視窗，請選擇版本或關閉多餘視窗後再試。
    minimized-window: 遊戲視窗已最小化，請恢復視窗後再次提問。
    unverified-game: 無法驗證此遊戲視窗，請使用受支援的魔獸世界官方安裝程式。
    capture-failed: 無法擷取遊戲畫面，請保持遊戲可見，或嘗試視窗模式。
    empty-frame: 截圖為空或黑屏，請保持遊戲可見後再次提問。
    capture-timeout: 遊戲截圖超時，請稍候再次提問。
    busy: 正在處理另一項遊戲截圖，請等待完成。
    window-changed: 截圖期間遊戲視窗發生變化，請再次提問以獲取新畫面。
    vision-not-configured: 請先選擇視覺模型服務和模型，再使用遊戲截圖輔助。
    vision-failed: 視覺模型未能完成截圖分析，請檢查模型配置後重試。
    no-description: 視覺模型沒有返回畫面描述，請重試或選擇其他支援圖片分析的模型。

