no-events: 暫無事件。
gold:
  title: 金幣賬本
  description: 按本機插件帳號統計金幣流入和流出。資料隨遊戲連線更新，並儲存在這臺電腦上。
  current-balance: 當前角色持有金幣
  current-unavailable: 當前金幣暫不可用。請保持真實角色線上，並使用有效的實時畫面採集。
  empty: 尚無真實金幣記錄。請安裝更新後的插件和橋接程式，再逐個登入角色，開始建立賬本。
  storage-error: 賬本讀取或儲存失敗，當前彙總尚未確認寫入磁碟。請檢查下方儲存錯誤和磁碟剩餘空間。
  unnamed-account: 本機插件帳號
  account-id: 帳號標識
  account-name: 帳號備註
  account-name-placeholder: 例如：主帳號
  account-name-help: 最多 64 個字元，留空可移除備註。
  save-name: 儲存備註
  character-count: '已記錄角色：{count}'
  since: 桌面開始記錄於
  earned: 累計收入（流入）
  spent: 累計消耗（流出）
  net: 淨變化
  balance: 已記錄角色餘額合計
  character: 角色
  realm: 伺服器
  character-balance: 最後已知餘額
  last-seen: 最近採集時間
  characters-description: 此帳號已採集角色的最後已知餘額與累計收支。
  identity-note: 使用插件在本機儲存的帳號標識歸組，不讀取登入帳號。可為每個標識填寫備註以便區分。
  flow-note: 首次持有的餘額不算收入。郵件、交易、銀行存取及自己角色間的轉賬均計入流入或流出，不等於實際賺取或消費。
  balance-note: 餘額僅覆蓋已登入採集的角色，採用各角色最後一次採集值，並非所有角色同時實時的餘額。不包含戰團銀行餘額。
  demo-note: 示範資料不會進入真實賬本。金幣變化只更新聊天上下文，不會觸發主動語音提醒。
  money: '{sign}{gold}金 {silver}銀 {copper}銅'
status:
  disabled: 陪伴已關閉
  disconnected: 橋接服務未連線
  waiting: 等待遊戲畫面
  live: 真實角色線上
  stale: 畫面已過期
  demo: 示範資料
  paused: 採集已暫停

versions:
  label: 魔獸世界版本
  isolation: 兩個版本的連線設定、採集座標、事件、金幣記錄、裝備歷史和等級歷史獨立儲存。切換頁面會放棄尚未儲存的修改。
  retail:
    name: 魔獸世界正式服
    description: 正式服專用的陪伴設定與金幣記錄。
    capture-help: 正式服輸入 /wowc compact 縮至 64×64，再用 /wowc status 檢視起點。視窗邊框或其他顯示器會改變桌面座標。保持傳輸碼無遮擋。若單畫素顯示模糊，可用 /wowc cell 2，並將這裡的單元格大小改為 2。
  forever:
    name: 魔獸世界：無限
    description: 無限服獨立的陪伴設定與金幣記錄。
    preview: 當前為客戶端開放前的預備版本，真實遊戲相容性需待開放後驗證。陪伴連線預設關閉。
    capture-help: 安裝無限服插件後，輸入 /wowf compact 縮至 64×64，再用 /wowf status 檢視起點。填寫該客戶端的桌面座標，並保持傳輸碼無遮擋。若單畫素顯示模糊，可用 /wowf cell 2，並將這裡的單元格大小改為 2。

