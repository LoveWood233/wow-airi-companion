equipment-prompt:
  message: '恭喜獲得新裝備{name}，又能變強了！{reason}要換上這件裝備嗎？'
  message-player: '{player}，恭喜獲得新裝備{name}，又能變強了！{reason}要換上這件裝備嗎？'
  message-player-tradeoff: '{player}，恭喜獲得新裝備{name}，主屬性又能提高了！{reason}要換上這件裝備嗎？'
  reason:
    stats: '已比較當前裝備，這件已記錄的屬性有明確提升（裝等 {oldLevel} → {newLevel}）。'
    empty: 對應裝備欄位當前為空。
    tradeoff: '裝等 {oldLevel} → {newLevel}，{primary} {oldPrimary} → {newPrimary}，但{decreases}。屬性存在取捨，不保證綜合收益更高。'
    separator: '；'
  accepted: 請在遊戲內點選“確認換裝”。魔獸陪伴精靈不會向遊戲傳送輸入。
  accept: 好
  decline: 不用
  timeout: 請在 10 秒內選擇。不選擇會關閉此提醒，換裝仍需在遊戲內確認。
  description: 明確提升，或裝等和主屬性提高但副屬性有下降時，也會說明取捨並詢問；每次換裝均由你確認。

