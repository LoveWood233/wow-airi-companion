title: 魔獸陪伴精靈
description: 一起漫遊艾澤拉斯。瞭解角色狀態，在重要時刻陪你回應。
product:
  about-title: 關於魔獸陪伴精靈
  description: 魔獸世界角色陪伴、語音聊天與插件管理。
  version: 版本
  project: 專案地址
  third-party: 第三方許可
  license-note: 本軟體使用開源元件，其版權與許可證保留在原始碼和發行檔案中。
  local-provider-note: 在設定中配置聊天和語音服務，無需軟體帳號。
connection: 遊戲連線
last-seen: 最近有效畫面
demo-warning: 當前為示範資料，不代表真實遊戲角色。
model-required: 請在魔獸陪伴精靈中選擇對話服務和模型後啟用角色回應。語音沿用現有聲音設定。
start-bridge: 開啟陪伴連線後，魔獸陪伴精靈會自動啟動本機橋接，無需單獨操作。請保持插件資料傳輸碼可見。Windows 需已安裝 Python 3.10 或更高版本。
player: 當前角色
level: 等級
zone-label: 所在區域
class-spec: 職業 / 專精編號
faction: 陣營
race: 種族
identity-unknown: 未知
