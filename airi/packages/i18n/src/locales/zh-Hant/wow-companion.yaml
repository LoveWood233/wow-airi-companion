  Horde: 部落
  Neutral: 中立
activity: 活動狀態
freshness: 資料狀態
dead: 已死亡
combat: 戰鬥中
exploring: 探索中
current: 當前有效
historical: 上次已知狀態
no-character: 尚未讀取到角色。請檢查橋接服務和螢幕座標。
preferences: 陪伴偏好
preferences-description: 離開此頁面後連線仍會繼續。僅主角色視窗生成回應，避免多視窗重複播報。
options:
  enabled: 開啟陪伴
  muted: 遊戲提醒靜音
  quietInCombat: 戰鬥時免打擾
  levelUp: 升級時祝賀
  zone: 進入新區域時回應
  death: 死亡時回應
  revive: 復活後鼓勵
  allowDemo: 允許角色回應示範事件
hints:
  enabled: 將當前遊戲狀態提供給角色的對話上下文。
  muted: 繼續更新上下文，但不主動回應遊戲事件。
  quietInCombat: 保留一個重要事件，戰鬥結束後回應；超過 30 秒的事件會丟棄。
  levelUp: 只在同一角色會話內檢測等級提高。
  zone: 地圖或區域改變時回應，遵守提醒間隔。
  death: 按當前角色語氣簡短回應，可結合已知的遊戲陣營或種族調侃。
  revive: 在角色恢復生命時回應。
  allowDemo: 預設關閉。開啟後測試回應會使用已配置的模型和語音。
cooldown: 兩次回應的最小間隔（秒）
cooldown-description: 可設 0～300 秒。間隔期間只保留一個近期事件。
capture: 螢幕位置校準
capture-description: 預設每格 1 個物理畫素，佔用 64×64 畫素，已是當前黑白編碼格式的最小尺寸。座標按桌面物理畫素填寫。
capture-x: 編碼區左側 X
capture-y: 編碼區頂部 Y
cell-size: 單元格大小（畫素）
poll-ms: 採集間隔（毫秒）
pause-capture: 暫停採集
capture-help: 在遊戲輸入 /wowc compact 縮至 64×64，再用 /wowc status 檢視起點。保持傳輸碼無遮擋。若單畫素顯示模糊，可用 /wowc cell 2，並將這裡的單元格大小改為 2。
save-preferences: 儲存陪伴偏好
save-capture: 應用校準
saved: 已儲存。
failed: 操作失敗。
demo: 連線示範
demo-description: 無需登入遊戲即可測試。預設不會將示範資訊加入角色上下文，需要先明確開啟上方開關。
demo-label: 示範
start-demo: 開始示範
stop-demo: 返回真實畫面採集
actions:
  level_up: 模擬升級
  zone: 切換區域
  death: 模擬死亡
  revive: 模擬復活
  combat: 切換戰鬥狀態
events: 最近遊戲事件
