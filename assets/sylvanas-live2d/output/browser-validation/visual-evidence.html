<!doctype html><meta charset="utf-8"><title>候选模型运行截图对照</title><style>body{margin:24px;background:#303541;color:#f6f3ff;font:20px 'Microsoft YaHei',sans-serif}h1{font-size:28px;margin:0 0 8px}.scope{margin:0 0 24px;color:#c8cdda}.grid{display:grid;grid-template-columns:704px 704px;gap:22px}.card{background:#51596b;border:1px solid #8892a8;padding:10px}.card h2{font-size:23px;margin:0 0 10px}.card p{font-size:17px;line-height:1.5;margin:8px 0 0;height:52px}.crop{width:704px;height:384px;position:relative;overflow:hidden;background:#737e93}.crop img{position:absolute;width:2240px;height:2688px;left:-768px;top:-720px;max-width:none}</style><h1>候选模型：真实浏览器运行截图对照</h1><p class="scope">原始 ZIP 未修改。下图仅通过 HTML 裁切、放大实际 1400 × 1680 渲染截图。详细运行与清理错误见 report.json。</p><main class="grid"><section id="default" class="card"><h2>默认状态</h2><div class="crop"><img src="./state-0-default.png" alt="默认状态"></div><p>左右眼 1，口型 0。</p></section><section id="eyes-closed" class="card"><h2>两眼闭合 0</h2><div class="crop"><img src="./state-1-eyes-closed.png" alt="两眼闭合 0"></div><p>两条闭眼线已分离，鼻梁间隙清晰。仍为浅红直线。</p></section><section id="mouth-0" class="card"><h2>口型 0</h2><div class="crop"><img src="./state-2-mouth-0.png" alt="口型 0"></div><p>闭嘴图层 1，开嘴图层 0。</p></section><section id="mouth-0_005" class="card"><h2>口型 0.005</h2><div class="crop"><img src="./state-3-mouth-0_005.png" alt="口型 0.005"></div><p>两图层各 0.5。过渡区仍有很窄的双线。</p></section><section id="mouth-0_01" class="card"><h2>口型 0.01</h2><div class="crop"><img src="./state-4-mouth-0_01.png" alt="口型 0.01"></div><p>仅开嘴图层，呈单条细线。</p></section><section id="mouth-0_25" class="card"><h2>口型 0.25</h2><div class="crop"><img src="./state-5-mouth-0_25.png" alt="口型 0.25"></div><p>开口开始增高，没有分离的第二条嘴线。</p></section><section id="mouth-0_5" class="card"><h2>口型 0.5</h2><div class="crop"><img src="./state-6-mouth-0_5.png" alt="口型 0.5"></div><p>口型正常，旧版明显双嘴重影已消除。</p></section><section id="mouth-1" class="card"><h2>口型 1</h2><div class="crop"><img src="./state-7-mouth-1.png" alt="口型 1"></div><p>完整开口。</p></section></main>
